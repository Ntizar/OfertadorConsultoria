.nz-offcanvas__head { display: flex; align-items: center; gap: var(--nz-space-3); padding: var(--nz-space-4); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-offcanvas__body { padding: var(--nz-space-4); display: grid; gap: var(--nz-space-2); }
.nz-offcanvas__foot { display: flex; gap: var(--nz-space-2); padding: var(--nz-space-4); border-top: var(--nz-border-w) solid var(--nz-border-soft); }

/* ---- Pila de toasts (overlay de notificaciones) ---- */
.nz-toast-stack { display: grid; gap: var(--nz-space-2); width: min(100%, 26rem); }
.nz-toast-stack--end { justify-items: end; margin-left: auto; }
.nz-toast-stack__item { display: flex; align-items: center; gap: var(--nz-space-3); width: 100%; padding: var(--nz-space-3) var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-surface); box-shadow: var(--nz-shadow-lg); font-size: var(--nz-text-sm); }
.nz-toast-stack__item--ok { border-left: 3px solid var(--nz-success); }
.nz-toast-stack__item--err { border-left: 3px solid var(--nz-danger); }

/* ---- Movimiento reducido: congelar overlays, no ralentizarlos ---- */
@media (prefers-reduced-motion: reduce) {
  .nz-modal__dialog, .nz-drawer__panel, .nz-sheet__panel, .nz-popover__body, .nz-menu-pop__list, .nz-cmd__panel, .nz-tip__body, .nz-backdrop { transition: none; transform: none; }
}


/* ============================================================
   Lightbox compacto (ampliado con léxico cerrado (tanda D))   */
.nz-lightbox--compact { width: min(100%, 28rem); aspect-ratio: 4 / 3; }

/* ====== Aurora 7 v7.2.1: packs/p8-data.css ====== */
/* ============================================================
   AURORA 7 — p8-data.css · Categoría 08 · Datos, tablas y listas (139 objetos)
   Tablas (densidad, sticky, bordes, hover, toolbar, filtros, pie, celdas),
   tarjetas de dato (KPI con icono, objetivo y variantes), minigráficos,
   listas de registros, filas de lista, timeline (compacto, horizontal, tarjeta),
   definition lists, badges de datos, grid de datos, estados inline,
   árbol jerárquico, matriz de calor, tabla de comparación y número medidor.
   ============================================================ */

/* ---- Tabla ---- */
.nz-table-wrap { overflow-x: auto; border-radius: var(--nz-radius-md); border: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-table { width: 100%; border-collapse: collapse; background: var(--nz-surface); font-size: var(--nz-text-sm); min-width: 30rem; }
.nz-table thead th { background: var(--nz-bg-soft); color: var(--nz-text-mute); font-size: var(--nz-text-xs); font-weight: 800; text-transform: uppercase; letter-spacing: var(--nz-tracking-caps); text-align: left; padding: var(--nz-space-3) var(--nz-space-4); white-space: nowrap; }
.nz-table tbody td { padding: var(--nz-space-3) var(--nz-space-4); border-top: var(--nz-border-w) solid var(--nz-border-soft); color: var(--nz-text-soft); }
.nz-table tbody tr { transition: background var(--nz-dur-fast) var(--nz-ease-out); }
.nz-table tbody tr:hover { background: var(--nz-bg-soft); }
.nz-table--striped tbody tr:nth-child(even) { background: var(--nz-bg-soft); }
.nz-table--borderless { border: 0; }
.nz-table--borderless thead th { background: transparent; }
.nz-table--borderless tbody td { border-top: 0; }
.nz-table--bordered { border: var(--nz-border-w) solid var(--nz-border); }
.nz-table--bordered thead th, .nz-table--bordered tbody td { border: var(--nz-border-w) solid var(--nz-border); }
.nz-table--compact thead th, .nz-table--compact tbody td { padding: var(--nz-space-2) var(--nz-space-3); }
.nz-table--comfortable thead th, .nz-table--comfortable tbody td { padding: var(--nz-space-4) var(--nz-space-5); }
.nz-table--sm { font-size: var(--nz-text-xs); min-width: 26rem; }
.nz-table--sm thead th, .nz-table--sm tbody td { padding: var(--nz-space-2) var(--nz-space-3); }
.nz-table--sticky-head thead th { position: sticky; top: 0; z-index: var(--nz-z-raised); box-shadow: inset 0 -1px 0 var(--nz-border); }
.nz-table--hover tbody tr:hover { background: var(--nz-brand-soft); }
.nz-table th[scope="row"] { color: var(--nz-text); font-weight: 700; }
.nz-table__num { font-variant-numeric: tabular-nums; }
.nz-table__right { text-align: right; }
.nz-table__strong { color: var(--nz-text); font-weight: 700; }
.nz-table__muted { color: var(--nz-text-faint); }
.nz-table__row--selected { cursor: default; }
.nz-table tbody tr.nz-table__row--selected { background: var(--nz-brand-soft); }
.nz-table__row--clickable { cursor: pointer; }
.nz-table__caption { caption-side: top; padding: var(--nz-space-3) var(--nz-space-4); font-size: var(--nz-text-xs); font-weight: 700; color: var(--nz-text-mute); text-align: left; }
.nz-table__sort { display: inline-flex; align-items: center; gap: var(--nz-space-1); color: var(--nz-brand); cursor: pointer; }
.nz-table__sort::after { content: "▾"; font-size: var(--nz-text-2xs); }
.nz-table__cell--num { text-align: right; font-variant-numeric: tabular-nums; }
.nz-table__cell--actions { width: 1%; white-space: nowrap; text-align: right; }
.nz-table__cell--checkbox { width: 44px; text-align: center; }
.nz-table__cell--wide { min-width: 14rem; }
.nz-table__toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--nz-space-2); padding: var(--nz-space-3) var(--nz-space-4); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); background: var(--nz-surface); }
.nz-table__toolbar-spacer { flex: 1; }
.nz-table__filters { display: flex; flex-wrap: wrap; gap: var(--nz-space-2); padding: var(--nz-space-2) var(--nz-space-4); background: var(--nz-bg-soft); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-table__empty { padding: var(--nz-space-8) var(--nz-space-4); text-align: center; font-size: var(--nz-text-sm); color: var(--nz-text-mute); }
.nz-table__foot { display: flex; justify-content: space-between; gap: var(--nz-space-3); padding: var(--nz-space-3) var(--nz-space-4); font-size: var(--nz-text-xs); color: var(--nz-text-mute); border-top: var(--nz-border-w) solid var(--nz-border-soft); }

/* ---- Tabla apilable: móvil primero ----
   En pantalla estrecha cada fila es una tarjeta y cada celda lleva delante el
   nombre de su columna, que se lee del atributo data-etiqueta. Desde 640 px la
   tabla vuelve a ser una tabla. Sin JS: la etiqueta viaja en el HTML.

   El ancho mínimo del sistema (30rem) es lo que obliga a desplazar una tabla
   ancha; apilada no hace falta, así que aquí se suelta y vuelve a 640 px.

   Ojo con las combinaciones: en móvil manda este patrón (celdas a una columna,
   texto a la izquierda) y desde 640 px recupera la densidad de serie, no la de
   --compact ni el marco de --bordered. Se usa para tablas de datos que deben
   caber enteras: entregables, detalle, resúmenes. */
.nz-table--apilable { display: block; min-width: 0; background: transparent; }
.nz-table--apilable thead { display: none; }
.nz-table--apilable tbody, .nz-table--apilable tfoot { display: block; }
.nz-table--apilable tbody tr, .nz-table--apilable tfoot tr {
  display: block; padding: var(--nz-space-2) var(--nz-space-3);
  border: var(--nz-border-w) solid var(--nz-border-soft); border-radius: var(--nz-radius-md);
  background: var(--nz-surface); box-shadow: var(--nz-shadow-xs);
}
.nz-table--apilable tbody tr + tr, .nz-table--apilable tfoot tr + tr { margin-top: var(--nz-space-2); }
.nz-table--apilable tbody th, .nz-table--apilable tbody td, .nz-table--apilable tfoot td {
  display: block; padding: var(--nz-space-1) 0; border: 0; text-align: left;
}
.nz-table--apilable tbody th[scope="row"] { font-size: var(--nz-text-sm); font-weight: 800; color: var(--nz-text); }
.nz-table--apilable tbody td[data-etiqueta]::before, .nz-table--apilable tfoot td[data-etiqueta]::before {
  content: attr(data-etiqueta); display: block;
  font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps);
  text-transform: uppercase; color: var(--nz-text-mute);
}
@media (min-width: 640px) {
  .nz-table--apilable { display: table; min-width: 30rem; }
  .nz-table--apilable thead { display: table-header-group; }
  .nz-table--apilable tbody { display: table-row-group; }
  .nz-table--apilable tfoot { display: table-footer-group; }
  .nz-table--apilable tbody tr, .nz-table--apilable tfoot tr {
    display: table-row; padding: 0; margin-top: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none;
  }
  .nz-table--apilable tbody th, .nz-table--apilable tbody td, .nz-table--apilable tfoot td {
    display: table-cell; padding: var(--nz-space-3) var(--nz-space-4);
    border-top: var(--nz-border-w) solid var(--nz-border-soft); text-align: inherit;
  }
  .nz-table--apilable tbody td[data-etiqueta]::before, .nz-table--apilable tfoot td[data-etiqueta]::before { display: none; }
}
/* Envoltorio de una tabla apilable: en móvil no dibuja marco, porque el marco
   ya lo lleva cada tarjeta; desde 640 px enmarca la tabla como siempre. */
.nz-table-wrap--apilable { border: 0; border-radius: 0; overflow-x: visible; }
@media (min-width: 640px) {
  .nz-table-wrap--apilable { border: var(--nz-border-w) solid var(--nz-border-soft); border-radius: var(--nz-radius-md); overflow-x: auto; }
}

/* ---- Celda de status en tabla ---- */
.nz-table__status { display: inline-flex; align-items: center; gap: var(--nz-space-1); font-weight: 700; }
.nz-table__status i { width: 8px; height: 8px; border-radius: 50%; }
.nz-table__status--ok i { background: var(--nz-success); }
.nz-table__status--warn i { background: var(--nz-warning); }
.nz-table__status--err i { background: var(--nz-danger); }
.nz-table__status--brand i { background: var(--nz-brand); }

/* ---- KPI / tarjeta de dato ---- */
.nz-kpi { display: grid; gap: var(--nz-space-1); padding: var(--nz-space-5); border-radius: var(--nz-radius-lg); background: var(--nz-surface); box-shadow: var(--nz-shadow-sm); }
.nz-kpi__label { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-mute); }
.nz-kpi__value { font-size: var(--nz-text-2xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; color: var(--nz-text); }
.nz-kpi__value--brand { color: var(--nz-brand); }
.nz-kpi__value--accent { color: var(--nz-accent); }
.nz-kpi__delta { font-size: var(--nz-text-xs); font-weight: 700; }
.nz-kpi__delta--up { color: var(--nz-success); }
.nz-kpi__delta--down { color: var(--nz-danger); }
.nz-kpi__delta--flat { color: var(--nz-text-mute); }
.nz-kpi--brand { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-kpi--brand .nz-kpi__label, .nz-kpi--brand .nz-kpi__value, .nz-kpi--accent .nz-kpi__label, .nz-kpi--accent .nz-kpi__value { color: var(--nz-text-invert); }
.nz-kpi--accent { background: var(--nz-accent); color: var(--nz-text-invert); }
.nz-kpi--accent .nz-kpi__delta, .nz-kpi--brand .nz-kpi__delta { color: var(--nz-text-invert); opacity: .9; }
.nz-kpi--sm { padding: var(--nz-space-4); }
.nz-kpi--sm .nz-kpi__value { font-size: var(--nz-text-xl); }
.nz-kpi--lg { padding: var(--nz-space-6); }
.nz-kpi--lg .nz-kpi__value { font-size: var(--nz-text-3xl); }
.nz-kpi--bordered { box-shadow: none; border: var(--nz-border-w) solid var(--nz-border); }
.nz-kpi--inline { grid-auto-flow: column; align-items: baseline; justify-content: start; gap: var(--nz-space-3); }
.nz-kpi__icon { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--nz-radius-md); background: var(--nz-brand-soft); color: var(--nz-brand); font-size: var(--nz-text-lg); }
.nz-kpi__target { position: relative; height: 6px; margin-top: var(--nz-space-2); border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); overflow: hidden; }
.nz-kpi__target i { display: block; height: 100%; border-radius: inherit; background: var(--nz-brand); }
.nz-kpi__spark { margin-top: var(--nz-space-2); }

/* ---- Minigráfico (bars CSS) ---- */
.nz-spark { display: flex; align-items: flex-end; gap: 2px; height: 2.5rem; }
.nz-spark .nz-spark__bar { flex: 1; border-radius: var(--nz-radius-xs) var(--nz-radius-xs) 0 0; background: var(--nz-brand-soft); }
.nz-spark .nz-spark__bar:last-child { background: var(--nz-brand); }
.nz-spark .nz-spark__bar.nz-spark__bar--active { background: var(--nz-brand-strong); }
.nz-spark--brand .nz-spark__bar { background: var(--nz-brand-tint); }
.nz-spark--accent .nz-spark__bar { background: var(--nz-accent-soft); }
.nz-spark--accent .nz-spark__bar:last-child { background: var(--nz-accent); }
.nz-spark--lg { height: 4rem; }

/* ---- Fila de lista (avatar + texto + acciones) ---- */
.nz-list-row { display: flex; align-items: center; gap: var(--nz-space-3); min-height: 56px; padding: var(--nz-space-3) var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-surface); box-shadow: var(--nz-shadow-xs); }
.nz-list-row + .nz-list-row { margin-top: var(--nz-space-2); }
.nz-list-row--brand { border-left: 3px solid var(--nz-brand); }
.nz-list-row__body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.nz-list-row__title { font-size: var(--nz-text-sm); font-weight: 700; color: var(--nz-text); }
.nz-list-row__meta { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-list-row__actions { margin-left: auto; display: inline-flex; align-items: center; gap: var(--nz-space-1); }

/* ---- Lista de registros (vertical, más rica que la de layout) ---- */
.nz-records { display: grid; gap: var(--nz-space-2); }
.nz-record { display: flex; align-items: center; gap: var(--nz-space-3); padding: var(--nz-space-3) var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-surface); box-shadow: var(--nz-shadow-sm); }
.nz-record--brand { border-left: 3px solid var(--nz-brand); }
.nz-record--danger { border-left: 3px solid var(--nz-danger); }
.nz-record__body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.nz-record__title { font-weight: 700; font-size: var(--nz-text-sm); color: var(--nz-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nz-record__meta { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-record__meta--error { color: var(--nz-danger); }
.nz-record__meta--brand { color: var(--nz-brand); }
.nz-record__value { font-size: var(--nz-text-sm); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--nz-text); }
.nz-record__value--brand { color: var(--nz-brand); }
.nz-record__tag { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-mute); }
.nz-record__thumb { width: 44px; height: 44px; flex: none; border-radius: var(--nz-radius-sm); overflow: hidden; background: var(--nz-bg-inset); }
.nz-record__avatar { width: 40px; height: 40px; flex: none; display: inline-grid; place-items: center; border-radius: 50%; background: var(--nz-brand-soft); color: var(--nz-brand); font-weight: 800; font-size: var(--nz-text-sm); }
.nz-record__actions { margin-left: auto; display: inline-flex; align-items: center; gap: var(--nz-space-1); }

/* ---- Timeline ---- */
.nz-timeline { position: relative; display: flex; flex-direction: column; gap: var(--nz-space-4); padding-left: var(--nz-space-5); }
.nz-timeline::before { content: ""; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--nz-border); border-radius: var(--nz-radius-full); }
.nz-timeline__item { position: relative; }
.nz-timeline__dot { position: absolute; left: calc(-1 * var(--nz-space-5) - 1px); top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--nz-brand); border: 3px solid var(--nz-surface); box-shadow: var(--nz-shadow-sm); }
.nz-timeline__dot--brand { box-shadow: 0 0 0 4px var(--nz-brand-soft); }
.nz-timeline__dot--accent { background: var(--nz-accent); }
.nz-timeline__dot--success { background: var(--nz-success); }
.nz-timeline__dot--error { background: var(--nz-danger); }
.nz-timeline__dot--muted { background: var(--nz-text-faint); }
.nz-timeline__time { font-size: var(--nz-text-2xs); font-weight: 700; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-faint); }
.nz-timeline__title { font-weight: 700; font-size: var(--nz-text-sm); color: var(--nz-text); }
.nz-timeline__desc { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-timeline__card { margin-top: var(--nz-space-2); padding: var(--nz-space-3); border-radius: var(--nz-radius-md); background: var(--nz-surface); box-shadow: var(--nz-shadow-sm); font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-timeline--brand::before { background: var(--nz-brand-soft); }
.nz-timeline--compact { gap: var(--nz-space-3); padding-left: var(--nz-space-4); }
.nz-timeline--compact .nz-timeline__dot { left: calc(-1 * var(--nz-space-4) - 1px); width: 12px; height: 12px; border-width: 2px; }
.nz-timeline--horizontal { flex-direction: row; align-items: flex-start; gap: var(--nz-space-4); padding: var(--nz-space-5) 0 0; overflow-x: auto; }
.nz-timeline--horizontal::before { left: 0; right: 0; top: 7px; bottom: auto; width: auto; height: 2px; }
.nz-timeline--horizontal .nz-timeline__item { flex: 1 0 8rem; }
.nz-timeline--horizontal .nz-timeline__dot { left: 0; top: calc(-1 * var(--nz-space-5) - 1px); }

/* ---- Resumen / definition list ---- */
.nz-dl { display: grid; gap: var(--nz-space-3); }
.nz-dl__row { display: flex; justify-content: space-between; gap: var(--nz-space-4); padding: var(--nz-space-3) 0; border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-dl__dt { font-size: var(--nz-text-sm); color: var(--nz-text-mute); }
.nz-dl__dd { font-size: var(--nz-text-sm); font-weight: 700; color: var(--nz-text); text-align: right; font-variant-numeric: tabular-nums; }
.nz-dl__dd--brand { color: var(--nz-brand); }
.nz-dl--2col { grid-template-columns: 1fr 1fr; gap: var(--nz-space-4); }
.nz-dl--2col .nz-dl__row { flex-direction: column; gap: var(--nz-space-1); border-bottom: 0; }
.nz-dl--2col .nz-dl__dd { text-align: left; }
.nz-dl--3col { grid-template-columns: 1fr 1fr; gap: var(--nz-space-3); }
.nz-dl--3col .nz-dl__row { flex-direction: column; gap: var(--nz-space-1); padding: 0; border-bottom: 0; }
.nz-dl--3col .nz-dl__dd { text-align: left; }
@media (min-width: 640px) { .nz-dl--3col { grid-template-columns: repeat(3, 1fr); } }
.nz-dl--inline { display: flex; flex-wrap: wrap; gap: var(--nz-space-2) var(--nz-space-5); }
.nz-dl--inline .nz-dl__row { flex: none; padding: 0; gap: var(--nz-space-2); border-bottom: 0; }
.nz-dl--striped .nz-dl__row { padding-inline: var(--nz-space-3); border-radius: var(--nz-radius-sm); border-bottom: 0; }
.nz-dl--striped .nz-dl__row:nth-child(odd) { background: var(--nz-bg-soft); }

/* ---- Badges de datos (números) ---- */
.nz-stat-badge { display: inline-flex; align-items: baseline; gap: var(--nz-space-1); font-variant-numeric: tabular-nums; }
.nz-stat-badge b { font-size: var(--nz-text-lg); font-weight: 800; color: var(--nz-text); }
.nz-stat-badge span { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }

/* ---- Grid de tarjetas de datos ---- */
.nz-datagrid { display: grid; gap: var(--nz-space-3); grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); }
.nz-datagrid--dense { gap: var(--nz-space-2); grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr)); }
.nz-datagrid--zebra { gap: var(--nz-space-2); }
.nz-datagrid__cell--edit { border: var(--nz-border-w) dashed var(--nz-border-strong); border-radius: var(--nz-radius-md); padding: var(--nz-space-3); background: var(--nz-surface); }

/* ---- Número medidor (gauge numérico) ---- */
.nz-gauge-num { display: grid; gap: var(--nz-space-1); }
.nz-gauge-num__value { font-size: var(--nz-text-4xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); line-height: var(--nz-leading-tight); font-variant-numeric: tabular-nums; color: var(--nz-text); }
.nz-gauge-num__unit { margin-left: var(--nz-space-1); font-size: var(--nz-text-lg); font-weight: 700; color: var(--nz-text-mute); }
.nz-gauge-num__delta { display: inline-flex; align-items: center; gap: var(--nz-space-1); font-size: var(--nz-text-sm); font-weight: 700; color: var(--nz-text-mute); }
.nz-gauge-num__delta--up { color: var(--nz-success); }
.nz-gauge-num__delta--down { color: var(--nz-danger); }
.nz-gauge-num__label { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-gauge-num--brand .nz-gauge-num__value { color: var(--nz-brand); }

/* ---- Etiqueta con icono de estado (inline) ---- */
.nz-inlinestat { display: inline-flex; align-items: center; gap: var(--nz-space-2); font-size: var(--nz-text-sm); font-weight: 600; }
.nz-inlinestat i { width: 10px; height: 10px; border-radius: 50%; }
.nz-inlinestat--ok i { background: var(--nz-success); }
.nz-inlinestat--warn i { background: var(--nz-warning); }
.nz-inlinestat--err i { background: var(--nz-danger); }
.nz-inlinestat--brand { color: var(--nz-brand); }
.nz-inlinestat--brand i { background: var(--nz-brand); }
.nz-inlinestat--muted { color: var(--nz-text-mute); }
.nz-inlinestat--muted i { background: var(--nz-text-faint); }

/* ---- Árbol jerárquico (details/summary, sin JS) ---- */
.nz-arbol { display: grid; gap: var(--nz-space-1); font-size: var(--nz-text-sm); }
.nz-arbol__node { display: block; }
.nz-arbol summary.nz-arbol__toggle { list-style: none; }
.nz-arbol__toggle { display: flex; align-items: center; gap: var(--nz-space-2); min-height: 44px; padding: 0 var(--nz-space-3); border-radius: var(--nz-radius-sm); cursor: pointer; color: var(--nz-text-soft); font-weight: 600; }
.nz-arbol__toggle::before { content: "▸"; color: var(--nz-text-faint); font-size: var(--nz-text-xs); }
.nz-arbol__node[open] > .nz-arbol__toggle { color: var(--nz-text); }
.nz-arbol__node[open] > .nz-arbol__toggle::before { content: "▾"; color: var(--nz-brand); }
.nz-arbol__group { margin-left: var(--nz-space-5); padding-left: var(--nz-space-2); border-left: var(--nz-border-w) solid var(--nz-border-soft); display: grid; gap: var(--nz-space-1); }
.nz-arbol__leaf { display: flex; align-items: center; gap: var(--nz-space-2); min-height: 44px; margin-left: var(--nz-space-5); padding: 0 var(--nz-space-3); border-radius: var(--nz-radius-sm); color: var(--nz-text-soft); font-size: var(--nz-text-sm); text-decoration: none; }
.nz-arbol__leaf:hover { background: var(--nz-bg-soft); color: var(--nz-text); }

/* ---- Matriz de calor ---- */
.nz-matrix { display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, 1fr); gap: 3px; }
.nz-matrix__cell { min-height: 28px; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-matrix__cell--low { background: var(--nz-brand-soft); }
.nz-matrix__cell--mid { background: var(--nz-brand-tint); }
.nz-matrix__cell--high { background: var(--nz-brand); }
.nz-matrix__cell--top { background: var(--nz-brand-strong); }
.nz-matrix__label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); font-variant-numeric: tabular-nums; }

/* ---- Tabla de comparación con columna destacada ---- */
.nz-compare { width: 100%; border-collapse: collapse; font-size: var(--nz-text-sm); background: var(--nz-surface); }
.nz-compare th, .nz-compare td { padding: var(--nz-space-3) var(--nz-space-4); text-align: left; border-top: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-compare__head { color: var(--nz-text-mute); font-size: var(--nz-text-xs); font-weight: 800; text-transform: uppercase; letter-spacing: var(--nz-tracking-caps); }
.nz-compare__feature { color: var(--nz-text); font-weight: 700; }
.nz-compare__col--featured { background: var(--nz-brand-soft); }
.nz-compare__check { color: var(--nz-success); font-weight: 800; }
.nz-compare__no { color: var(--nz-text-faint); }
.nz-compare__foot { font-size: var(--nz-text-xs); color: var(--nz-text-mute); padding: var(--nz-space-3) var(--nz-space-4); }


/* ============================================================
   Estados de arbol, densidad y tono de registros (lexico)      */
.nz-arbol__node.is-selected > .nz-arbol__toggle,
.nz-arbol__leaf.is-selected { background: var(--nz-brand-soft); color: var(--nz-brand); }
.nz-arbol__leaf.is-error { color: var(--nz-danger); }
.nz-arbol__leaf.is-done { color: var(--nz-success); }
.nz-records--dense { gap: var(--nz-space-1); }
.nz-records--spacious { gap: var(--nz-space-4); }
.nz-record--success { box-shadow: inset 3px 0 0 var(--nz-success), var(--nz-shadow-sm); }
.nz-record--warning { box-shadow: inset 3px 0 0 var(--nz-warning), var(--nz-shadow-sm); }
.nz-record.is-selected { box-shadow: 0 0 0 2px var(--nz-brand), var(--nz-shadow-sm); }

/* ====== Aurora 7 v7.2.1: packs/p13-charts.css ====== */
/* ============================================================
   AURORA 7 — p13-charts.css · Categoría 13 · Gráficos y visualización
   Visualización de datos sin librerías: barras, línea, área, donut,
   medidor, mapa de calor, calendario de calor, treemap, embudo, bullet,
   radar, dispersión, cascada y diagrama de flujo.
   Las formas que el CSS no dibuja van en SVG inline ESTILIZADO POR CLASES
   (fill/stroke en el CSS, nunca en el atributo). Cero gradientes, cero glass.
   Todo el color sale de tokens, así que el modo oscuro funciona solo.
   ============================================================ */

/* ---- Tarjeta de gráfico ---- */
.nz-chart { display: flex; flex-direction: column; gap: var(--nz-space-3); padding: var(--nz-space-4); border-radius: var(--nz-radius-lg); background: var(--nz-surface); box-shadow: var(--nz-shadow-sm); }
.nz-chart--bordered { box-shadow: none; border: var(--nz-border-w) solid var(--nz-border); }
.nz-chart--flat { box-shadow: none; background: var(--nz-bg-soft); }
.nz-chart--sm { padding: var(--nz-space-3); gap: var(--nz-space-2); }
.nz-chart--lg { padding: var(--nz-space-6); gap: var(--nz-space-4); }
.nz-chart__head { display: flex; align-items: flex-start; gap: var(--nz-space-3); flex-wrap: wrap; }
.nz-chart__title { font-size: var(--nz-text-md); font-weight: 700; letter-spacing: var(--nz-tracking-tight); }
.nz-chart__sub { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-chart__actions { margin-left: auto; display: flex; gap: var(--nz-space-2); align-items: center; }
.nz-chart__body { position: relative; min-height: 8rem; }
.nz-chart__grid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.nz-chart__grid-line { border-top: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-chart__axis { display: flex; justify-content: space-between; font-size: var(--nz-text-2xs); color: var(--nz-text-faint); padding-top: var(--nz-space-1); }
.nz-chart__axis-label { color: var(--nz-text-mute); font-size: var(--nz-text-2xs); }
.nz-chart__target { position: absolute; left: 0; right: 0; border-top: var(--nz-border-w) dashed var(--nz-border-strong); }
.nz-chart__target--accent { border-top-color: var(--nz-accent); }
.nz-chart__mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--nz-text); opacity: .5; }
.nz-chart__mark-label { position: absolute; top: 0; transform: translateX(-50%); font-size: var(--nz-text-2xs); color: var(--nz-text-soft); white-space: nowrap; }
.nz-chart__foot { display: flex; gap: var(--nz-space-3); align-items: center; flex-wrap: wrap; }
.nz-chart__source { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-chart__empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--nz-space-1); min-height: 8rem; color: var(--nz-text-mute); font-size: var(--nz-text-sm); text-align: center; }
.nz-chart__loading { display: flex; align-items: center; justify-content: center; gap: var(--nz-space-2); min-height: 8rem; color: var(--nz-text-mute); font-size: var(--nz-text-sm); }

/* ---- Leyenda ---- */
.nz-legend { display: flex; flex-wrap: wrap; gap: var(--nz-space-2) var(--nz-space-4); }
.nz-legend--vertical { flex-direction: column; gap: var(--nz-space-1); }
.nz-legend__item { display: inline-flex; align-items: center; gap: var(--nz-space-2); font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-legend__swatch { width: 10px; height: 10px; border-radius: var(--nz-radius-xs); background: var(--nz-border-strong); flex: none; }
.nz-legend__swatch--brand { background: var(--nz-brand); }
.nz-legend__swatch--accent { background: var(--nz-accent); }
.nz-legend__swatch--success { background: var(--nz-success); }
.nz-legend__swatch--warning { background: var(--nz-warning); }
.nz-legend__swatch--danger { background: var(--nz-danger); }
.nz-legend__swatch--muted { background: var(--nz-border-strong); }

/* ---- Barras verticales ---- */
.nz-chart-bar { display: flex; align-items: flex-end; gap: var(--nz-space-2); min-height: 8rem; }
.nz-chart-bar--sm { min-height: 5rem; }
.nz-chart-bar--lg { min-height: 12rem; }
.nz-chart-bar__col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: var(--nz-space-1); height: 100%; }
.nz-chart-bar__bar { width: 100%; max-width: 3rem; border-radius: var(--nz-radius-sm) var(--nz-radius-sm) 0 0; background: var(--nz-brand); min-height: 2px; transition: transform var(--nz-dur-base) var(--nz-ease-out); }
.nz-chart-bar__col:hover .nz-chart-bar__bar { transform: scaleY(1.02); transform-origin: bottom; }
.nz-chart-bar__bar--brand { background: var(--nz-brand); }
.nz-chart-bar__bar--accent { background: var(--nz-accent); }
.nz-chart-bar__bar--success { background: var(--nz-success); }
.nz-chart-bar__bar--warning { background: var(--nz-warning); }
.nz-chart-bar__bar--danger { background: var(--nz-danger); }
.nz-chart-bar__bar--muted { background: var(--nz-border-strong); }
.nz-chart-bar__value { font-size: var(--nz-text-2xs); font-weight: 700; color: var(--nz-text-soft); font-variant-numeric: tabular-nums; }
.nz-chart-bar__label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-chart-bar--grouped .nz-chart-bar__col { flex-direction: row; align-items: flex-end; justify-content: center; gap: var(--nz-space-1); }
.nz-chart-bar__group { display: flex; align-items: flex-end; gap: 2px; width: 100%; height: 100%; justify-content: center; }
.nz-chart-bar--stacked .nz-chart-bar__bar { display: flex; flex-direction: column-reverse; border-radius: 0; padding: 0; overflow: hidden; background: transparent; }
.nz-chart-bar__seg { display: block; width: 100%; background: var(--nz-brand); }
.nz-chart-bar__seg--brand { background: var(--nz-brand); }
.nz-chart-bar__seg--accent { background: var(--nz-accent); }
.nz-chart-bar__seg--muted { background: var(--nz-border-strong); }
.nz-chart-bar--stacked .nz-chart-bar__bar > :first-child { border-radius: 0 0 var(--nz-radius-sm) var(--nz-radius-sm); }
.nz-chart-bar--stacked .nz-chart-bar__bar > :last-child { border-radius: var(--nz-radius-sm) var(--nz-radius-sm) 0 0; }
.nz-chart-bar--neg { align-items: stretch; }
.nz-chart-bar__zero { border-top: var(--nz-border-w) solid var(--nz-border); width: 100%; }
.nz-chart-bar--horizontal { flex-direction: column; min-height: 0; }
.nz-chart-bar--horizontal .nz-chart-bar__col { flex-direction: row; align-items: center; justify-content: flex-start; gap: var(--nz-space-2); width: 100%; height: auto; min-height: 24px; }
.nz-chart-bar--horizontal .nz-chart-bar__bar { height: 12px; max-width: none; border-radius: 0 var(--nz-radius-sm) var(--nz-radius-sm) 0; }
.nz-chart-bar--horizontal .nz-chart-bar__label { width: 5rem; flex: none; text-align: right; color: var(--nz-text-soft); }

/* ---- Línea y área (SVG estilizado por clases) ---- */
.nz-chart-line { position: relative; }
.nz-chart-line__svg { width: 100%; height: 10rem; display: block; overflow: visible; }
.nz-chart-line--sm .nz-chart-line__svg { height: 6rem; }
.nz-chart-line--lg .nz-chart-line__svg { height: 14rem; }
.nz-chart-line__area { fill: var(--nz-brand-soft); stroke: none; }
.nz-chart-line__path { fill: none; stroke: var(--nz-brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nz-chart-line__path--accent { stroke: var(--nz-accent); }
.nz-chart-line__path--muted { stroke: var(--nz-border-strong); }
.nz-chart-line__path--dashed { stroke-dasharray: 4 4; }
.nz-chart-line__dot { fill: var(--nz-surface); stroke: var(--nz-brand); stroke-width: 2; }
.nz-chart-line__dot--accent { stroke: var(--nz-accent); }
.nz-chart-line__dot--active { fill: var(--nz-brand); stroke: var(--nz-brand); }
.nz-chart-line--multi .nz-chart-line__area { fill: none; }

/* ---- Sparkline ---- */
.nz-sparkline { display: flex; align-items: flex-end; gap: 2px; height: 2rem; }
.nz-sparkline--lg { height: 3rem; }
.nz-sparkline__bar { flex: 1 1 0; min-height: 2px; border-radius: var(--nz-radius-xs); background: var(--nz-border-strong); }
.nz-sparkline--brand .nz-sparkline__bar { background: var(--nz-brand); }
.nz-sparkline--accent .nz-sparkline__bar { background: var(--nz-accent); }
.nz-sparkline--area .nz-sparkline__bar { border-radius: var(--nz-radius-xs) var(--nz-radius-xs) 0 0; }

/* ---- Donut (SVG) ---- */
.nz-chart-donut { position: relative; display: inline-grid; place-items: center; }
.nz-chart-donut__svg { width: 8rem; height: 8rem; transform: rotate(-90deg); }
.nz-chart-donut--sm .nz-chart-donut__svg { width: 5rem; height: 5rem; }
.nz-chart-donut--lg .nz-chart-donut__svg { width: 11rem; height: 11rem; }
.nz-chart-donut__track { fill: none; stroke: var(--nz-bg-inset); stroke-width: 6; }
.nz-chart-donut__seg { fill: none; stroke: var(--nz-brand); stroke-width: 6; stroke-linecap: butt; }
.nz-chart-donut__seg--brand { stroke: var(--nz-brand); }
.nz-chart-donut__seg--accent { stroke: var(--nz-accent); }
.nz-chart-donut__seg--success { stroke: var(--nz-success); }
.nz-chart-donut__seg--muted { stroke: var(--nz-border-strong); }
.nz-chart-donut__center { position: absolute; display: grid; place-items: center; text-align: center; }
.nz-chart-donut__value { font-size: var(--nz-text-xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; }
.nz-chart-donut__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }

/* ---- Medidor semicircular ---- */
.nz-chart-gauge { position: relative; display: grid; place-items: center; }
.nz-chart-gauge__svg { width: 10rem; height: 5.5rem; }
.nz-chart-gauge--lg .nz-chart-gauge__svg { width: 13rem; height: 7rem; }
.nz-chart-gauge__track { fill: none; stroke: var(--nz-bg-inset); stroke-width: 10; stroke-linecap: round; }
.nz-chart-gauge__fill { fill: none; stroke: var(--nz-brand); stroke-width: 10; stroke-linecap: round; }
.nz-chart-gauge__fill--accent { stroke: var(--nz-accent); }
.nz-chart-gauge__fill--success { stroke: var(--nz-success); }
.nz-chart-gauge__fill--warning { stroke: var(--nz-warning); }
.nz-chart-gauge__fill--danger { stroke: var(--nz-danger); }
.nz-chart-gauge__value { position: absolute; bottom: 0; font-size: var(--nz-text-2xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; }
.nz-chart-gauge__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }

/* ---- Mapa de calor ---- */
.nz-heatmap { display: grid; gap: var(--nz-space-1); }
.nz-heatmap__row { display: grid; grid-template-columns: 4.5rem repeat(7, 1fr); gap: var(--nz-space-1); align-items: center; }
.nz-heatmap__row-label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }
.nz-heatmap__col-label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); text-align: center; }
.nz-heatmap__cell { aspect-ratio: 1 / 1; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-heatmap__cell--0 { background: var(--nz-bg-inset); }
.nz-heatmap__cell--1 { background: var(--nz-brand-soft); }
.nz-heatmap__cell--2 { background: var(--nz-brand-tint); }
.nz-heatmap__cell--3 { background: var(--nz-blue-300); }
.nz-heatmap__cell--4 { background: var(--nz-brand); }
.nz-heatmap__scale { display: flex; align-items: center; gap: var(--nz-space-1); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-heatmap__scale-step { width: 12px; height: 12px; border-radius: var(--nz-radius-xs); }

/* ---- Calendario de calor ---- */
.nz-heatcalendar { display: grid; gap: var(--nz-space-1); }
.nz-heatcalendar__months { display: grid; grid-auto-flow: column; gap: 3px; font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-heatcalendar__grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
.nz-heatcalendar__day { width: 12px; height: 12px; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-heatcalendar__day--0 { background: var(--nz-bg-inset); }
.nz-heatcalendar__day--1 { background: var(--nz-brand-soft); }
.nz-heatcalendar__day--2 { background: var(--nz-brand-tint); }
.nz-heatcalendar__day--3 { background: var(--nz-blue-300); }
.nz-heatcalendar__day--4 { background: var(--nz-brand); }
.nz-heatcalendar__day--hoy { outline: 2px solid var(--nz-accent); outline-offset: 1px; }
.nz-heatcalendar__legend { display: flex; align-items: center; gap: var(--nz-space-1); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }

/* ---- Treemap ---- */
.nz-treemap { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 4rem; gap: 3px; }
.nz-treemap__cell { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: var(--nz-space-2); border-radius: var(--nz-radius-sm); background: var(--nz-brand); color: var(--nz-text-invert); overflow: hidden; }
.nz-treemap__cell--lg { grid-column: span 2; grid-row: span 2; }
.nz-treemap__cell--brand { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-treemap__cell--accent { background: var(--nz-accent); color: var(--nz-gray-0); }
.nz-treemap__cell--muted { background: var(--nz-bg-inset); color: var(--nz-text-soft); }
.nz-treemap__label { font-size: var(--nz-text-2xs); font-weight: 700; }
.nz-treemap__value { font-size: var(--nz-text-2xs); opacity: .85; font-variant-numeric: tabular-nums; }

/* ---- Embudo ---- */
.nz-funnel { display: grid; gap: var(--nz-space-2); }
.nz-funnel__step { display: grid; gap: 2px; }
.nz-funnel__bar { height: 28px; border-radius: var(--nz-radius-sm); background: var(--nz-brand); margin-inline: auto; }
.nz-funnel__bar--brand { background: var(--nz-brand); }
.nz-funnel__bar--accent { background: var(--nz-accent); }
.nz-funnel__bar--muted { background: var(--nz-border-strong); }
.nz-funnel__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); text-align: center; }
.nz-funnel__value { font-size: var(--nz-text-2xs); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

/* ---- Bullet chart ---- */
.nz-bullet { display: grid; grid-template-columns: 6rem 1fr auto; align-items: center; gap: var(--nz-space-3); }
.nz-bullet__label { font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-bullet__track { position: relative; height: 14px; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-bullet__ranges { position: absolute; inset: 0; border-radius: inherit; background: var(--nz-surface-2); width: 100%; }
.nz-bullet__value { position: absolute; inset-block: 3px; left: 0; border-radius: var(--nz-radius-xs); background: var(--nz-brand); }
.nz-bullet__value--brand { background: var(--nz-brand); }
.nz-bullet__value--accent { background: var(--nz-accent); }
.nz-bullet__value--success { background: var(--nz-success); }
.nz-bullet__target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--nz-text); }
.nz-bullet__num { font-size: var(--nz-text-xs); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--nz-text-soft); }

/* ---- Tabla de barras ---- */
.nz-chart-tablebar { display: grid; gap: var(--nz-space-2); }
.nz-chart-tablebar__row { display: grid; grid-template-columns: 8rem 1fr 3.5rem; align-items: center; gap: var(--nz-space-2); }
.nz-chart-tablebar__name { font-size: var(--nz-text-xs); color: var(--nz-text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nz-chart-tablebar__track { height: 10px; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); overflow: hidden; }
.nz-chart-tablebar__bar { display: block; height: 100%; border-radius: inherit; background: var(--nz-brand); }
.nz-chart-tablebar__num { font-size: var(--nz-text-xs); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* ---- Comparativa de dos series ---- */
.nz-chart-compare { display: grid; gap: var(--nz-space-2); }
.nz-chart-compare__row { display: grid; grid-template-columns: 6rem 1fr 3rem; align-items: center; gap: var(--nz-space-2); }
.nz-chart-compare__name { font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-chart-compare__pair { display: flex; gap: 2px; align-items: center; }
.nz-chart-compare__bar { height: 10px; border-radius: var(--nz-radius-full); }
.nz-chart-compare__bar--a { background: var(--nz-brand); }
.nz-chart-compare__bar--b { background: var(--nz-accent); }
.nz-chart-compare__num { font-size: var(--nz-text-2xs); text-align: right; font-variant-numeric: tabular-nums; color: var(--nz-text-mute); }

/* ---- Radar (SVG) ---- */
.nz-chart-radar { display: grid; place-items: center; }
.nz-chart-radar__svg { width: 11rem; height: 11rem; }
.nz-chart-radar__web { fill: none; stroke: var(--nz-border); stroke-width: 1; }
.nz-chart-radar__axis { stroke: var(--nz-border-soft); stroke-width: 1; }
.nz-chart-radar__area { fill: var(--nz-brand-soft); stroke: var(--nz-brand); stroke-width: 2; }
.nz-chart-radar__label { fill: var(--nz-text-mute); font-size: var(--nz-text-2xs); }

/* ---- Dispersión ---- */
.nz-chart-scatter { position: relative; height: 10rem; border-left: var(--nz-border-w) solid var(--nz-border); border-bottom: var(--nz-border-w) solid var(--nz-border); }
.nz-chart-scatter__area { position: absolute; inset: 0; }
.nz-chart-scatter__dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--nz-border-strong); transform: translate(-50%, 50%); }
.nz-chart-scatter__dot--brand { background: var(--nz-brand); }
.nz-chart-scatter__dot--accent { background: var(--nz-accent); }
.nz-chart-scatter__x { position: absolute; bottom: calc(var(--nz-space-4) * -1); left: 50%; transform: translateX(-50%); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-chart-scatter__y { position: absolute; top: 50%; left: calc(var(--nz-space-4) * -1); transform: translateY(-50%) rotate(-90deg); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }

/* ---- Cascada ---- */
.nz-chart-waterfall { display: flex; align-items: flex-end; gap: var(--nz-space-2); min-height: 9rem; }
.nz-chart-waterfall__col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: var(--nz-space-1); height: 100%; }
.nz-chart-waterfall__bar { width: 100%; max-width: 2.5rem; border-radius: var(--nz-radius-sm); background: var(--nz-border-strong); }
.nz-chart-waterfall__bar--up { background: var(--nz-success); }
.nz-chart-waterfall__bar--down { background: var(--nz-danger); }
.nz-chart-waterfall__bar--total { background: var(--nz-brand); }
.nz-chart-waterfall__label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }

/* ---- Diagrama de flujo (sankey simple) ---- */
.nz-chart-flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--nz-space-4); align-items: center; }
.nz-chart-flow__node { padding: var(--nz-space-2) var(--nz-space-3); border-radius: var(--nz-radius-md); background: var(--nz-brand-soft); color: var(--nz-brand); font-size: var(--nz-text-xs); font-weight: 700; text-align: center; }
.nz-chart-flow__node--brand { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-chart-flow__node--accent { background: var(--nz-accent-soft); color: var(--nz-accent-strong); }
.nz-chart-flow__node--muted { background: var(--nz-bg-inset); color: var(--nz-text-soft); }
.nz-chart-flow__link { height: 6px; border-radius: var(--nz-radius-full); background: var(--nz-border-strong); }
.nz-chart-flow__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); text-align: center; }

/* ---- Selector de rango temporal ---- */
.nz-chart-range { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); }
.nz-chart-range__btn { min-height: 32px; padding: 0 var(--nz-space-3); border: 0; border-radius: var(--nz-radius-full); background: transparent; color: var(--nz-text-soft); font: inherit; font-size: var(--nz-text-2xs); font-weight: 700; cursor: pointer; }
.nz-chart-range__btn[aria-pressed="true"] { background: var(--nz-surface); color: var(--nz-text); box-shadow: var(--nz-shadow-xs); }

/* ---- Cifra con sparkline ---- */
.nz-chart-stat { display: grid; gap: var(--nz-space-1); }
.nz-chart-stat__label { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-chart-stat__value { font-size: var(--nz-text-2xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; }
.nz-chart-stat__unit { font-size: var(--nz-text-sm); font-weight: 600; color: var(--nz-text-mute); margin-left: 2px; }
.nz-chart-stat__delta { font-size: var(--nz-text-xs); font-weight: 700; }
.nz-chart-stat__delta--up { color: var(--nz-success); }
.nz-chart-stat__delta--down { color: var(--nz-danger); }
.nz-chart-stat__delta--flat { color: var(--nz-text-mute); }
.nz-chart-stat__spark { margin-top: var(--nz-space-1); }

/* ---- Mini barras dentro de una celda/tabla ---- */
.nz-chart-mini { display: inline-flex; align-items: flex-end; gap: 2px; height: 1rem; }
.nz-chart-mini__bar { width: 3px; border-radius: var(--nz-radius-xs); background: var(--nz-border-strong); }
.nz-chart-mini__bar--brand { background: var(--nz-brand); }
.nz-chart-mini__bar--accent { background: var(--nz-accent); }

@media (min-width: 640px) {
  .nz-chart-bar--horizontal .nz-chart-bar__label { width: 7rem; }
  .nz-bullet { grid-template-columns: 8rem 1fr auto; }
}
@media (min-width: 960px) {
  .nz-chart__body { min-height: 10rem; }
  .nz-chart-line__svg { height: 12rem; }
}


/* ============================================================
   Tono semantico de series (lexico cerrado)                    */
.nz-chart-line--brand { border-color: var(--nz-brand); }
.nz-chart-line--accent { border-color: var(--nz-accent); }
.nz-chart-line--success { border-color: var(--nz-success); }
.nz-chart-line--danger { border-color: var(--nz-danger); }
.nz-chart-mini__bar { flex: 1 1 auto; min-width: 3px; background: var(--nz-accent); border-radius: 1px 1px 0 0; }
.nz-chart-mini__bar--brand { background: var(--nz-brand); }
.nz-chart-mini__bar--success { background: var(--nz-success); }
.nz-chart-mini__bar--danger { background: var(--nz-danger); }
.nz-chart-mini__bar--warning { background: var(--nz-warning); }

/* ====== CSS propio de la aplicación ====== */
/* =====================================================================
   Planifica v4 — CSS propio
   SOLO estructura y disposición (.pa-*). Colores, formas y tipografía vienen
   de los tokens de Aurora 7. El acento del sistema (--nz-accent, naranja de
   Aurora) se usa para lo que debe destacar: barras del Gantt, marcadores de
   entregable y foco de los campos.
   ===================================================================== */

/* ---------- Filas y rejillas ---------- */
.pa-fila { display: flex; flex-wrap: wrap; gap: var(--nz-space-2); align-items: center; }
.pa-fila--fin { justify-content: flex-end; }
.pa-fila--apretada { gap: var(--nz-space-1); }
.pa-crece { flex: 1; min-width: 170px; }
.pa-crece2 { flex: 2; min-width: 210px; }
.pa-ancho { grid-column: 1 / -1; }
.pa-espacio { flex: 1; }
.pa-ahora { white-space: nowrap; }
.pa-mini { font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.pa-mini--fuerte { font-weight: 700; color: var(--nz-text); }
.pa-bloque { margin-bottom: var(--nz-space-4); }
.pa-celda-importe { min-width: 7rem; text-align: right; }

/* ---------- Cabecera y pie ---------- */
.pa-logo { height: 26px; max-width: 150px; object-fit: contain; display: block; }
.pa-cabecera { margin: var(--nz-space-3) 0 var(--nz-space-2); }
.pa-pie { position: fixed; bottom: 0; left: 0; right: 0; }
.pa-bloque-gantt { margin: var(--nz-space-3) 0; }

/* ---------- Formularios ---------- */
.pa-input-num { max-width: 5rem; text-align: right; }
.pa-input-corto { max-width: 4rem; }
.pa-input-fecha { max-width: 10rem; }
.pa-input-inline { border: 0; background: transparent; padding: 0 var(--nz-space-1); }
.pa-input-inline:focus { background: var(--nz-surface); border-radius: var(--nz-radius-sm); }

/* =====================================================================
   CALENDARIO Y GANTT
   ===================================================================== */

.pa-calendario {
  display: flex; flex-wrap: wrap; gap: var(--nz-space-2); align-items: center;
  padding: var(--nz-space-2) var(--nz-space-3);
  border: 1px solid var(--nz-border); border-radius: var(--nz-radius-md);
  background: var(--nz-surface);
}
.pa-calendario__dato { display: flex; align-items: center; gap: var(--nz-space-1); }
.pa-calendario__duracion { font-weight: 700; }

.pa-gantt-scroll { overflow-x: auto; border: 1px solid var(--nz-border); border-radius: var(--nz-radius-md); background: var(--nz-surface); }
.pa-gantt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--nz-text-xs); }
.pa-gantt th, .pa-gantt td { padding: 0; border-bottom: 1px solid var(--nz-border-soft); }

/* Columna de conceptos (fija a la izquierda al desplazar) */
.pa-gantt__concepto {
  position: sticky; left: 0; z-index: 2; background: var(--nz-surface);
  text-align: left; font-weight: 600; padding: var(--nz-space-1) var(--nz-space-2);
  min-width: 14rem; max-width: 20rem; border-right: 1px solid var(--nz-border);
}
.pa-gantt__total {
  text-align: right; font-variant-numeric: tabular-nums; padding: var(--nz-space-1) var(--nz-space-2);
  min-width: 5rem; border-left: 1px solid var(--nz-border); background: var(--nz-surface);
}

/* Cabecera de años y meses */
.pa-gantt__anios th {
  font-size: var(--nz-text-2xs, var(--nz-text-xs)); text-transform: uppercase; letter-spacing: .04em;
  color: var(--nz-text-soft); background: var(--nz-surface-2, var(--nz-surface));
  border-bottom: 1px solid var(--nz-border); padding: var(--nz-space-1) 0; text-align: center;
}
.pa-gantt__meses th {
  min-width: 3.2rem; background: var(--nz-surface-2, var(--nz-surface));
  border-right: 1px solid var(--nz-border-soft); border-bottom: 2px solid var(--nz-border);
}
.pa-gantt__rotulo {
  width: 100%; border: 0; background: transparent; text-align: center;
  font: inherit; font-weight: 700; color: var(--nz-text-soft);
  padding: var(--nz-space-1) 0; cursor: text; text-transform: uppercase;
}
.pa-gantt__rotulo:hover { color: var(--nz-text); background: var(--nz-brand-soft); }
.pa-gantt__rotulo:focus { background: var(--nz-surface); color: var(--nz-text); outline: 2px solid var(--nz-accent); outline-offset: -2px; }
.pa-gantt__rotulo--editado { color: var(--nz-accent-strong, var(--nz-accent)); }

/* Filas del árbol */
.pa-gantt__fila--tarea .pa-gantt__concepto { background: var(--nz-brand-soft); color: var(--nz-brand-strong, var(--nz-brand)); }
.pa-gantt__fila--subtarea .pa-gantt__concepto { padding-left: var(--nz-space-4); font-weight: 500; }
.pa-gantt__fila--entregable .pa-gantt__concepto { padding-left: var(--nz-space-4); font-weight: 500; }
.pa-gantt__fila--entregable { background: var(--nz-accent-soft); }
.pa-gantt__fila--entregable .pa-gantt__concepto { background: var(--nz-accent-soft); }
.pa-gantt__concepto-clic { cursor: pointer; }
.pa-gantt__concepto-clic:hover { text-decoration: underline; }

/* Celdas y barras */
.pa-gantt__celda {
  height: 1.7rem; border-right: 1px solid var(--nz-border-soft);
  background-image: linear-gradient(to right, var(--nz-border-soft) 0 1px, transparent 1px);
  background-position: right top; background-repeat: no-repeat;
}
.pa-barra { display: block; height: 0.85rem; margin: 0.42rem 0; background: var(--nz-brand); }
.pa-barra--tarea { background: var(--nz-brand-strong, var(--nz-brand)); height: 1rem; margin: 0.35rem 0; }
.pa-barra--inicio { border-radius: var(--nz-radius-full) 0 0 var(--nz-radius-full); }
.pa-barra--fin { border-radius: 0 var(--nz-radius-full) var(--nz-radius-full) 0; }
.pa-barra--sola { border-radius: var(--nz-radius-full); }
.pa-barra--hito { background: transparent; height: 1.4rem; margin: 0.15rem 0; text-align: center; }
.pa-barra--hito::after {
  content: "◆"; color: var(--nz-accent); font-size: var(--nz-text-md); line-height: 1.4rem;
}
.pa-gantt__celda--hoy { background: var(--nz-accent-soft); }
.pa-gantt__nota { padding: var(--nz-space-2); border-top: 1px solid var(--nz-border); background: var(--nz-surface-2, var(--nz-surface)); }

/* =====================================================================
   EDITOR DEL ESFUERZO
   ===================================================================== */

.pa-tarea { margin-bottom: var(--nz-space-3); }
.pa-tarea__cab { display: flex; flex-wrap: wrap; gap: var(--nz-space-2); align-items: center; }
.pa-sub {
  border: 1px solid var(--nz-border); border-radius: var(--nz-radius-md);
  margin-top: var(--nz-space-2); background: var(--nz-surface);
}
.pa-sub > summary {
  display: flex; flex-wrap: wrap; gap: var(--nz-space-2); align-items: center;
  padding: var(--nz-space-2); cursor: pointer; list-style: none;
}
.pa-sub > summary::-webkit-details-marker { display: none; }
.pa-sub__cuerpo { padding: 0 var(--nz-space-2) var(--nz-space-2); overflow-x: auto; }
.pa-hito { display: flex; flex-wrap: wrap; gap: var(--nz-space-2); align-items: center; padding: var(--nz-space-2) 0; border-top: 1px dashed var(--nz-border); }
.pa-hito__nombre { flex: 2; min-width: 190px; }
.pa-hito__detalle { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: var(--nz-space-2); }

/* Tabla de horas perfil × periodo */
.pa-tabla-horas { min-width: 100%; }
.pa-tabla-horas th, .pa-tabla-horas td { white-space: nowrap; }
.pa-tabla-horas td:first-child, .pa-tabla-horas th:first-child {
  position: sticky; left: 0; background: var(--nz-surface); z-index: 1; min-width: 12rem;
}
.pa-tabla-horas thead th:first-child { background: var(--nz-surface-2, var(--nz-surface)); }

/* =====================================================================
   LISTAS (gastos, perfiles, plantillas, fotos)
   ===================================================================== */

.pa-dato { display: flex; flex-wrap: wrap; gap: var(--nz-space-2); align-items: center; padding: var(--nz-space-2) 0; border-top: 1px dashed var(--nz-border); }
.pa-dato--destacado { background: var(--nz-accent-soft); }

/* =====================================================================
   INFORME
   ===================================================================== */

.pa-informe { max-width: 52rem; margin: 0 auto; }
.pa-informe h1 { font-size: var(--nz-text-xl); margin: var(--nz-space-3) 0 var(--nz-space-1); }
.pa-informe h2 { font-size: var(--nz-text-md); margin-top: var(--nz-space-4); border-bottom: 2px solid var(--nz-brand); padding-bottom: 2px; }
.pa-informe table:not(.pa-gantt) { width: 100%; border-collapse: collapse; font-size: var(--nz-text-xs); margin: var(--nz-space-2) 0; }
.pa-informe table:not(.pa-gantt) th, .pa-informe table:not(.pa-gantt) td { padding: var(--nz-space-1) var(--nz-space-2); text-align: left; }
/* El marco de tabla es de escritorio para arriba: en el móvil las tablas de
   datos van apiladas en tarjetas (objeto `.nz-table--apilable` de Aurora 7). */
@media (min-width: 640px) {
  .pa-informe table:not(.pa-gantt) th, .pa-informe table:not(.pa-gantt) td { border: 1px solid var(--nz-border); }
  .pa-informe table:not(.pa-gantt) th { background: var(--nz-surface-2, var(--nz-surface)); }
  .pa-informe__clave { width: 11rem; }
  .pa-detalle__grupo { background: var(--nz-surface-2, var(--nz-surface)); }
}
.pa-detalle__grupo { font-weight: 800; color: var(--nz-text); }
.pa-informe__cab { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--nz-space-2); align-items: flex-start; border-bottom: 3px solid var(--nz-brand); padding-bottom: var(--nz-space-2); }
.pa-informe__pie { margin-top: var(--nz-space-5); padding-top: var(--nz-space-2); border-top: 1px solid var(--nz-border); font-size: var(--nz-text-xs); color: var(--nz-text-soft); display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--nz-space-2); }
.pa-num { text-align: right; font-variant-numeric: tabular-nums; }
.pa-hito-informe { color: var(--nz-accent-strong, var(--nz-accent)); font-weight: 700; }

/* =====================================================================
   AVISOS
   ===================================================================== */

#pa-error {
  display: none; background: var(--nz-danger-soft, var(--nz-surface)); color: var(--nz-danger);
  border-bottom: 1px solid var(--nz-danger); padding: var(--nz-space-2) var(--nz-space-3);
  font-size: var(--nz-text-xs); white-space: pre-wrap;
}
#pa-error.is-visible { display: block; }
#pa-herederos:not(:empty) { margin-bottom: var(--nz-space-3); }

#pa-toast {
  position: fixed; bottom: 3rem; left: 50%; transform: translateX(-50%);
  background: var(--nz-text); color: var(--nz-surface); padding: var(--nz-space-2) var(--nz-space-3);
  border-radius: var(--nz-radius-md); font-size: var(--nz-text-sm);
  opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 99; max-width: 90vw; text-align: center;
}
#pa-toast.is-visible { opacity: 1; }

/* Modo «solo tiempos»: oculta los importes en pantalla */
body.pa-sin-importes .pa-importe { display: none; }

/* ---------- Impresión ---------- */
@media print {
  .nz-navbar, .nz-tabs, #pa-error, .pa-no-imprimir { display: none; }
  main { padding: 0; max-width: none; }
  /* Las secciones cuelgan de .nz-tabs__panel: se ocultan por id, no por <main>. */
  main section[id^="sec-"]:not(#sec-informe) { display: none !important; }
  #sec-informe .nz-article { box-shadow: none; border: none; padding: 0; }
  .pa-informe { max-width: none; }
  body { background: var(--nz-surface); }
  @page { margin: 14mm; }
}

/* ---------- Horas por perfil y mes ---------- */

.pa-celda-horas { vertical-align: top; }
.pa-celda__eq {
  display: block; font-size: var(--nz-text-xs); color: var(--nz-text-soft); line-height: 1.15;
  white-space: nowrap;
}
/* Quien pasa del 100 % de jornada se marca solo: nadie trabaja dos jornadas. */
.pa-celda--exceso { background: var(--nz-warning-soft, var(--nz-warning-tint, #fff7ed)); }
.pa-celda--exceso .pa-celda__eq { color: var(--nz-warning-strong, var(--nz-danger-strong, #b45309)); font-weight: 700; }
.pa-celda--exceso input { border-color: var(--nz-warning-strong, var(--nz-warning, #f97316)); }
.pa-fila--exceso .pa-celda-horas-h strong { color: var(--nz-warning-strong, #b45309); }

/* ---------- Móvil: la tabla de horas se convierte en tarjetas por perfil ----------
   Nada de arrastrar una tabla a lo ancho: cada perfil es una tarjeta y cada mes
   una fila con su nombre delante y un campo grande (44 px, táctil). Nada lleva
   `nowrap` ni un ancho mínimo: la tarjeta mide lo que mide la pantalla. */
@media (max-width: 720px) {
  .pa-tabla-horas { overflow-x: visible; }
  .pa-tabla-horas table, .pa-tabla-horas thead, .pa-tabla-horas tbody,
  .pa-tabla-horas tr, .pa-tabla-horas th, .pa-tabla-horas td { display: block; width: auto; min-width: 0; }

  .pa-tabla-horas thead { display: none; }
  .pa-tabla-horas tr {
    border: 1px solid var(--nz-border); border-radius: var(--nz-radius-md);
    padding: var(--nz-space-2); margin-bottom: var(--nz-space-2); background: var(--nz-surface);
  }
  .pa-tabla-horas th, .pa-tabla-horas td { border: 0; padding: 0.2rem 0; text-align: left; white-space: normal; }
  /* La primera columna ya no es la columna pegada de la tabla ancha: aquí cada
     fila es una tarjeta y no hay nada que pegar ni que ensanchar. */
  .pa-tabla-horas td:first-child, .pa-tabla-horas th:first-child { position: static; min-width: 0; }
  .pa-tabla-horas td[data-etiqueta] { display: flex; align-items: center; justify-content: space-between; gap: var(--nz-space-2); }
  .pa-tabla-horas td[data-etiqueta]::before {
    content: attr(data-etiqueta); flex: 0 0 5.4rem;
    font-size: var(--nz-text-xs); color: var(--nz-text-soft); text-transform: uppercase; letter-spacing: 0.03em;
  }
  .pa-tabla-horas td[data-etiqueta] > * { flex: 1 1 auto; min-width: 0; }
  .pa-tabla-horas td[data-etiqueta="Perfil"]::before { display: none; }
  .pa-tabla-horas td[data-etiqueta="Perfil"] { display: block; }
  .pa-tabla-horas input[type="number"], .pa-tabla-horas select { min-height: 44px; font-size: var(--nz-text-md); width: 100%; min-width: 0; }
  .pa-tabla-horas .pa-celda__eq { flex: 0 0 5rem; text-align: right; }
  .pa-tabla-horas td .nz-btn { min-height: 44px; min-width: 44px; }
}

/* ---------- Los cuatro pasos del trabajo ---------- */

.pa-pasos {
  display: grid; gap: var(--nz-space-2); margin-bottom: var(--nz-space-3);
  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
}
.pa-paso {
  display: flex; align-items: center; gap: var(--nz-space-2);
  padding: var(--nz-space-2) var(--nz-space-3);
  border: 1px solid var(--nz-border); border-radius: var(--nz-radius-md);
  background: var(--nz-surface-2, var(--nz-surface));
}
.pa-paso--hecho { border-color: var(--nz-accent); background: var(--nz-accent-soft); }
.pa-paso__num {
  flex: 0 0 auto; width: 1.7rem; height: 1.7rem; border-radius: var(--nz-radius-pill, 999px);
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--nz-brand); color: var(--nz-on-brand, #fff); font-weight: 700; font-size: var(--nz-text-sm);
}
.pa-paso--hecho .pa-paso__num { background: var(--nz-accent); }
.pa-paso__cuerpo { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.pa-paso__cuerpo strong { font-size: var(--nz-text-sm); }
.pa-paso__ok { margin-left: auto; color: var(--nz-accent); font-weight: 700; }

/* ---------- El Gantt dentro del informe ---------- */
.pa-gantt--informe { border: 0; border-radius: 0; background: transparent; }
.pa-gantt--informe .pa-gantt__concepto { min-width: 11rem; max-width: 15rem; font-size: 0.72rem; }
.pa-gantt--informe .pa-gantt__rotulo, .pa-gantt--informe th { font-size: 0.68rem; }
.pa-gantt--informe .pa-gantt__concepto-clic { cursor: default; }
@media print {
  .pa-gantt--informe { break-inside: avoid; }
  .pa-gantt--informe .pa-gantt__concepto { min-width: 9rem; }
}

/* ---------- Color por tarea ----------
   Cada tarea lleva un tono del sistema; sus subtareas y sus entregables lo heredan.
   El hilo se sigue igual en el árbol, en el diagrama y en el informe. */
.pa-tono-1 { --pa-tono: var(--nz-brand);   --pa-tono-fluido: var(--nz-brand-soft); }
.pa-tono-2 { --pa-tono: var(--nz-accent);  --pa-tono-fluido: var(--nz-accent-soft); }
.pa-tono-3 { --pa-tono: var(--nz-success); --pa-tono-fluido: var(--nz-success-soft); }
.pa-tono-4 { --pa-tono: var(--nz-warning); --pa-tono-fluido: var(--nz-warning-soft); }
.pa-tono-5 { --pa-tono: var(--nz-danger);  --pa-tono-fluido: var(--nz-danger-soft); }

/* El color va en un punto, no en barras: marca sin ensuciar.
   El tono se ve entero en las barras del diagrama. */
.pa-tono-punto {
  display: inline-block; width: 0.65rem; height: 0.65rem; border-radius: 50%;
  background: var(--pa-tono, var(--nz-border)); flex: 0 0 auto;
}

/* El entregable se marca con un rombo del mismo color naranja, nunca con un punto. */
.pa-tono-rombo {
  display: inline-block; width: 0.6rem; height: 0.6rem; flex: 0 0 auto;
  background: var(--pa-tono, var(--nz-accent)); transform: rotate(45deg); border-radius: 1px;
}
.pa-hito .pa-tono-rombo { margin-right: var(--nz-space-1); }

/* Las tareas: barras con su color; los entregables: el rombo en naranja. */
.pa-gantt__fila--tarea .pa-barra { background: var(--pa-tono, var(--nz-brand)); }
.pa-gantt__fila--subtarea .pa-barra { background: var(--pa-tono-fluido, var(--nz-brand)); }
.pa-gantt__fila--entregable .pa-barra--hito { color: var(--pa-tono, var(--nz-accent)); }

/* ---------- Calendario en móvil: rejilla, campos grandes y sin scroll lateral ---------- */
.pa-calendario { flex-wrap: wrap; }
@media (max-width: 720px) {
  .pa-calendario { display: grid; grid-template-columns: 1fr 1fr; gap: var(--nz-space-2); align-items: stretch; }
  .pa-calendario > * { min-width: 0; }
  .pa-calendario .pa-calendario__dato { display: flex; flex-direction: column; align-items: stretch; gap: 0.2rem; }
  .pa-calendario input, .pa-calendario .nz-btn { min-height: 44px; width: 100%; }
  .pa-calendario .pa-espacio { display: none; }
  .pa-calendario__duracion, .pa-calendario > .pa-mini { grid-column: 1 / -1; }

  .pa-gantt__concepto { min-width: 7.5rem; max-width: 9rem; font-size: var(--nz-text-xs); }
  .pa-gantt__total { min-width: 3.4rem; font-size: var(--nz-text-xs); }
  .pa-gantt__rotulo { font-size: var(--nz-text-xs); }
  .pa-gantt__celda { min-width: 2.6rem; }
}



/* ---------- Plegar y desplegar: chevron claro y el cuerpo oculto sin rastro ---------- */
.pa-chevron {
  flex: 0 0 auto; width: 1.9rem; height: 1.9rem; min-height: 1.9rem; padding: 0;
  border: 0; border-radius: var(--nz-radius-md); background: transparent;
  color: var(--nz-text-soft); font-size: var(--nz-text-md); cursor: pointer; line-height: 1;
}
.pa-chevron:hover { background: var(--nz-surface-2, var(--nz-surface)); color: var(--nz-text); }
.pa-tarea--plegada > .pa-tarea__cuerpo { display: none; }
.pa-sub--plegada > .pa-sub__cuerpo { display: none; }
.pa-tarea__cab .pa-tono-punto { margin-right: var(--nz-space-1); }
@media (max-width: 720px) { .pa-chevron { width: 44px; height: 44px; font-size: var(--nz-text-lg); } }


/* ---------- Cuánto queda libre, a la vista ----------
   Dentro de cada celda de horas, una sombra marca la parte de la jornada de ese
   perfil que YA está comprometida en ese periodo, y el hueco del campo dice en
   texto cuánto queda. Así se ve antes de escribir, no después de pasarse. */
.pa-celda-horas { position: relative; }
.pa-celda__sombra {
  position: absolute; top: 2px; bottom: 2px; left: 2px; z-index: 0;
  max-width: calc(100% - 4px);
  background: var(--nz-brand-soft); border-radius: var(--nz-radius-sm, 4px);
  pointer-events: none;
}
.pa-celda__marca {
  position: absolute; top: 1px; right: 4px; z-index: 2;
  font-size: 0.6rem; line-height: 1; color: var(--nz-text-soft);
  font-variant-numeric: tabular-nums; pointer-events: none;
}
.pa-celda-horas > input, .pa-celda-horas > .pa-celda__eq { position: relative; z-index: 1; }
.pa-celda-horas > input.pa-input-horas { background: transparent; }
.pa-celda-horas > input.pa-input-horas:focus { background: var(--nz-surface); }
.pa-celda-horas > .pa-celda__eq { position: relative; z-index: 1; }

/* Sin hueco: la celda avisa en ámbar y el campo lo dice con sus palabras. */
.pa-celda--lleno { background: var(--nz-warning-soft, #fff7ed); }
.pa-celda--lleno .pa-celda__sombra { background: var(--nz-warning-tint, #fde68a); }
.pa-celda--lleno > input.pa-input-horas::placeholder { color: var(--nz-warning-strong, #b45309); font-weight: 600; }
.pa-celda-horas > input.pa-input-horas::placeholder { color: var(--nz-text-soft); font-size: var(--nz-text-xs); }


/* ---------- Vista de Carga: el mapa de ocupación ---------- */
.pa-carga {
  text-align: right; font-variant-numeric: tabular-nums;
  font-size: var(--nz-text-xs); min-width: 3.1rem;
}
.pa-carga--vacio { background: transparent; }
.pa-carga--bajo  { background: var(--nz-brand-soft); }
.pa-carga--medio { background: var(--nz-info-soft); }
.pa-carga--alto  { background: var(--nz-warning-soft); }
.pa-carga--lleno { background: var(--nz-warning-tint); font-weight: 700; }
.pa-carga--pasado { background: var(--nz-danger-soft); color: var(--nz-danger); font-weight: 700; }
/* En la leyenda, la misma clase se ve como una cuadradito de color. */
span.pa-carga {
  display: inline-block; width: 0.85rem; height: 0.85rem; min-width: 0;
  border: 1px solid var(--nz-border); border-radius: 3px; vertical-align: -2px;
}


/* ---------- FULL RESPONSIVE ----------
   La app se usa en móvil: nada se aplasta y nada se sale de la pantalla.
   Las tablas de datos se apilan en tarjetas (objeto `.nz-table--apilable` de
   Aurora 7) y la tabla de horas, que es un editor de campos, se convierte en una
   tarjeta por perfil. Ninguna tabla obliga a arrastrar de lado. */
.pa-jornada { display: grid; grid-template-columns: minmax(15rem, 1fr) minmax(18rem, 1.4fr); gap: var(--nz-space-4); align-items: start; }
.pa-select-pct { min-width: 5.4rem; }
.pa-select-perfil { min-width: 150px; }
.pa-jornada > div { min-width: 0; }

@media (max-width: 900px) {
  .pa-jornada { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .pa-carga { min-width: 2.5rem; font-size: 0.66rem; padding: 0.12rem 0.18rem; }
  .pa-jornada > div + div { margin-top: var(--nz-space-4); }
  .pa-fila { flex-wrap: wrap; }
  .pa-fila > .nz-input, .pa-fila > .nz-btn, .pa-fila > label { min-height: 44px; }
  .pa-hito { flex-wrap: wrap; row-gap: var(--nz-space-1); }
  .pa-hito .nz-input, .pa-hito .nz-btn { min-height: 44px; }
  .pa-hito__nombre { flex: 1 1 100%; }
  .pa-select-pct, .pa-input-horas, .pa-input-num { min-height: 44px; font-size: var(--nz-text-md); }
  .pa-select-pct { width: 100%; }
  .pa-select-perfil { min-width: 0; }
  .pa-calendario .pa-ancho-medio { width: 100%; }
  .nz-table--compact td, .nz-table--compact th { padding: 0.2rem 0.3rem; }

  /* La barra de la app: las acciones bajan a su propia fila, envueltas y a 44 px.
     Antes se salían de la pantalla y había botones imposibles de pulsar. */
  .nz-navbar__links { width: 100%; justify-content: flex-start; margin-left: 0; }
  .nz-navbar .nz-btn, .nz-navbar .nz-input { min-height: 44px; }
  .nz-navbar #pa-sel-oferta { flex: 1 1 8rem; min-width: 0; }
}

<script>
/* ====== MÓDULO nucleo.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — NÚCLEO
   Utilidades puras: números, texto, ids y redondeo. Sin DOM, sin estado.
   ===================================================================== */
(function (raiz) {
  const PL = (raiz.PL = raiz.PL || {});

  /* ---------- Números ---------- */

  /** Número desde cualquier entrada, aceptando la coma decimal española. */
  function num(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    const n = parseFloat(String(v === null || v === undefined ? "" : v).replace(",", "."));
    return isFinite(n) ? n : 0;
  }

  /** Redondeo a 2 decimales con criterio Excel (normaliza a 15 dígitos significativos
      antes de redondear). Es lo que hace que los totales cuadren al céntimo. */
  function r2(n) {
    const v = num(n);
    if (!isFinite(v)) return 0;
    const c1 = parseFloat(v.toPrecision(15));
    return Math.round(parseFloat((c1 * 100).toPrecision(15))) / 100;
  }

  function suma(lista, fn) {
    let s = 0;
    if (!lista || !lista.length) return 0;
    for (let i = 0; i < lista.length; i++) s += num(fn ? fn(lista[i]) : lista[i]);
    return s;
  }

  function sumaR2(lista, fn) { return r2(suma(lista, fn)); }

  /** Acota al rango [min, max]. */
  function acota(n, min, max) {
    const v = num(n);
    if (!isFinite(v)) return min;
    return v < min ? min : (v > max ? max : v);
  }

  function entre(n, min, max) { return acota(n, min, max); }

  /* ---------- Texto ---------- */

  const ENTIDADES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ENTIDADES[c]);
  }

  function texto(s, alt) {
    const t = String(s === null || s === undefined ? "" : s).trim();
    return t || (alt || "");
  }

  function lista(v) { return Array.isArray(v) ? v : []; }

  function uid(prefijo) { return prefijo + Math.random().toString(36).slice(2, 9); }

  function slug(s) {
    return String(s || "oferta").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "oferta";
  }

  function capitaliza(s) {
    const t = String(s || "");
    return t.charAt(0).toUpperCase() + t.slice(1);
  }

  /* Plurales irregulares del castellano: 6 "mes" no es «6 mess». */
  const IRREGULARES = { mes: "meses", vez: "veces", año: "años", día: "días", persona: "personas" };

  /** Lee lo que se teclea en un campo de esfuerzo y deduce la unidad:
        "50"   → 50 en la unidad del modo
        "50%"  → 50 % (dedicación)
        "88h"  → 88 horas
        "12,5" → 12,5
      Devuelve null si no hay número (entonces no se toca nada). */
  function parseaCantidad(texto_) {
    let t = String(texto_ === undefined || texto_ === null ? "" : texto_).trim().toLowerCase().replace(/\s+/g, "");
    if (!t) return { valor: 0, unidad: "" };
    let unidad = "";
    if (t.charAt(t.length - 1) === "%") { unidad = "%"; t = t.slice(0, -1); }
    else if (t.charAt(t.length - 1) === "h") { unidad = "h"; t = t.slice(0, -1); }
    t = t.replace(/[^0-9,.\-]/g, "");
    /* Un solo separador decimal: «12,5» vale, «1.234,5» se rechaza en vez de
       inventarse un número. */
    if ((t.match(/[.,]/g) || []).length > 1) return null;
    t = t.replace(",", ".");
    if (!t || isNaN(Number(t))) return null;
    return { valor: Math.max(0, Number(t)), unidad: unidad };
  }

  /** Número para un CAMPO editable: coma decimal y sin separador de miles
      («88,5», no «88,5» con puntos que luego no se pueden volver a leer). */
  function fmtCampo(v, dec) {
    const n = num(v);
    if (!isFinite(n) || n === 0) return "";
    const d = dec === undefined ? 2 : dec;
    return String(Number(n.toFixed(d))).replace(".", ",");
  }

  function plural(n, singular, plural_) {
    return num(n) === 1 ? singular : (plural_ || IRREGULARES[singular] || singular + "s");
  }

  /* ---------- Fechas ---------- */

  /** Mes local en formato aaaa-mm (01..12 con relleno). */
  function mesISO(d) {
    const f = d || new Date();
    return f.getFullYear() + "-" + ("0" + (f.getMonth() + 1)).slice(-2);
  }

  /** Día local en formato aaaa-mm-dd.
      NUNCA usar toISOString() sobre una fecha local: pasa a UTC y en España
      (UTC+1/+2) devuelve el DÍA ANTERIOR — desplazaba todos los meses. */
  function diaISO(d) {
    const f = d || new Date();
    return mesISO(f) + "-" + ("0" + f.getDate()).slice(-2);
  }

  function hoyISO() { return diaISO(new Date()); }

  function fechaCorta(iso) {
    if (!iso) return "";
    const p = String(iso).split("-");
    if (p.length < 3) return String(iso);
    return p[2] + "/" + p[1] + "/" + p[0];
  }

  /** dd/mm/aaaa → aaaa-mm-dd (para inputs type="date"). */
  function fechaISO(corta) {
    const m = String(corta || "").match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (!m) return "";
    const a = m[3].length === 2 ? "20" + m[3] : m[3];
    return a + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
  }

  function fechaLarga(iso) {
    if (!iso) return "";
    const d = new Date(String(iso) + "T12:00:00");
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" });
  }

  function fechaDeValidez(fechaISO_, dias) {
    const d = fechaISO_ ? new Date(String(fechaISO_) + "T12:00:00") : new Date();
    if (isNaN(d.getTime())) return "";
    d.setDate(d.getDate() + (num(dias) || 30));
    return diaISO(d);
  }

  /** "2026-10" válido, o el mes actual. */
  function normalizarMesISO(v) {
    const m = String(v || "").match(/^(\d{4})-(\d{1,2})$/);
    if (!m) return mesISO(new Date());
    const mes = acota(m[2], 1, 12);
    return m[1] + "-" + ("0" + mes).slice(-2);
  }

  /* ---------- Formato ---------- */

  function fmtImporte(n, moneda) {
    return r2(n).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " " + (moneda || "€");
  }

  function fmtHoras(n) {
    const v = Math.round(num(n) * 100) / 100;
    return v.toLocaleString("es-ES", { maximumFractionDigits: 2 }) + " h";
  }

  function fmtNum(n, dec) {
    return num(n).toLocaleString("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: dec === undefined ? 2 : dec });
  }

  function fmtPct(n) {
    return fmtNum(n, 2) + " %";
  }

  /* ---------- Objetos ---------- */

  function clonar(o) { return JSON.parse(JSON.stringify(o)); }

  PL.nucleo = {
    num: num, r2: r2, suma: suma, sumaR2: sumaR2, acota: acota, entre: entre,
    esc: esc, texto: texto, lista: lista, uid: uid, slug: slug, capitaliza: capitaliza, plural: plural,
    hoyISO: hoyISO, mesISO: mesISO, diaISO: diaISO, fechaCorta: fechaCorta,
    parseaCantidad: parseaCantidad, fmtCampo: fmtCampo, fechaISO: fechaISO, fechaLarga: fechaLarga,
    fechaDeValidez: fechaDeValidez, normalizarMesISO: normalizarMesISO,
    fmtImporte: fmtImporte, fmtHoras: fmtHoras, fmtNum: fmtNum, fmtPct: fmtPct,
    clonar: clonar
  };
})(typeof window !== "undefined" ? window : globalThis);

/* ====== MÓDULO periodos.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — PERIODOS
   El calendario de la oferta: mes de inicio, número de periodos, zoom de
   visualización y RÓTULOS EDITABLES a mano.

   El Viernes Santo no se copia de ninguna lista: se CALCULA a partir del domingo
   de Pascua (algoritmo de Gauss/Meeus), así que vale para cualquier año sin
   depender de tener la lista a mano. Comprobado: Pascua 2026 = 5 de abril →
   Viernes Santo 3 de abril, que es lo que publica el calendario oficial.

    const c = anio % 100;
    const d = Math.floor(b / 4);
    const e = b % 4;
    const f = Math.floor((b + 8) / 25);
    const g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4);
    const k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7;
    const m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31);
    const dia = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(anio, mes - 1, dia);
  }

    return N().diaISO ? N().diaISO(f) : f.toISOString().slice(0, 10);
  }

  function viernesSanto(anio) {
    const p = pascua(anio);
    return new Date(p.getFullYear(), p.getMonth(), p.getDate() - 2);
  }

  /* Fijos, iguales todos los años. */
  const FIJOS = [
    { mes: 1, dia: 1, nombre: "Año Nuevo", ambito: "España" },
    { mes: 1, dia: 6, nombre: "Epifanía del Señor", ambito: "España" },
    { mes: 5, dia: 1, nombre: "Fiesta del Trabajo", ambito: "España" },
    { mes: 8, dia: 15, nombre: "Asunción de la Virgen", ambito: "España" },
    { mes: 10, dia: 12, nombre: "Fiesta Nacional de España", ambito: "España" },
    { mes: 11, dia: 1, nombre: "Todos los Santos", ambito: "España" },
    { mes: 12, dia: 6, nombre: "Día de la Constitución", ambito: "España" },
    { mes: 12, dia: 8, nombre: "Inmaculada Concepción", ambito: "España" },
    { mes: 12, dia: 25, nombre: "Natividad del Señor", ambito: "España" },
    { mes: 5, dia: 2, nombre: "Fiesta de la Comunidad de Madrid", ambito: "Madrid" },
    { mes: 5, dia: 15, nombre: "San Isidro (Madrid capital)", ambito: "Local" },
    { mes: 11, dia: 9, nombre: "La Almudena (Madrid capital)", ambito: "Local" }

  function deEspanaMadrid(anio) {

      fecha: a + "-" + (f.mes < 10 ? "0" : "") + f.mes + "-" + (f.dia < 10 ? "0" : "") + f.dia,
      nombre: f.nombre,
      ambito: f.ambito

    const partes = String(inicio || "").split("-").map(Number);
    if (!partes[0]) return [];
    const n = Math.max(0, Math.round(N().num(nPeriodos)));

        }));
