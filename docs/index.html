/* ====== MÓDULO vista-carga.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — VISTA: CARGA
   La planificación vista de un vistazo, sin tocar nada: quién está pillado,
   quién tiene hueco y cómo se reparte el trabajo por subtarea.

   Tres bloques:
     1. Ocupación por perfil y periodo (mapa de color: del hueco al 100 %)
     2. Disponibilidad de cada perfil (asignado, laborable, libre)
     3. Reparto por subtarea y perfil

   Es sólo lectura: aquí se mira, se edita en Trabajo.
   ===================================================================== */
(function (raiz) {
  const PL = (raiz.PL = raiz.PL || {});
  const N = () => PL.nucleo;
  const P = () => PL.periodos;
  const C = () => PL.calculo;
  const V = () => PL.vistas;
  const APP = () => PL.app;

  /** Tramo de ocupación: clase de color y texto para la leyenda. */
  function tramo(pct) {
    if (pct > 100.5) return "pa-carga--pasado";
    if (pct >= 99.5) return "pa-carga--lleno";
    if (pct >= 85) return "pa-carga--alto";
    if (pct >= 50) return "pa-carga--medio";
    if (pct > 0) return "pa-carga--bajo";
    return "pa-carga--vacio";
  }

  /** Horas laborables de todo el calendario. */
  function laborables(o) {
    let t = 0;
    for (let i = 0; i < P().meses(o.periodos); i++) t += C().horasLaborablesMes(o, i);
    return N().r2(t);
  }

  /* ---------- 1. Ocupación por perfil y periodo ---------- */

  function ocupacion(o, pf, mPerfil) {
    const V2 = V();
    const cols = P().columnas(o.periodos);
    const usados = Object.keys(C().horasPorPerfil(o));
    if (!usados.length) {
      return V2.articulo("Ocupación por perfil y periodo",
        '<p class="pa-mini">Todavía no hay horas repartidas. Cuando pongas dedicación en la pestaña Trabajo, ' +
        "aquí verás la carga de cada perfil periodo a periodo.</p>");
    }

    const cabecera = "<tr><th>Perfil</th>" +
      cols.map(c => {
        const lab = c.periodos.reduce((s2, k) => s2 + C().horasLaborablesMes(o, k), 0);
        return '<th class="nz-table__right" title="' + Math.round(lab) + ' h laborables">' + N().esc(c.etiqueta) +
          '<br><span class="pa-mini">' + Math.round(lab) + " h</span></th>";
      }).join("") +
      '<th class="nz-table__right">Medio</th><th class="nz-table__right">Libre</th></tr>';

    const filas = usados.map(perfilId => {
      const perfil = C().perfilPorId(pf, perfilId);
      let libreTotal = 0;
      let labTotal = 0;
      const celdas = cols.map(c => {
        const idx = c.periodos[0];
        const ult = c.periodos[c.periodos.length - 1];
        let horas = 0;
        let lab = 0;
        for (let k = c.periodos[0]; k <= ult; k++) {
          horas += N().num((mPerfil[perfilId] || [])[k]);
          lab += C().horasLaborablesMes(o, k);
        }
        const pct = lab > 0 ? N().r2(horas / lab * 100) : 0;
        libreTotal = N().r2(libreTotal + Math.max(0, lab - horas));
        labTotal = N().r2(labTotal + lab);
        const texto = (perfil ? perfil.nombre : "Perfil") + " en " + c.etiqueta + ": " + N().fmtNum(pct, 0) +
          " % · " + V2.hor(horas) + " de " + Math.round(lab) + " h laborables";
        return '<td class="pa-carga ' + tramo(pct) + '" data-etiqueta="' + N().esc(c.etiqueta) + '" title="' + N().esc(texto) + '">' +
          (horas > 0 ? N().fmtNum(pct, 0) + "%" : "") + "</td>";
      }).join("");
      const medio = labTotal > 0 ? N().r2((labTotal - libreTotal) / labTotal * 100) : 0;
      return "<tr>" +
        '<th scope="row"><span class="pa-tono-punto"></span> ' + N().esc(perfil ? perfil.nombre : "Perfil") + "</th>" +
        celdas +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Medio"><strong>' + N().fmtNum(medio, 0) + "%</strong></td>" +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Libre">' + N().fmtNum(libreTotal, 0) + " h</td></tr>";
    }).join("");

    const leyenda = '<p class="pa-mini">' +
      '<span class="pa-carga pa-carga--vacio"></span> libre · ' +
      '<span class="pa-carga pa-carga--bajo"></span> hasta 50 % · ' +
      '<span class="pa-carga pa-carga--medio"></span> 50-85 % · ' +
      '<span class="pa-carga pa-carga--alto"></span> 85-100 % · ' +
      '<span class="pa-carga pa-carga--lleno"></span> 100 %, sin hueco · ' +
      '<span class="pa-carga pa-carga--pasado"></span> por encima del 100 % · ' +
      "el número es la dedicación de ese perfil en ese periodo.</p>";

    return V2.articulo("Ocupación por perfil y periodo",
      '<p class="pa-mini">Cada celda dice la dedicación de ese perfil en ese periodo, sumando todo lo que tiene asignado: ' +
      "en verde hay hueco, en ámbar está al límite y en rojo no cabe más.</p>" + leyenda +
      '<div class="nz-table-wrap nz-table-wrap--apilable"><table class="nz-table nz-table--apilable">' +
      "<thead>" + cabecera + "</thead><tbody>" + filas + "</tbody></table></div>");
  }

  /* ---------- 2. Disponibilidad por perfil ---------- */

  function disponibilidad(o, pf, mPerfil) {
    const usados = Object.keys(C().horasPorPerfil(o));
    const lab = laborables(o);
    const excesos = C().excesosPerfil(o);

    const filas = usados.map(perfilId => {
      const perfil = C().perfilPorId(pf, perfilId);
      const asignadas = N().r2(N().suma(mPerfil[perfilId] || [], v => N().num(v)));
      const pct = lab > 0 ? N().r2(asignadas / lab * 100) : 0;
      const malos = excesos.filter(x => x.perfilId === perfilId).length;
      const clase = pct > 100.5 ? "nz-badge--danger" : (pct >= 85 ? "nz-badge--warning" : "nz-badge--neutral");
      return "<tr>" +
        '<td><span class="pa-tono-punto"></span> ' + N().esc(perfil ? perfil.nombre : "Perfil") + "</td>" +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Asignadas">' + N().fmtNum(asignadas, 0) + " h</td>" +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Laborables">' + N().fmtNum(lab, 0) + " h</td>" +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Dedicación media"><span class="nz-badge ' + clase + '">' + N().fmtNum(pct, 0) + " %</span></td>" +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Libres">' + N().fmtNum(Math.max(0, N().r2(lab - asignadas)), 0) + " h</td>" +
        '<td data-etiqueta="Avisos">' + (malos ? '<span class="nz-badge nz-badge--danger">' + malos + " periodo(s) pasado(s)</span>" : "") + "</td></tr>";
    }).join("");

    const totalAsignado = usados.reduce((a, id) => N().r2(a + N().suma(mPerfil[id] || [], v => N().num(v))), 0);

    return V().articulo("Qué le queda a cada perfil",
      '<p class="pa-mini">El calendario tiene <strong>' + N().fmtNum(lab, 0) +
      " h laborables por perfil</strong> y hay <strong>" + N().fmtNum(totalAsignado, 0) +
      " h</strong> repartidas. Lo que sobra de cada uno es lo que aún puedes planificar (o personal que no necesitas).</p>" +
      '<div class="nz-table-wrap nz-table-wrap--apilable"><table class="nz-table nz-table--apilable"><thead><tr><th>Perfil</th>' +
      '<th class="nz-table__right">Asignadas</th><th class="nz-table__right">Laborables</th>' +
      '<th class="nz-table__right">Dedicación media</th><th class="nz-table__right">Libres</th><th></th></tr></thead>' +
      "<tbody>" + (filas || '<tr><td colspan="6"><span class="pa-mini">Sin perfiles asignados todavía.</span></td></tr>') +
      "</tbody></table></div>" +
      '<p class="pa-mini" style="margin-top:var(--nz-space-2)">Coste del esfuerzo con las tarifas actuales: <strong>' +
      N().fmtNum(C().importeOferta(o, pf)) + " €</strong>.</p>");
  }

  /* ---------- 3. Reparto por subtarea y perfil ---------- */

  function abrevia(nombre) {
    const t = String(nombre || "").replace(/\(.*?\)/g, "").trim();
    const partes = t.split(/\s+/);
    return partes.length > 3 ? partes.slice(0, 3).join(" ") + "…" : t;
  }

  function reparto(o, pf) {
    const V2 = V();
    const porPerfil = {};
    const filas = [];
    N().lista(o.tareas).forEach(t => {
      N().lista(t.subtareas).forEach(s => {
        const lineas = N().lista(s.lineas);
        if (!lineas.length) return;
        const horas = lineas.reduce((a, l) => {
          const h = C().lineaHoras(l);
          if (h && l.perfilId) porPerfil[l.perfilId] = N().r2((porPerfil[l.perfilId] || 0) + h);
          return N().r2(a + h);
        }, 0);
        filas.push({ tarea: t.nombre, sub: s.nombre, lineas: lineas, horas: horas });
      });
    });

    /* Sólo las columnas de perfiles que se usan: si no, la tabla es un muro. */
    const cols = pf.filter(p => porPerfil[p.id]);
    if (!filas.length) {
      return V2.articulo("Reparto por subtarea y perfil",
        '<p class="pa-mini">Todavía no hay subtareas con trabajo asignado.</p>');
    }

    const cabecera = "<tr><th>Subtarea</th>" +
      cols.map(p => '<th class="nz-table__right" title="' + N().esc(p.nombre) + " · " + N().fmtNum(p.tarifa) + ' €/h">' +
        N().esc(abrevia(p.nombre)) + '<br><span class="pa-mini">' + N().fmtNum(p.tarifa) + " €/h</span></th>").join("") +
      '<th class="nz-table__right">Horas</th><th class="nz-table__right">Importe</th></tr>';

    const cuerpo = filas.map(f => {
      const suyos = {};
      let importe = 0;
      f.lineas.forEach(l => {
        if (l.perfilId) suyos[l.perfilId] = N().r2((suyos[l.perfilId] || 0) + C().lineaHoras(l));
        importe = N().r2(importe + C().lineaImporte(l, pf));
      });
      return '<tr><th scope="row"><span class="pa-mini">' + N().esc(f.tarea) + "</span><br>" + N().esc(f.sub) + "</th>" +
        cols.map(p => '<td class="nz-table__num nz-table__right" data-etiqueta="' + N().esc(abrevia(p.nombre)) + '">' +
          (suyos[p.id] ? N().fmtNum(suyos[p.id], 0) : "") + "</td>").join("") +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Horas"><strong>' + N().fmtNum(f.horas, 0) + "</strong></td>" +
        '<td class="nz-table__num nz-table__right" data-etiqueta="Importe">' + N().fmtNum(importe) + " €</td></tr>";
    }).join("");

    const pie = '<tr><th scope="row">Total</th>' +
      cols.map(p => '<td class="nz-table__num nz-table__right" data-etiqueta="' + N().esc(abrevia(p.nombre)) + '"><strong>' + N().fmtNum(porPerfil[p.id] || 0, 0) + "</strong></td>").join("") +
      '<td class="nz-table__num nz-table__right" data-etiqueta="Horas"><strong>' + N().fmtNum(C().ofertaHoras(o), 0) + "</strong></td>" +
      '<td class="nz-table__num nz-table__right" data-etiqueta="Importe"><strong>' + N().fmtNum(C().importeOferta(o, pf)) + " €</strong></td></tr>";

    return V2.articulo("Reparto por subtarea y perfil",
      '<p class="pa-mini">Quién hace qué: las horas de cada perfil en cada subtarea.</p>' +
      '<div class="nz-table-wrap nz-table-wrap--apilable"><table class="nz-table nz-table--apilable">' +
      "<thead>" + cabecera + "</thead><tbody>" + cuerpo + pie + "</tbody></table></div>");
  }

  function render() {
    const V2 = V(), a = APP();
    const cont = "carga-cuerpo";
    const o = a.pr();
    if (!o) { V2.vaciar(cont); return; }
    const pf = a.pf();
    const mPerfil = C().horasPerfilPeriodo(o);
    const excesos = C().excesosPerfil(o);

    V2.escribir(cont,
      (excesos.length
        ? V2.aviso("warning", "<strong>Hay " + excesos.length + " caso(s) por encima del 100 %.</strong> " +
            "Suele venir de datos anteriores a la regla del tope: repártelos con otro perfil o muévelos de periodo.")
        : "") +
      ocupacion(o, pf, mPerfil) +
      disponibilidad(o, pf, mPerfil) +
      reparto(o, pf));
  }

  PL.vistas.carga = { render: render, tramo: tramo, laborables: laborables };
})(typeof window !== "undefined" ? window : globalThis);

/* ====== MÓDULO vista-resumen.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — VISTA: RESUMEN
   Totales, esfuerzo por perfil, por tarea y por periodo, más los escenarios
   y versiones con su comparador de diferencias (todo en línea).
   ===================================================================== */
(function (raiz) {
  const PL = (raiz.PL = raiz.PL || {});
  const N = () => PL.nucleo;
  const P = () => PL.periodos;
  const C = () => PL.calculo;
  const E = () => PL.entregables;
  const X = () => PL.comparar;
  const V = () => PL.vistas;
  const APP = () => PL.app;

  /* ---------- Totales ---------- */

  function totales(o, pf) {
    const V2 = V();
    const conImp = V2.verImportes();
    const d = o.descuento || {}, t = o.impuestos || {};
    const linea = (texto_, valor, fuerte) => V2.fila([
      { html: (fuerte ? "<strong>" : "") + texto_ + (fuerte ? "</strong>" : "") },
      { html: (fuerte ? "<strong>" : "") + (conImp ? V2.imp(valor) : "") + (fuerte ? "</strong>" : ""), clase: "nz-table__right pa-importe" }
    ]);
    const filas = linea("Consultoría (horas × tarifas)", C().importeOferta(o, pf)) +
      linea("Gastos generales", C().gastosTotal(o)) +
      linea("Subtotal", C().subtotalOferta(o, pf), true) +
      (d.tipo ? linea("Descuento (" + (d.tipo === "%" ? N().fmtNum(d.valor) + " %" : "importe fijo") + ")", -C().descuentoImporte(o, pf)) : "") +
      linea("Base imponible", C().baseImponible(o, pf)) +
      linea(C().nombreImpuesto(o) ? C().nombreImpuesto(o) + " " + N().fmtNum(t.tasa) + " %" + (t.incluido ? " (incluido)" : "") : "Sin impuestos", C().impuestoImporte(o, pf));
    const pie = '<tfoot><tr><td><strong>TOTAL</strong></td><td class="nz-table__right pa-importe"><strong>' +
      (conImp ? V2.imp(C().totalOferta(o, pf)) : "") + "</strong></td></tr></tfoot>";
    const info = '<p class="pa-mini">' + C().ofertaHoras(o).toLocaleString("es-ES") + " h en " + P().duracionLegible(o.periodos) +
      " · " + E().porContexto(o).total + " entregable(s) · media mensual " + (conImp ? V2.imp(C().mediaPeriodo(o, pf)) : "—") + "</p>";
    return V2.articulo("Totales de la oferta", V2.tabla(["", ""], filas, pie, null, true), info);
  }

  function porPerfil(o, pf) {
    const V2 = V();
    const horas = C().horasPorPerfil(o);
    const conImp = V2.verImportes();
    const filas = N().lista(pf).filter(p => N().num(horas[p.id]) > 0).map(p => V2.fila([
      { html: N().esc(p.nombre) + '<br><span class="pa-mini">' + N().esc(p.categoria) + "</span>" },
      { html: V2.hor(horas[p.id]), clase: "nz-table__right", etiqueta: "Horas" },
      { html: conImp ? V2.imp(C().importePerfil(o, pf, p.id)) : "", clase: "nz-table__right pa-importe", etiqueta: "Importe" }
    ])).join("");
    const pie = '<tfoot><tr><td>Total</td><td class="nz-table__right">' + V2.hor(C().ofertaHoras(o)) + '</td><td class="nz-table__right pa-importe">' +
      (conImp ? V2.imp(C().importeOferta(o, pf)) : "") + "</td></tr></tfoot>";
    return V2.articulo("Esfuerzo por perfil", V2.tabla(["Perfil", "Horas", "Importe"], filas || '<tr><td colspan="3">Sin horas asignadas.</td></tr>', pie, "nz-table--compact", true));
  }

  function porTarea(o, pf) {
    const V2 = V();
    const conImp = V2.verImportes();
    const filas = N().lista(o.tareas).map(t => V2.fila([
      { html: N().esc(t.nombre) },
      { html: N().lista(t.subtareas).length, clase: "nz-table__right", etiqueta: "Subtareas" },
      { html: N().lista(t.entregables).length, clase: "nz-table__right", etiqueta: "Entregables" },
      { html: V2.hor(C().tareaHoras(t)), clase: "nz-table__right", etiqueta: "Horas" },
      { html: conImp ? V2.imp(C().tareaImporte(t, pf)) : "", clase: "nz-table__right pa-importe", etiqueta: "Importe" }
    ])).join("");
    const pie = '<tfoot><tr><td>Total</td><td class="nz-table__right">' + N().suma(o.tareas, t => N().lista(t.subtareas).length) +
      '</td><td class="nz-table__right">' + E().porContexto(o).total + '</td><td class="nz-table__right">' + V2.hor(C().ofertaHoras(o)) +
      '</td><td class="nz-table__right pa-importe">' + (conImp ? V2.imp(C().importeOferta(o, pf)) : "") + "</td></tr></tfoot>";
    return V2.articulo("Por tareas", V2.tabla(["Tarea", "Subtareas", "Entregables", "Horas", "Importe"], filas || '<tr><td colspan="5">Sin tareas.</td></tr>', pie, "nz-table--compact", true));
  }

  function porPeriodo(o, pf) {
    const V2 = V();
    const cols = P().columnas(o.periodos);
    const conImp = V2.verImportes();
    const filas = cols.map(c => {
      const horas = c.periodos.reduce((s, i) => s + C().horasPeriodo(o, i), 0);
      const imp = c.periodos.reduce((s, i) => s + C().importePeriodo(o, pf, i), 0);
      const hitos = c.periodos.reduce((s, i) => s + E().dePeriodo(o, i).length, 0);
      return V2.fila([
        { html: N().esc(c.etiqueta) + ' <span class="pa-mini">' + c.anio + "</span>" },
        { html: horas ? horas.toLocaleString("es-ES") : "·", clase: "nz-table__right", etiqueta: "Horas" },
        { html: hitos ? '<span class="pa-hito-informe">◆ ' + hitos + "</span>" : "·", clase: "nz-table__right", etiqueta: "Entregables" },
        { html: conImp ? V2.imp(imp) : "", clase: "nz-table__right pa-importe", etiqueta: "Importe" }
      ]);
    }).join("");
    const pie = '<tfoot><tr><td>Total</td><td class="nz-table__right">' + C().ofertaHoras(o).toLocaleString("es-ES") +
      '</td><td class="nz-table__right">' + E().porContexto(o).total + '</td><td class="nz-table__right pa-importe">' +
      (conImp ? V2.imp(C().importeOferta(o, pf)) : "") + "</td></tr></tfoot>";
    return V2.articulo("Esfuerzo y entregas por periodo", V2.tabla(["Periodo", "Horas", "Entregables", "Importe"], filas, pie, "nz-table--compact", true));
  }

  /* ---------- Escenarios y versiones ---------- */

  function fotos(o, pf) {
    const V2 = V();
    const escenarios = X().fotosDe(o, "escenario");
    const versiones = X().fotosDe(o, "version");

    const listaHtml = (tipo, lista, vacioTexto) => {
      const titulo = PL.modelo.TIPOS_FOTO[tipo];
      const filas = lista.map(f => {
        const r = f.resumen || X().resumen(o, pf, f.snapshot);
        return '<div class="pa-dato">' +
          '<span class="pa-crece2"><strong>' + N().esc(f.nombre) + "</strong>" +
          '<br><span class="pa-mini">' + N().esc(f.fecha) + (f.nota ? " · " + N().esc(f.nota) : "") + " · " +
          (V2.verImportes() ? V2.imp(r.total) + " · " : "") + V2.hor(r.horas) + " · " + r.periodos + " meses · " + r.entregables + " entregables</span></span>" +
          '<button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="foto-comparar" data-id="' + f.id + '">Comparar con la actual</button>' +
          '<button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="foto-aplicar" data-id="' + f.id + '">' + (tipo === "version" ? "Restaurar" : "Aplicar") + "</button>" +
          '<button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="foto-borrar" data-id="' + f.id + '" title="Eliminar">✕</button>' +
        "</div>";
      }).join("");
      return '<h4 class="nz-h4">' + titulo.plural + " <span class=\"pa-mini\">" + lista.length + "</span></h4>" +
        '<p class="pa-mini">' + titulo.ayuda + "</p>" +
        (filas || '<p class="pa-mini">' + vacioTexto + "</p>");
    };

    return V2.articulo("Escenarios y versiones",
      '<div class="nz-formgrid nz-formgrid--2">' +
        '<label class="nz-field"><span class="nz-field__label">Nombre</span><input class="nz-input" id="foto-nombre" placeholder="Base, recortada, v1 enviada…"></label>' +
        '<label class="nz-field"><span class="nz-field__label">Nota (opcional)</span><input class="nz-input" id="foto-nota" placeholder="Qué cambia o cuándo se envió"></label>' +
      "</div>" +
      '<div class="pa-fila" style="margin:var(--nz-space-2) 0 var(--nz-space-3)">' +
        '<button class="nz-btn nz-btn--primary nz-btn--sm" data-acc="guardar-escenario">＋ Guardar como escenario</button>' +
        '<button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="guardar-version">🕒 Congelar como versión</button>' +
        '<span class="pa-mini">El escenario es una alternativa; la versión es la oferta tal como se envió.</span>' +
      "</div>" +
      listaHtml("escenario", escenarios, "Todavía no hay escenarios: guarda el estado actual como «Base» y prueba a recortar o ampliar la oferta.") +
      '<div style="margin-top:var(--nz-space-3)"></div>' +
      listaHtml("version", versiones, "Todavía no hay versiones congeladas: congela una antes de enviar la oferta al cliente.") +
      comparacion(o, pf));
  }

  function comparacion(o, pf) {
    const V2 = V();
    const ui = APP().ui;
    if (!ui.comparacion) return "";
    const cmp = ui.comparacion.cmp;
    const conImp = V2.verImportes();
    const filasEco = cmp.economia.map(l => V2.fila([
      { html: l.texto },
      { html: conImp ? V2.imp(l.a) : "", clase: "nz-table__right", etiqueta: N().esc(cmp.etiquetaA) },
      { html: conImp ? V2.imp(l.b) : "", clase: "nz-table__right", etiqueta: N().esc(cmp.etiquetaB) },
      { html: Math.abs(l.d) > 0.005 ? V2.delta(l.d) : '<span class="pa-mini">igual</span>', clase: "nz-table__right", etiqueta: "Diferencia" }
    ])).join("");
    const filasEst = cmp.estructura.map(l => V2.fila([
      { html: l.texto },
      { html: l.clave === "horas" ? V2.hor(l.a) : N().fmtNum(l.a), clase: "nz-table__right", etiqueta: N().esc(cmp.etiquetaA) },
      { html: l.clave === "horas" ? V2.hor(l.b) : N().fmtNum(l.b), clase: "nz-table__right", etiqueta: N().esc(cmp.etiquetaB) },
      { html: Math.abs(l.d) > 0.005 ? V2.delta(l.d, (l.clave === "horas") ? "horas" : "numero") : '<span class="pa-mini">igual</span>', clase: "nz-table__right", etiqueta: "Diferencia" }
    ])).join("");
    const filasPerf = cmp.porPerfil.map(x => V2.fila([
      { html: N().esc(x.nombre) },
      { html: V2.hor(x.a), clase: "nz-table__right", etiqueta: "Antes" },
      { html: V2.hor(x.b), clase: "nz-table__right", etiqueta: "Ahora" },
      { html: Math.abs(x.d) > 0.005 ? V2.delta(x.d, "horas") : '<span class="pa-mini">igual</span>', clase: "nz-table__right", etiqueta: "Diferencia" },
      { html: conImp ? V2.delta(x.importeD) : "", clase: "nz-table__right", etiqueta: "Δ importe" }
    ])).join("");
    const filasMes = cmp.porPeriodo.filter(m => m.a || m.b).map(m => V2.fila([
      { html: N().esc(m.etiqueta) },
      { html: conImp ? V2.imp(m.a) : "", clase: "nz-table__right", etiqueta: "Antes" },
      { html: conImp ? V2.imp(m.b) : "", clase: "nz-table__right", etiqueta: "Ahora" },
      { html: Math.abs(m.d) > 0.005 ? V2.delta(m.d) : '<span class="pa-mini">igual</span>', clase: "nz-table__right", etiqueta: "Diferencia" }
    ])).join("");
    const cambios = cmp.cambios.length
      ? cmp.cambios.map(c => '<p class="pa-mini">' +
        (c.tipo === "alta" ? '<span class="nz-badge nz-badge--success">＋</span>' : (c.tipo === "baja" ? '<span class="nz-badge nz-badge--danger">−</span>' : '<span class="nz-badge nz-badge--brand">~</span>')) +
        " " + N().esc(c.texto) + "</p>").join("")
      : '<p class="pa-mini">Sin cambios de estructura entre las dos fotos.</p>';

    return '<div class="pa-bloque" style="margin-top:var(--nz-space-3)">' +
      V2.articulo("Diferencias: " + N().esc(cmp.etiquetaA) + " → " + N().esc(cmp.etiquetaB),
        V2.tabla(["", cmp.etiquetaA, cmp.etiquetaB, "Diferencia"], filasEco, null, null, true) +
        V2.tabla(["", cmp.etiquetaA, cmp.etiquetaB, "Diferencia"], filasEst, null, "nz-table--compact", true) +
        '<h4 class="nz-h4">Esfuerzo por perfil</h4>' + V2.tabla(["Perfil", "Antes", "Ahora", "Diferencia", "Δ importe"], filasPerf, null, "nz-table--compact", true) +
        (filasMes ? '<h4 class="nz-h4">Importe por periodo</h4>' + V2.tabla(["Periodo", "Antes", "Ahora", "Diferencia"], filasMes, null, "nz-table--compact", true) : "") +
        '<h4 class="nz-h4">Qué ha cambiado</h4>' + cambios,
        '<div class="pa-fila" style="margin-bottom:var(--nz-space-2)"><button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="foto-cerrar-comparacion">✕ Cerrar comparación</button></div>') +
      "</div>";
  }

  /* ---------- Render ---------- */

  function render() {
    const V2 = V(), o = APP().pr(), pf = APP().pf();
    if (!o) { ["res-totales", "res-perfiles", "res-tareas", "res-por-periodo", "res-fotos"].forEach(id => V2.vaciar(id)); return; }
    V2.escribir("res-totales", totales(o, pf));
    V2.escribir("res-perfiles", porPerfil(o, pf));
    V2.escribir("res-tareas", porTarea(o, pf));
    V2.escribir("res-por-periodo", porPeriodo(o, pf));
    V2.escribir("res-fotos", fotos(o, pf));
  }

  PL.vistas.resumen = { render: render };
})(typeof window !== "undefined" ? window : globalThis);

/* ====== MÓDULO vista-informe.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — VISTA: INFORME
   El documento que se imprime o se guarda en PDF: cabecera de marca, datos
   de la oferta, entregables con su fecha de entrega y criterio, detalle del
   esfuerzo, gastos, totales, resúmenes y condiciones.
   Sin seguimiento ni facturación.

   Todas las tablas son `--apilable` (objeto de Aurora 7): en el móvil cada fila
   es una tarjeta con el nombre de su columna delante, así que ninguna tabla se
   aplasta ni hay que arrastrar el documento de lado.
   ===================================================================== */
(function (raiz) {
  const PL = (raiz.PL = raiz.PL || {});
  const N = () => PL.nucleo;
  const P = () => PL.periodos;
  const C = () => PL.calculo;
  const E = () => PL.entregables;
  const V = () => PL.vistas;
  const APP = () => PL.app;

  /** Tabla del informe. Apilable: en móvil, tarjetas con la etiqueta de cada
      columna; desde 640 px, la tabla de siempre. `cabeceras` admite cadenas o
      `{ texto, num }` para alinear a la derecha. */
  function tabla(cabeceras, filas, pie) {
    const th = (cabeceras || []).map(c => {
      const texto = (typeof c === "string") ? c : c.texto;
      const num = (typeof c === "object") && c.num;
      return "<th" + (num ? ' class="pa-num"' : "") + ">" + texto + "</th>";
    }).join("");
    return '<div class="nz-table-wrap nz-table-wrap--apilable">' +
      '<table class="nz-table nz-table--apilable">' +
      (cabeceras && cabeceras.length ? "<thead><tr>" + th + "</tr></thead>" : "") +
      "<tbody>" + (filas || "") + "</tbody>" + (pie || "") + "</table></div>";
  }

  /** Fila de dos columnas: la primera es la clave (no lleva etiqueta), la segunda el valor. */
  function claveValor(k, v, fuerte) {
    return V().fila([
      { html: (fuerte ? "<strong>" : "") + k + (fuerte ? "</strong>" : ""), clase: "pa-informe__clave" },
      { html: v }
    ]);
  }

  function cabecera(o, marca) {
    const V2 = V();
    return '<div class="pa-informe__cab">' +
      '<div><div style="font-size:1.1rem;font-weight:800">' + N().esc(marca.nombre || "Planifica") + "</div>" +
      '<div class="pa-mini">' + N().esc(marca.sub || "") + "</div></div>" +
      '<div class="pa-mini" style="text-align:right">' + V2.badgeOferta(o) + "<br>" +
      (o.fecha ? "Fecha: " + N().esc(N().fechaLarga(o.fecha)) + "<br>" : "") +
      "Válida hasta " + N().esc(N().fechaLarga(N().fechaDeValidez(o.fecha, o.validezDias))) + "</div></div>";
  }

  function datosOferta(o) {
    const V2 = V();
    const filas =
      claveValor("Oferta", N().esc(o.nombre)) +
      (o.cliente.nombre ? claveValor("Cliente", N().esc(o.cliente.nombre)) : "") +
      (o.cliente.contacto ? claveValor("Contacto", N().esc(o.cliente.contacto)) : "") +
      (o.cliente.ref ? claveValor("Referencia", N().esc(o.cliente.ref)) : "") +
      claveValor("Estado", V2.badgeOferta(o)) +
      claveValor("Calendario", N().esc(P().duracionLegible(o.periodos))) +
      claveValor("Esfuerzo total", N().fmtHoras(C().ofertaHoras(o))) +
      (o.descripcion ? claveValor("Alcance", N().esc(o.descripcion)) : "");
    return "<h2>Datos de la oferta</h2>" + tabla(null, filas);
  }

  /** El calendario dentro del informe: el diagrama completo, con sus barras y sus
      rombos de entrega. Es la vista que el cliente necesita ver de un vistazo.
      Es ancho por naturaleza: aquí sí se desplaza, con la columna del concepto
      pegada a la izquierda para no perder el hilo. */
  function seccionGantt(o, pf) {
    const P2 = PL.periodos, C2 = PL.calculo;
    return "<h2>Calendario y entregas</h2>" +
      '<p class="pa-mini">' + N().esc(P2.duracionLegible(o.periodos)) + " · jornada de " +
      N().fmtNum(C2.jornada(o).horasDia) + " h/día · " +
      Math.round(C2.horasLaborablesTotal(o)).toLocaleString("es-ES") + " h laborables en el periodo · " +
      N().esc(String(C2.ofertaHoras(o)).replace(".", ",")) + " h de esfuerzo comprometido.</p>" +
      PL.gantt.htmlInforme(o, pf) +
      '<p class="pa-mini">Las barras señalan los meses con esfuerzo y el rombo ◆ el mes de entrega de cada entregable.</p>';
  }

  function tablaEntregables(o, pf) {
    const V2 = V();
    const ents = E().todos(o);
    if (!ents.length) return "";
    const filas = ents.map(e => {
      const r = E().responsable(pf, e);
      return V2.fila([
        { html: '<span class="pa-hito-informe">◆</span> ' + N().esc(P().mesCorto(o.periodos, e.periodo)) +
            (e.fecha ? '<br><span class="pa-mini">' + N().esc(N().fechaCorta(e.fecha)) + "</span>" : "") },
        { html: "<strong>" + N().esc(e.nombre) + "</strong>" + (e.descripcion ? '<br><span class="pa-mini">' + N().esc(e.descripcion) + "</span>" : ""),
          etiqueta: "Entregable" },
        { html: e._contexto === "oferta" ? "Oferta" : N().esc(e._tareaNombre), etiqueta: "Origen" },
        { html: r ? N().esc(r.nombre) : "—", clase: "pa-mini", etiqueta: "Responsable" },
        { html: N().esc(e.criterio || "—"), clase: "pa-mini", etiqueta: "Criterio de aceptación" }
      ]);
    }).join("");
    return "<h2>Entregables comprometidos</h2>" +
      tabla(["Entrega", "Entregable", "Origen", "Responsable", "Criterio de aceptación"], filas);
  }

  function tablaDetalle(o, pf) {
    const V2 = V();
    const conImp = V2.verImportes();
    const filas = [];
    N().lista(o.tareas).forEach(t => {
      filas.push('<tr><td colspan="5" class="pa-detalle__grupo">' + N().esc(t.nombre) + "</td></tr>");
      N().lista(t.subtareas).forEach(s => {
        filas.push(V2.fila([
          { html: "<strong>" + N().esc(s.nombre) + "</strong>" },
          { html: conImp ? V2.imp(C().subtareaImporte(s, pf)) : "", clase: "pa-num pa-importe", etiqueta: "Importe" },
          { html: N().fmtHoras(C().subtareaHoras(s)), clase: "pa-num", etiqueta: "Horas" },
          null,
          { html: P().duracionLegible(o.periodos).split(" · ")[0], etiqueta: "Periodo" }
        ]));
        N().lista(s.lineas).forEach(l => {
          const p = C().perfilPorId(pf, l.perfilId);
          filas.push(V2.fila([
            { html: N().esc(p ? p.nombre : "(perfil eliminado)"), clase: "pa-mini" },
            { html: conImp ? V2.imp(p ? p.tarifa : 0) : "", clase: "pa-num pa-importe", etiqueta: "Tarifa" },
            { html: conImp ? V2.imp(C().lineaImporte(l, pf)) : "", clase: "pa-num pa-importe", etiqueta: "Importe" },
            { html: N().fmtHoras(C().lineaHoras(l)), clase: "pa-num", etiqueta: "Horas" },
            { html: P().duracionLegible(o.periodos).split(" · ")[0], etiqueta: "Periodo" }
          ]));
        });
      });
    });
    const pie = "";
    return "<h2>Detalle de tareas y esfuerzo</h2>" +
      tabla(["Concepto", { texto: "Importe", num: true }, { texto: "Horas", num: true }, "", "Periodo"],
        filas.join("") || '<tr><td colspan="5">Sin contenido.</td></tr>', pie);
  }

  function tablaGastos(o) {
    const V2 = V();
    const gastos = N().lista(o.gastos);
    if (!gastos.length) return "";
    const conImp = V2.verImportes();
    const filas = gastos.map(g => V2.fila([
      { html: N().esc(g.nombre) },
      { html: N().fmtNum(g.unidades), clase: "pa-num", etiqueta: "Unidades" },
      { html: conImp ? V2.imp(g.precio) : "", clase: "pa-num pa-importe", etiqueta: "Precio" },
      { html: conImp ? V2.imp(C().gastoImporte(g)) : "", clase: "pa-num pa-importe", etiqueta: "Importe" }
    ])).join("");
    return "<h2>Gastos generales</h2>" +
      tabla(["Concepto", { texto: "Unidades", num: true }, { texto: "Precio", num: true }, { texto: "Importe", num: true }], filas);
  }

  function tablaTotales(o, pf) {
    const V2 = V();
    const conImp = V2.verImportes();
    const d = o.descuento || {}, t = o.impuestos || {};
    const linea = (texto_, valor, fuerte) => V2.fila([
      { html: (fuerte ? "<strong>" : "") + texto_ + (fuerte ? "</strong>" : "") },
      { html: (fuerte ? "<strong>" : "") + (conImp ? V2.imp(valor) : "") + (fuerte ? "</strong>" : ""), clase: "pa-num pa-importe" }
    ]);
    const filas = linea("Consultoría", C().importeOferta(o, pf)) +
      (C().gastosTotal(o) ? linea("Gastos generales", C().gastosTotal(o)) : "") +
      linea("Subtotal", C().subtotalOferta(o, pf), true) +
      (d.tipo ? linea("Descuento (" + (d.tipo === "%" ? N().fmtNum(d.valor) + " %" : "importe fijo") + ")", -C().descuentoImporte(o, pf)) : "") +
      linea("Base imponible", C().baseImponible(o, pf)) +
      (C().nombreImpuesto(o) ? linea(C().nombreImpuesto(o) + " " + N().fmtNum(t.tasa) + " %" + (t.incluido ? " (incluido en los precios)" : ""), C().impuestoImporte(o, pf)) : "");
    const pie = "<tfoot><tr><td><strong>TOTAL</strong></td><td class=\"pa-num pa-importe\"><strong>" +
      (conImp ? V2.imp(C().totalOferta(o, pf)) : "") + "</strong></td></tr></tfoot>";
    return "<h2>Totales</h2>" + tabla(null, filas, pie) +
      (o.condicionesPago ? "<p><strong>Condiciones de pago:</strong> " + N().esc(o.condicionesPago) + "</p>" : "");
  }

  function tablaPerfiles(o, pf) {
    const V2 = V();
    const horas = C().horasPorPerfil(o);
    const conImp = V2.verImportes();
    const filas = N().lista(pf).filter(p => N().num(horas[p.id]) > 0).map(p => V2.fila([
      { html: N().esc(p.nombre) + ' <span class="pa-mini">(' + N().esc(p.categoria) + ")</span>" },
      { html: N().fmtHoras(horas[p.id]), clase: "pa-num", etiqueta: "Horas" },
      { html: conImp ? V2.imp(C().importePerfil(o, pf, p.id)) : "", clase: "pa-num pa-importe", etiqueta: "Importe" }
    ])).join("");
    return "<h2>Resumen por perfil</h2>" +
      tabla(["Perfil", { texto: "Horas", num: true }, { texto: "Importe", num: true }],
        filas || '<tr><td colspan="3">—</td></tr>');
  }

  function tablaPeriodos(o, pf) {
    const V2 = V();
    const cols = P().columnas(o.periodos);
    const conImp = V2.verImportes();
    const filas = cols.map(c => V2.fila([
      { html: N().esc(c.etiqueta) + " " + c.anio },
      { html: c.periodos.reduce((s, i) => s + C().horasPeriodo(o, i), 0).toLocaleString("es-ES"), clase: "pa-num", etiqueta: "Horas" },
      { html: c.periodos.reduce((s, i) => s + E().dePeriodo(o, i).length, 0) || "·", clase: "pa-num", etiqueta: "Entregables" },
      { html: conImp ? V2.imp(c.periodos.reduce((s, i) => s + C().importePeriodo(o, pf, i), 0)) : "", clase: "pa-num pa-importe", etiqueta: "Importe" }
    ])).join("");
    const pie = '<tfoot><tr><td><strong>Total</strong></td><td class="pa-num"><strong>' + C().ofertaHoras(o).toLocaleString("es-ES") +
      '</strong></td><td class="pa-num"><strong>' + E().porContexto(o).total + '</strong></td><td class="pa-num pa-importe"><strong>' +
      (conImp ? V2.imp(C().importeOferta(o, pf)) : "") + "</strong></td></tr></tfoot>";
    return "<h2>Esfuerzo y entregas por periodo</h2>" +
      tabla(["Periodo", { texto: "Horas", num: true }, { texto: "Entregables", num: true }, { texto: "Importe", num: true }], filas, pie);
  }

  function tablaAnualidades(o, pf) {
    const V2 = V();
    const an = C().anualidades(o, pf);
    const claves = Object.keys(an);
    if (claves.length < 2) return "";
    const conImp = V2.verImportes();
    const filas = claves.map(y => V2.fila([
      { html: y },
      { html: conImp ? V2.imp(an[y]) : "", clase: "pa-num pa-importe", etiqueta: "Importe" }
    ])).join("");
    const pie = '<tfoot><tr><td><strong>TOTAL</strong></td><td class="pa-num pa-importe"><strong>' +
      (conImp ? V2.imp(N().r2(N().suma(claves, y => an[y]))) : "") + "</strong></td></tr></tfoot>";
    return "<h2>Anualidades</h2>" +
      tabla(["Año", { texto: "Importe", num: true }], filas, pie);
  }

  function render() {
    const V2 = V(), APP2 = APP();
    const o = APP2.pr();
    const cont = "informe-cuerpo";
    if (!o) { V2.escribir(cont, ""); return; }
    const marca = APP2.ESTADO.marca || {};
    const pf = APP2.pf();
    const logo = marca.logo ? '<div style="margin-bottom:var(--nz-space-2)"><img class="pa-logo" style="height:44px;max-width:220px" src="' + marca.logo + '" alt=""></div>' : "";

    V2.escribir(cont,
      cabecera(o, marca) + logo +
      "<h1>" + N().esc(o.nombre) + "</h1>" +
      datosOferta(o) +
      seccionGantt(o, pf) +
      tablaEntregables(o, pf) +
      tablaDetalle(o, pf) +
      tablaGastos(o) +
      tablaTotales(o, pf) +
      tablaPerfiles(o, pf) +
      tablaPeriodos(o, pf) +
      tablaAnualidades(o, pf) +
      '<div class="pa-informe__pie"><span>Generado con ' + N().esc(marca.nombre || "Planifica") + "</span><span>" + N().fechaLarga(N().hoyISO()) + "</span></div>" +
      '<p class="pa-mini" style="margin-top:var(--nz-space-2)">Hecho con ❤️ por David Antizar</p>');
  }

  PL.vistas.informe = { render: render };
})(typeof window !== "undefined" ? window : globalThis);

/* ====== MÓDULO acciones.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — ACCIONES
   Todo lo que hacen los botones (data-acc). Cambian el modelo y piden un
   repintado; nunca tocan el DOM a mano. Las acciones destructivas descargan
   antes una copia de seguridad.
   ===================================================================== */
(function (raiz) {
  const PL = (raiz.PL = raiz.PL || {});
  const N = () => PL.nucleo;
  const P = () => PL.periodos;
  const M = () => PL.modelo;
  const C = () => PL.calculo;
  const E = () => PL.entregables;
  const X = () => PL.comparar;
  const A = () => PL.almacen;
  const R = () => PL.repintar;
  const V = () => PL.vistas;
  const APP = () => PL.app;

  const o = () => APP().pr();
  /** Importe en texto para los avisos. */
  const r2texto = v => N().fmtNum(v) + " €";
  const pf = () => APP().pf();
  const id = b => b.dataset.id || "";
  const tarea = b => b.dataset.tarea || "";

  function copiaAntes(motivo) {
    A().descargar("planifica-copia-antes-de-" + motivo + "-" + N().hoyISO() + ".json",
      JSON.stringify(APP().ESTADO, null, 2), "application/json");
  }

  function mover(arr, id_, dir) {
    const i = arr.findIndex(x => x.id === id_);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return false;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    return true;
  }

  const acc = {

    /* ---------- Ofertas ---------- */
    "nueva-oferta": () => {
      const nueva = M().nuevaOferta("Oferta sin título");
      APP().ESTADO.ofertas.push(nueva);
      APP().ESTADO.activa = nueva.id;
      APP().ESTADO.guiaVista = true;
      R().todo(); APP().guardar(); APP().toast("Oferta creada");
    },
    "dup-oferta": () => {
      const origen = o();
      const copia = M().normalizarOferta(Object.assign({}, N().clonar(origen), {
        nombre: origen.nombre + " (copia)", estado: "borrador", fotos: []
      }));
      copia.id = N().uid("of_");
      copia.guia = false;
      APP().ESTADO.ofertas.push(copia);
      APP().ESTADO.activa = copia.id;
      R().todo(); APP().guardar(); APP().toast("Oferta duplicada (sin sus fotos)");
    },
    "elim-oferta": () => {
      const actual = o();
      if (APP().ESTADO.ofertas.length <= 1) { APP().toast("Debe existir al menos una oferta"); return; }
      if (!confirm("¿Eliminar la oferta «" + actual.nombre + "» con todo su contenido?\n\nSe descargará antes una copia de seguridad.")) return;
      copiaAntes("eliminar-oferta");
      APP().ESTADO.ofertas = APP().ESTADO.ofertas.filter(x => x.id !== actual.id);
      APP().ESTADO.activa = APP().ESTADO.ofertas[0].id;
      R().todo(); APP().guardar(); APP().toast("Oferta eliminada");
    },

    /* ---------- Calendario ---------- */
    /* Meses ⇄ semanas: se convierte el calendario entero repartiendo las horas por
       días laborables reales. Se avisa antes y se cuenta lo que ha pasado. */
    "cal-unidad": b => {
      const u = (b && b.dataset && b.dataset.unidad) === "semana" ? "semana" : "mes";
      const of = o();
      if (P().normalizar(of.periodos).unidad === u) return;
      if (!confirm("¿Pasar el calendario a " + (u === "semana" ? "semanas" : "meses") + "?\n\n" +
        "Las horas se reparten por los días laborables reales de cada periodo y el total se mantiene. " +
        "Los rótulos de periodo personalizados se pierden.")) return;
      const r = PL.unidades.convertirOferta(of, u);
      if (!r) return;
      R().todo(); APP().guardar();
      APP().toast("Calendario en " + (u === "semana" ? "semanas" : "meses") + ": " +
        (u === "semana" ? r.nSemanas + " semanas" : r.nMesesDestino + " meses") + " · " +
        N().fmtCampo(r.totalHoras) + " h y " + r2texto(C().importeOferta(of, pf())) + " (total sin cambios)");
    },

    /* Cómo se teclean las horas: dedicación (% de jornada) u horas. */
    "modo-horas": b => {
      const m = (b && b.dataset && b.dataset.modo) === "h" ? "h" : "pct";
      APP().conModoHoras(m);
      R().trabajo(); R().datos(); APP().guardar();
      APP().toast(m === "pct" ? "Se teclean dedicaciones (% de jornada)" : "Se teclean horas");
    },

    "cal-antes": () => cambiarCalendario(P().desplazar(o().periodos, -1), "Calendario retrasado un mes"),
    "cal-despues": () => cambiarCalendario(P().desplazar(o().periodos, 1), "Calendario adelantado un mes"),
    "cal-zoom": () => cambiarCalendario(P().conZoom(o().periodos, P().siguienteZoom(o().periodos.zoom)), ""),
    "cal-rotulos-auto": () => {
      o().periodos = P().volverTodoAuto(o().periodos);
      R().todo(); APP().guardar(); APP().toast("Rótulos automáticos restaurados");
    },

    /* ---------- Estructura ---------- */
    "nueva-tarea": () => {
      o().tareas.push(M().nuevaTarea("Tarea " + (N().lista(o().tareas).length + 1)));
      R().todo(); APP().guardar();
    },
    "dup-tarea": b => {
      const t = M().buscarTarea(o(), id(b)); if (!t) return;
      const copia = C().clonarTarea(t);
      copia.nombre = t.nombre + " (copia)";
      o().tareas.splice(o().tareas.indexOf(t) + 1, 0, copia);
      R().todo(); APP().guardar();
    },
    "elim-tarea": b => {
      const t = M().buscarTarea(o(), id(b)); if (!t) return;
      if (!confirm("¿Eliminar la tarea «" + t.nombre + "» con sus subtareas, horas y entregables?")) return;
      o().tareas.splice(o().tareas.indexOf(t), 1);
      R().todo(); APP().guardar();
    },
    "subir-tarea": b => { if (mover(o().tareas, id(b), -1)) { R().todo(); APP().guardar(); } },
    "bajar-tarea": b => { if (mover(o().tareas, id(b), 1)) { R().todo(); APP().guardar(); } },

    "nueva-sub": b => {
      const t = M().buscarTarea(o(), id(b)); if (!t) return;
      t.subtareas.push(M().nuevaSubtarea("Subtarea " + (N().lista(t.subtareas).length + 1)));
      R().todo(); APP().guardar();
    },
    "dup-sub": b => {
      const r = M().buscarSubtarea(o(), id(b)); if (!r) return;
      const copia = C().clonarSubtarea(r.sub);
      copia.nombre = r.sub.nombre + " (copia)";
      r.tarea.subtareas.splice(r.tarea.subtareas.indexOf(r.sub) + 1, 0, copia);
      R().todo(); APP().guardar();
    },
    "elim-sub": b => {
      const r = M().buscarSubtarea(o(), id(b)); if (!r) return;
      if (!confirm("¿Eliminar la subtarea «" + r.sub.nombre + "» con sus horas?")) return;
      r.tarea.subtareas.splice(r.tarea.subtareas.indexOf(r.sub), 1);
      R().todo(); APP().guardar();
    },
    "subir-sub": b => {
      const r = M().buscarSubtarea(o(), id(b)); if (!r) return;
      if (mover(r.tarea.subtareas, id(b), -1)) { R().todo(); APP().guardar(); }
    },
    "bajar-sub": b => {
      const r = M().buscarSubtarea(o(), id(b)); if (!r) return;
      if (mover(r.tarea.subtareas, id(b), 1)) { R().todo(); APP().guardar(); }
    },

    "nueva-linea": b => {
      const r = M().buscarSubtarea(o(), id(b)); if (!r) return;
      const primero = N().lista(pf())[0];
      r.sub.lineas.push(M().nuevaLinea(primero ? primero.id : "", P().meses(o().periodos)));
      r.sub._abierta = true;
      R().todo(); APP().guardar();
    },
    /* --- Festivos: se añaden, se quitan y se recargan los de España y Madrid --- */
    "nuevo-festivo": () => {
      const of = o(); if (!of) return;
      const fEl = document.querySelector('[data-campo="festivo-fecha"]');
      const nEl = document.querySelector('[data-campo="festivo-nombre"]');
      const fecha = fEl ? String(fEl.value || "").trim() : "";
      if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) { APP().toast("Elige primero el día del festivo"); return; }
      const j = M().normalizarJornada(of.jornada);
      const lista = j.festivos.filter(x => x.fecha !== fecha);
      const nombre = (nEl && nEl.value ? String(nEl.value).trim() : "") || "Festivo propio";
      lista.push({ fecha: fecha, nombre: nombre, ambito: "Propio" });
      j.festivos = M().normalizarFestivos(lista);
      of.jornada = j;
      R().todo(); APP().guardar();
      APP().toast("Festivo añadido: " + N().fechaCorta(fecha) + " · " + nombre);
    },

    "quitar-festivo": b => {
      const of = o(); if (!of) return;
      const fecha = id(b);
      const j = M().normalizarJornada(of.jornada);
      j.festivos = j.festivos.filter(x => x.fecha !== fecha);
      of.jornada = j;
      R().todo(); APP().guardar();
      APP().toast("Festivo quitado del calendario");
    },

    "festivos-espana": () => {
      const of = o(); if (!of || !PL.festivos) return;
      const j = M().normalizarJornada(of.jornada);
      const carga = PL.festivos.paraRango(of.periodos.inicio, P().meses(of.periodos), of.periodos.unidad);
      const porFecha = {};
      j.festivos.forEach(f => { porFecha[f.fecha] = f; });
      let nuevos = 0;
      carga.forEach(f => { if (!porFecha[f.fecha]) { porFecha[f.fecha] = f; nuevos++; } });
      j.festivos = M().normalizarFestivos(Object.keys(porFecha).map(k => porFecha[k]));
      of.jornada = j;
      R().todo(); APP().guardar();
      APP().toast("Festivos de España y Madrid cargados (" + nuevos + " nuevos, " + j.festivos.length + " en total)");
    },

    "elim-linea": b => {
      const r = M().buscarLinea(o(), id(b)); if (!r) return;
      const p = C().perfilPorId(APP().ESTADO.perfiles, r.linea.perfilId);
      const h = C().lineaHoras(r.linea);
      /* Quitar una línea se lleva horas e importe: siempre se pregunta antes. */
      if (!confirm("¿Quitar a " + (p ? p.nombre : "este perfil") + " de «" + r.sub.nombre + "»?\n\n" +
        (h ? "Se van " + h.toLocaleString("es-ES") + " h y " + r2texto(C().lineaImporte(r.linea, APP().ESTADO.perfiles)) + "." : "La línea aún no tiene horas puestas."))) return;
      r.sub.lineas.splice(r.sub.lineas.indexOf(r.linea), 1);
      R().todo(); APP().guardar();
      APP().toast("Línea eliminada");
    },

    /* Plegar y desplegar por niveles: es la forma rápida de ver la oferta entera. */
    "toggle-tarea": b => {
      const t = M().buscarTarea(o(), id(b));
      if (!t) return;
      t._abierta = !t._abierta;
      R().trabajo(); APP().guardar();
    },
    "abrir-todo": () => {
      N().lista(o().tareas).forEach(t => { t._abierta = true; N().lista(t.subtareas).forEach(s => { s._abierta = true; }); });
      R().trabajo(); APP().guardar(); APP().toast("Todo desplegado");
    },
    "cerrar-todo": () => {
      N().lista(o().tareas).forEach(t => N().lista(t.subtareas).forEach(s => { s._abierta = false; }));
      R().trabajo(); APP().guardar(); APP().toast("Subtareas plegadas");
    },
    "solo-tareas": () => {
      N().lista(o().tareas).forEach(t => { t._abierta = true; N().lista(t.subtareas).forEach(s => { s._abierta = false; }); });
      R().trabajo(); APP().guardar(); APP().toast("Sólo las tareas a la vista");
    },
    "plegar-tareas": () => {
      N().lista(o().tareas).forEach(t => { t._abierta = false; });
      R().trabajo(); APP().guardar(); APP().toast("Tareas plegadas");
    },

    /* ---------- Entregables ---------- */
    /* Entregable colgado de una SUBTAREA: lo habitual, se entrega al cerrar el trabajo. */
    "nuevo-entregable-sub": b => {
      const s = M().buscarSubtarea(o(), id(b));
      if (!s) return;
      M().colgarEntregable(o(), "Entregable " + (N().lista(s.sub.entregables).length + 1), "subtarea", 0, s.tarea.id, s.sub.id);
      R().todo(); APP().guardar();
      APP().toast("Entregable añadido a «" + s.sub.nombre + "»");
    },

    "nuevo-entregable-tarea": b => {
      const t = M().buscarTarea(o(), id(b)); if (!t) return;
      M().colgarEntregable(o(), "Entregable " + (N().lista(t.entregables).length + 1), "tarea", 0, t.id);
      R().todo(); APP().guardar(); APP().toast("Entregable añadido a la tarea");

  /** Cambia el calendario de la oferta y repinta todo. */
  function cambiarCalendario(periodos, mensaje) {
    const of = o();
    const antes = P().meses(of.periodos);
    of.periodos = periodos;
    const despues = P().meses(of.periodos);
    /* Al cambiar la duración, las horas de los periodos que desaparecen se tiran
       (y los entregables se acotan), igual que al editar el campo de duración. */
    if (despues !== antes) ajustarPeriodos(of, despues);
    R().todo(); APP().guardar();
    if (mensaje) APP().toast(mensaje);
  }

  /** Recorta o estira las horas de todas las líneas al nuevo número de periodos. */
  function ajustarPeriodos(of, n) {
    N().lista(of.tareas).forEach(t => N().lista(t.subtareas).forEach(s => N().lista(s.lineas).forEach(l => {
      const h = l.horas = l.horas || {};
      for (let i = 0; i < n; i++) if (h["p" + i] === undefined) h["p" + i] = 0;
      Object.keys(h).forEach(k => {
        const i = parseInt(k.slice(1), 10);
        if (isNaN(i) || i >= n) delete h[k];
      });
    })));
    N().lista(of.entregables).forEach(e => { e.periodo = Math.min(N().num(e.periodo), n - 1); });
    N().lista(of.tareas).forEach(t => N().lista(t.entregables).forEach(e => { e.periodo = Math.min(N().num(e.periodo), n - 1); }));
  }

      : ("Escenario " + (X().fotosDe(o(), "escenario").length + 1));

    if (nombreInp) nombreInp.value = "";
    if (notaInp) notaInp.value = "";

   Planifica v4 — EVENTOS

  function alClic(e) {

    if (btn) {

      if (f) f(btn);
      else APP().toast("Acción no disponible: " + btn.dataset.acc);
      return;
    }
    /* Ir a la tarea desde el Gantt */
    const concepto = e.target.closest ? e.target.closest("[data-ir]") : null;
    if (concepto) {
      const esSubtarea = concepto.dataset.ir.indexOf("sb_") === 0;
      const sel = esSubtarea
        ? '.pa-sub[data-id="' + concepto.dataset.ir + '"] > summary [data-campo="sub-nombre"]'
        : '[data-campo="tarea-nombre"][data-id="' + concepto.dataset.ir + '"]';
      const el = document.querySelector(sel);
      if (el) { el.focus(); if (el.scrollIntoView) el.scrollIntoView({ block: "center" }); }
      return;

    const tab = e.target.closest ? e.target.closest("#pa-tabs .nz-tabs__tab") : null;
    if (tab) APP().pestana(tab.dataset.tab);

    if (el.id === "aj-sub") { APP().ESTADO.marca.sub = el.value; APP().guardar(); return; }

        const leido = N().parseaCantidad(el.value);

      }

      /* Números de la oferta */
      case "jornada-horas": {
        /* El valor general: se aplica a todos los días y se olvidan las
           excepciones, que es lo que se espera al tocar «horas por día». */
        const j = PL.modelo.normalizarJornada(of.jornada);
        j.horasDia = N().acota(el.value, 0.5, 24);
        j.horasPorDia = null;
        of.jornada = j;
        R().todo(); APP().guardar();
        return;
      }

      case "jornada-horas-dia": {
        /* Horas de un día concreto: el viernes puede ser más corto. */
        const j = PL.modelo.normalizarJornada(of.jornada);
        const d = N().num(el.dataset.dia);
        const porDia = Object.assign({}, j.horasPorDia);
        const horas = N().acota(el.value, 0, 24);
        porDia[d] = horas;
        j.horasPorDia = porDia;
        if (horas <= 0) j.diasSemana = N().lista(j.diasSemana).filter(x => x !== d);
        of.jornada = j;
        R().todo(); APP().guardar();
        return;
      }

      case "festivo-fecha": case "festivo-nombre": return;   /* los lee el botón de añadir */

      case "oferta-validez": of.validezDias = N().acota(el.value, 0, 3650); R().datos(); APP().guardar(); return;
      case "oferta-fecha": of.fecha = el.value; R().datos(); APP().guardar(); return;
      case "oferta-impuesto-tasa": of.impuestos.tasa = N().acota(el.value, 0, 100); R().datos(); APP().guardar(); return;
      case "oferta-descuento-valor": of.descuento.valor = N().acota(el.value, 0, 1e9); R().datos(); APP().guardar(); return;

      /* Perfiles */
      case "perfil-nombre": {
        const p = C().perfilPorId(APP().ESTADO.perfiles, el.dataset.id);
        if (p) { p.nombre = el.value; R().datos(); APP().guardar(); }
        return;
      }
      case "perfil-tarifa": {
        const p = C().perfilPorId(APP().ESTADO.perfiles, el.dataset.id);
        if (p) { p.tarifa = N().acota(el.value, 0, 1e9); R().datos(); APP().guardar(); }
        return;
      }
      case "perfil-notas": {
        const p = C().perfilPorId(APP().ESTADO.perfiles, el.dataset.id);
        if (p) { p.notas = el.value; APP().guardar(); }
        return;
      }
      case "perfil-unidad": {
        const p = C().perfilPorId(APP().ESTADO.perfiles, el.dataset.id);
        if (p) { p.unidad = N().texto(el.value, "h"); APP().guardar(); }
        return;
      }

      default: return;
    }
  }

  /* ---------- Cambios (selects y checkboxes) ---------- */

  function alCambiar(e) {
    const el = e.target;
    const campo = el.dataset ? el.dataset.campo : null;
    const of = o();

    if (el.id === "pa-sel-oferta") { APP().ESTADO.activa = el.value; R().todo(); APP().guardar(); return; }
    if (el.id === "aj-importes") { APP().ESTADO.mostrarImportes = el.checked; R().todo(); APP().guardar(); return; }
    if (el.id === "pa-logo-fichero") { leerLogo(el); return; }
    if (el.id === "pa-fichero") { leerJson(el); return; }
    if (!of) return;

    switch (campo) {
      case "jornada-dia": {
        const j = PL.modelo.normalizarJornada(of.jornada);
        const dia = N().num(el.dataset.dia);
        j.diasSemana = el.checked
          ? j.diasSemana.concat([dia]).sort((a, b) => a - b)
          : j.diasSemana.filter(d => d !== dia);
        if (!j.diasSemana.length) { APP().toast("Tiene que quedar al menos un día de trabajo"); el.checked = true; return; }
        of.jornada = j;
        R().todo(); APP().guardar();
        return;
      }

      case "cal-inicio": {
        of.periodos = P().conInicio(of.periodos, el.value);
        R().todo(); APP().guardar();
        return;
      }
      case "cal-n": {
        of.periodos = P().conN(of.periodos, el.value);
        PL.acciones.ajustarPeriodos(of, P().meses(of.periodos));
        R().todo(); APP().guardar();
        return;
      }
      case "periodo-rotulo": { R().todo(); return; }   /* al salir del campo, repintado completo */
      case "horas": {
        /* Al salir del campo se deja escrito el valor limpio en la unidad del modo. */
        const r = M().buscarLinea(of, el.dataset.id);
        if (!r) return;
        const i = N().num(el.dataset.mes);
        const h = N().num((r.linea.horas || {})["p" + i]);
        el.value = N().fmtCampo(el.dataset.modo === "pct" ? C().pctDeHoras(of, i, h) : h);
        return;
      }
      case "linea-perfil": {
        const r = M().buscarLinea(of, el.dataset.id);
        if (r) { r.linea.perfilId = el.value; R().todo(); APP().guardar(); }
        return;
      }
      case "hito-periodo": {
        const r = M().buscarEntregable(of, el.dataset.id, el.dataset.tarea || "", el.dataset.subtarea || "");
        if (!r) return;
        r.entregable.periodo = Math.round(N().acota(el.value, 0, P().meses(of.periodos) - 1));
        R().todo(); APP().guardar();
        return;
      }
      case "hito-responsable": {
        const r = M().buscarEntregable(of, el.dataset.id, el.dataset.tarea || "", el.dataset.subtarea || "");
        if (!r) return;
        r.entregable.responsablePerfilId = el.value;
        R().todo(); APP().guardar();
        return;
      }
      case "perfil-categoria": {
        const p = C().perfilPorId(APP().ESTADO.perfiles, el.dataset.id);
        if (p) { p.categoria = el.value; APP().guardar(); }
        return;
      }
      case "oferta-estado": { of.estado = M().esEstadoOferta(el.value) ? el.value : "borrador"; R().todo(); APP().guardar(); return; }
      case "oferta-impuesto-tipo": { of.impuestos.tipo = el.value; R().todo(); APP().guardar(); return; }
      case "oferta-impuesto-incluido": { of.impuestos.incluido = el.checked; R().todo(); APP().guardar(); return; }
      case "oferta-descuento-tipo": { of.descuento.tipo = el.value; R().todo(); APP().guardar(); return; }
      default: return;
    }
  }

  /** Plegar o desplegar una subtarea (estado guardado en el modelo). */
  function alPlegar(e) {
    const el = e.target;
    if (!el || !el.classList || !el.classList.contains("pa-sub")) return;
    const r = M().buscarSubtarea(o(), el.dataset.id);
    if (r) { r.sub._abierta = !!el.open; APP().guardar(); }
  }

  /* ---------- Ficheros ---------- */

  function leerJson(el) {
    const f = el.files && el.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const analisis = A().analizarImportacion(String(fr.result));
      if (!analisis.ok) { APP().toast(analisis.error); el.value = ""; return; }
      let reemplazar = false;
      if (analisis.tipo === "estado") {
        reemplazar = confirm("ACEPTAR = Reemplazar TODOS los datos actuales\nCANCELAR = Fusionar (añade y actualiza por id)");
        if (reemplazar) {
          A().descargar("planifica-copia-anterior-" + N().hoyISO() + ".json", JSON.stringify(APP().ESTADO, null, 2), "application/json");
        }
      }
      const r = A().aplicarImportacion(APP().ESTADO, analisis, { reemplazar: reemplazar, aplicarMarca: reemplazar });
      R().todo(); APP().guardar();
      APP().toast(r.mensaje || "Importación completada");
      el.value = "";
    };
    fr.readAsText(f);
  }

  function leerLogo(el) {
    const f = el.files && el.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const src = String(fr.result);
      if (src.length > 300000) { APP().toast("Logo demasiado grande (máx. ~300 KB)"); el.value = ""; return; }
      APP().ESTADO.marca.logo = src;
      R().cabecera(); R().todo(); APP().guardar();
      APP().toast("Logo aplicado");
      el.value = "";
    };
    fr.readAsDataURL(f);
  }

  /* ---------- Montaje ---------- */

  function montar() {
    document.addEventListener("click", alClic);
    document.addEventListener("input", alEscribir);
    document.addEventListener("change", alCambiar);
    document.addEventListener("toggle", alPlegar, true);

    document.addEventListener("keydown", e => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const k = String(e.key || "").toLowerCase();
      if (k === "s") { e.preventDefault(); A().exportarTodo(APP().ESTADO); APP().toast("Copia de seguridad descargada"); }
      if (k === "p") { APP().pestana("informe"); }
    });
  }

  PL.eventos = { montar: montar };
})(typeof window !== "undefined" ? window : globalThis);

/* ====== MÓDULO main.js ====== */
"use strict";
/* =====================================================================
   Planifica v4 — ARRANQUE
   Une todo: carga con migración y aviso, repintado CONECTADO (cualquier
   cambio se refleja en todas las vistas) y errores en pantalla.

   Rendimiento: `escribir()` compara el HTML antes de tocar el DOM, así que
   repintar las 5 vistas en cada cambio es barato y no produce parpadeos.
   Mientras se teclean horas solo se repinta el resto (el editor se actualiza
   fila a fila), de modo que nunca se pierde el foco.
   ===================================================================== */
(function (raiz) {
  const PL = (raiz.PL = raiz.PL || {});
  const N = () => PL.nucleo;
  const P = () => PL.periodos;
  const M = () => PL.modelo;
  const C = () => PL.calculo;
  const E = () => PL.entregables;
  const A = () => PL.almacen;
  const V = () => PL.vistas;

  const VISTAS = ["trabajo", "oferta", "perfiles", "carga", "resumen", "informe", "ajustes"];
  const PANELES = {
    trabajo: "pa-trabajo-panel", oferta: "pa-oferta-panel", perfiles: "pa-perfiles-panel",
    carga: "pa-carga-panel", resumen: "pa-resumen-panel", informe: "pa-informe-panel", ajustes: "pa-ajustes-panel"
  };

  let tGuardar = null, tDatos = null;
  let pestanaActual = "trabajo";

  /* ---------- Aplicación ---------- */

  const app = {
    ESTADO: null,
    ui: { comparacion: null },

    pr: function () {
      const e = app.ESTADO;
      if (!e || !e.ofertas.length) return null;
      return e.ofertas.filter(x => x.id === e.activa)[0] || e.ofertas[0];
    },
    pf: function () { return (app.ESTADO && app.ESTADO.perfiles) || []; },
    moneda: function () { return (app.ESTADO && app.ESTADO.marca && app.ESTADO.marca.moneda) || "€"; },
    /** Cómo se teclean las horas: en dedicación (%) o en horas. Las horas siempre
        son el dato guardado; el % es la puerta de entrada cómoda. */
    modoHoras: function () { return (app.ESTADO && app.ESTADO.ui && app.ESTADO.ui.modoHoras) === "h" ? "h" : "pct"; },
    conModoHoras: function (m) {
      app.ESTADO.ui = app.ESTADO.ui || {};
      app.ESTADO.ui.modoHoras = (m === "h") ? "h" : "pct";
    },
    verImportes: function () { return !!(app.ESTADO && app.ESTADO.mostrarImportes); },
    pestana: function (n) { if (n) mostrarPestana(n); return pestanaActual; },

    guardar: function () {
      clearTimeout(tGuardar);
      tGuardar = setTimeout(function () {
        const err = A().guardar(app.ESTADO);
        if (err) app.toast("No se pudo guardar: " + err);
        const el = V().nodo("pa-guardado");
        if (el) { el.textContent = "Guardado ✓"; setTimeout(function () { el.textContent = ""; }, 1500); }
      }, 250);
    },

    toast: function (mensaje) {
      let el = V().nodo("pa-toast");
      if (!el) { el = document.createElement("div"); el.id = "pa-toast"; document.body.appendChild(el); }
      el.textContent = mensaje;
      el.classList.add("is-visible");
      clearTimeout(el.__tm);
      el.__tm = setTimeout(function () { el.classList.remove("is-visible"); }, 2800);
    },

    reemplazarEstado: function (nuevo, pestana) {
      app.ESTADO = nuevo;
      app.ui.comparacion = null;
      pestanaActual = null;
      mostrarPestana(pestana || "trabajo");
    }
  };
  PL.app = app;

  /* ---------- Repintado conectado ---------- */

  function pintarVista(nombre) {
    const v = PL.vistas[nombre];
    if (v && typeof v.render === "function") v.render();
  }

  function pintarCalendario() { PL.vistas.trabajo.renderCalendario(); }
  function pintarGantt() { PL.vistas.trabajo.renderGantt(); }

  function todasLasVistas() { VISTAS.forEach(pintarVista); }

  PL.repintar = {
    cabecera: function () {
      const e = app.ESTADO, o = app.pr();
      if (!e) return;
      const marca = e.marca || {};
      V().texto("pa-marca-nombre", marca.nombre || "Oferta");
      V().texto("pa-pie-marca", marca.nombre || "Oferta");
      document.title = (marca.nombre || "Oferta") + " — del encargo a la oferta";

      const img = V().nodo("pa-logo");
      if (img) { if (marca.logo) { img.src = marca.logo; img.hidden = false; } else { img.hidden = true; } }

      const sel = V().nodo("pa-sel-oferta");
      if (sel) {
        const html = N().lista(e.ofertas).map(x =>
          '<option value="' + x.id + '"' + (x.id === e.activa ? " selected" : "") + ">" + N().esc(x.nombre) +
          (x.estado && x.estado !== "borrador" ? " · " + M().ESTADOS_OFERTA[x.estado].texto : "") + "</option>").join("");
        if (sel.__paHtml !== html) { sel.innerHTML = html; sel.__paHtml = html; }
      }

      document.body.classList.toggle("pa-sin-importes", !e.mostrarImportes);
      const btn = V().nodo("btn-importes");
      if (btn) btn.textContent = e.mostrarImportes ? "👁 €" : "👁 h";

      const inp = V().nodo("inp-ofe-nombre");
      if (inp && o && inp.value !== o.nombre) inp.value = o.nombre || "";
      const badge = V().nodo("pa-estado-badge");
      if (badge) badge.innerHTML = o ? V().badgeOferta(o) : "";
      V().texto("pa-meta-oferta", o
        ? ((o.cliente && o.cliente.nombre ? o.cliente.nombre + " · " : "") + P().duracionLegible(o.periodos) + (o.fecha ? " · " + N().fechaCorta(o.fecha) : ""))
        : "");
      this.kpis();
    },

    kpis: function () {
      const o = app.pr(), pf = app.pf();
      if (!o) return;
      const conImp = app.verImportes();
      const t = o.impuestos || {};
      V().texto("kpi-total", conImp ? V().imp(C().totalOferta(o, pf)) : "—");
      V().texto("kpi-total-detalle", conImp
        ? (C().nombreImpuesto(o) ? C().nombreImpuesto(o) + " " + N().fmtNum(t.tasa) + " %" + (t.incluido ? " incluido" : "") : "sin impuestos")
        : "modo solo tiempos");
      V().texto("kpi-horas", V().hor(C().ofertaHoras(o)));
      const perfilesUsados = Object.keys(C().horasPorPerfil(o)).length;
      V().texto("kpi-perfiles", perfilesUsados + " perfil(es) · " + N().lista(o.tareas).length + " tareas");
      V().texto("kpi-calendario", P().meses(o.periodos) + " meses");
      V().texto("kpi-rango", P().rangoLegible(o.periodos));
      const conteo = E().porContexto(o);
      V().texto("kpi-entregables", String(conteo.total));
      const prox = E().proximo(o);
      V().texto("kpi-cliente", prox
        ? ("primer entrega: " + P().mesCorto(o.periodos, prox.periodo) + (prox._tareaNombre ? " · " + prox._tareaNombre : ""))
        : "sin entregables");
    },

    trabajo: function () { pintarVista("trabajo"); },
    oferta: function () { pintarVista("oferta"); },
    perfiles: function () { pintarVista("perfiles"); },
    carga: function () { pintarVista("carga"); },
    resumen: function () { pintarVista("resumen"); },
    informe: function () { pintarVista("informe"); },
    ajustes: function () { pintarVista("ajustes"); },
    calendario: pintarCalendario,
    gantt: pintarGantt,

    /** Cambio con cifras: se repinta TODO menos el editor (el foco se conserva).
        Así el Gantt, los KPIs y las demás pestañas van en vivo mientras se teclea. */
    datos: function () {
      clearTimeout(tDatos);
      tDatos = setTimeout(function () {
        PL.repintar.cabecera();
        pintarCalendario();
        pintarGantt();
        ["oferta", "perfiles", "carga", "resumen", "informe", "ajustes"].forEach(pintarVista);
      }, 150);
    },

    /** Mientras se renombra un periodo: se repinta todo MENOS el Gantt, que contiene
        el campo que el usuario está escribiendo (así no se le quita el foco). */
    rotulo: function () {
      clearTimeout(tDatos);
      tDatos = setTimeout(function () {
        pintarCalendario();
        PL.vistas.trabajo.renderEditor();
        ["oferta", "perfiles", "carga", "resumen", "informe", "ajustes"].forEach(pintarVista);
      }, 120);
    },

    /** Repintado completo (incluido el editor). Tras añadir, borrar o mover. */
    todo: function () {
      PL.repintar.cabecera();
      todasLasVistas();
      refrescarHeredados();   /* el aviso de datos antiguos se apaga al borrarlos */
    }
  };

  /* ---------- Pestañas ---------- */

  function mostrarPestana(nombre) {
    if (VISTAS.indexOf(nombre) < 0) nombre = "trabajo";
    pestanaActual = nombre;
    Array.prototype.forEach.call(document.querySelectorAll("#pa-tabs .nz-tabs__tab"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === nombre));
    });
    /* Las secciones cuelgan de .nz-tabs__panel: se localizan por id, nunca por
       descendencia directa de <main> (ése fue el bug que dejó pestañas muertas). */
    Array.prototype.forEach.call(document.querySelectorAll('main section[id^="sec-"]'), function (s) {
      s.hidden = (s.id !== "sec-" + nombre);
    });
    pintarVista(nombre);
    if (app.ESTADO) { app.ESTADO.ui.pestana = nombre; app.guardar(); }
    void PANELES;
  }

  /* ---------- Aviso de datos heredados ---------- */

  /* Sin banner de migración: los datos anteriores se importan solos y la nota,
     discreta y sin tecnicismos, vive en Ajustes → Datos. Aquí sólo se vacía el
     hueco (que sigue existiendo para avisos de error). */
  function refrescarHeredados() { V().vaciar("pa-herederos"); }

  /** Aviso suelto (por ejemplo, si falló la lectura de los datos guardados). */
  function avisoHeredados(aviso) {
    if (!aviso) { V().vaciar("pa-herederos"); return; }
    V().escribir("pa-herederos", V().aviso("warning", "<strong>Aviso.</strong> " + N().esc(aviso)));
  }

  function errorVisible(mensaje) {
    const el = V().nodo("pa-error");
    if (!el) return;
    el.textContent = "⚠ " + mensaje;
    el.classList.add("is-visible");
  }

  /* ---------- Arranque ---------- */

  function arrancar() {
    window.addEventListener("error", ev => errorVisible(ev.message || "error desconocido"));
    window.addEventListener("unhandledrejection", ev => errorVisible((ev.reason && ev.reason.message) || "promesa rechazada"));

    let lectura = null;
    try { lectura = A().cargar(); }
    catch (e) { lectura = { estado: M().estadoInicial(), heredado: false, aviso: "No se pudieron leer los datos guardados (" + e.message + "): se empieza de cero." }; }

    /* Arranque limpio: si sólo había datos de versiones anteriores, se empieza con
       el ejemplo (los antiguos quedan a un clic, no se tocan). */
    app.ESTADO = lectura.estado || M().estadoInicial();
    if (!app.ESTADO.ofertas.length) app.ESTADO = M().estadoInicial();
    if (!app.pr()) app.ESTADO.activa = app.ESTADO.ofertas[0].id;

    PL.eventos.montar();
    mostrarPestana(app.ESTADO.ui.pestana || "trabajo");
    PL.repintar.todo();                       /* pinta todo y avisa de los datos heredados */
    if (lectura.aviso) avisoHeredados(lectura.aviso);   /* un aviso concreto (p. ej. lectura fallida) manda */
  }

  /* ---------- API para los arneses y la consola ---------- */
  raiz.Planifica = {
    estado: function () { return app.ESTADO; },
    oferta: function () { return app.pr(); },
    perfiles: function () { return app.pf(); },
    repintar: function () { PL.repintar.todo(); },
    pestana: function (n) { mostrarPestana(n); },
    total: function () { return C().totalOferta(app.pr(), app.pf()); },
    horas: function () { return C().ofertaHoras(app.pr()); },
    entregables: function () { return E().todos(app.pr()); },
    periodos: function () { return app.pr().periodos; },
    ui: function () { return app.ui; }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arrancar);
  else arrancar();
})(typeof window !== "undefined" ? window : globalThis);

</script>
