/* ====== Aurora 7 v7.2.1 incrustado (10 packs) ====== */
/* ====== Aurora 7 v7.2.1: tokens.css ====== */
/* ============================================================
   AURORA 7 — tokens.css
   Design System Ntizar · Fuente única de verdad de tokens
   Reglas: cero gradientes, cero glass, cero IA-slop.
   Azul #2563eb primario · Naranja #f97316 acento (nunca fundidos).
   Mobile-first · Sombras multicapa sutiles · Light + Dark.
   Hecho con ❤️ por David Antizar
   ============================================================ */

:root {
  /* ---- 1. COLOR · Azul (primario) ---- */
  --nz-blue-50:  #eff6ff;
  --nz-blue-100: #dbeafe;
  --nz-blue-200: #bfdbfe;
  --nz-blue-300: #93c5fd;
  --nz-blue-400: #60a5fa;
  --nz-blue-500: #3b82f6;
  --nz-blue-600: #2563eb;   /* brand principal */
  --nz-blue-700: #1d4ed8;
  --nz-blue-800: #1e40af;
  --nz-blue-900: #1e3a8a;

  /* ---- 2. COLOR · Naranja (acento, secundario) ---- */
  --nz-orange-50:  #fff7ed;
  --nz-orange-100: #ffedd5;
  --nz-orange-200: #fed7aa;
  --nz-orange-300: #fdba74;
  --nz-orange-400: #fb923c;
  --nz-orange-500: #f97316;  /* acento principal */
  --nz-orange-600: #ea580c;
  --nz-orange-700: #c2410c;

  /* ---- 3. COLOR · Semánticos ---- */
  --nz-green-50:  #f0fdf4;
  --nz-green-100: #dcfce7;
  --nz-green-500: #22c55e;
  --nz-green-600: #16a34a;
  --nz-green-700: #15803d;
  --nz-red-50:  #fef2f2;
  --nz-red-100: #fee2e2;
  --nz-red-500: #ef4444;
  --nz-red-600: #dc2626;
  --nz-red-700: #b91c1c;
  --nz-amber-50:  #fffbeb;
  --nz-amber-100: #fef3c7;
  --nz-amber-500: #f59e0b;
  --nz-amber-600: #d97706;
  --nz-amber-700: #b45309;

  /* ---- 4. COLOR · Neutros ---- */
  --nz-gray-0:   #ffffff;
  --nz-gray-50:  #f9fafb;
  --nz-gray-100: #f3f4f6;
  --nz-gray-200: #e5e7eb;
  --nz-gray-300: #d1d5db;
  --nz-gray-400: #9ca3af;
  --nz-gray-500: #6b7280;
  --nz-gray-600: #4b5563;
  --nz-gray-700: #374151;
  --nz-gray-800: #1f2937;
  --nz-gray-900: #111827;
  --nz-gray-950: #030712;

  /* ---- 5. TOKENS TEMÁTICOS (light por defecto) ---- */
  --nz-bg:          var(--nz-gray-0);
  --nz-bg-soft:     var(--nz-gray-50);
  --nz-bg-inset:    var(--nz-gray-100);
  --nz-surface:     var(--nz-gray-0);
  --nz-surface-2:   var(--nz-gray-50);
  --nz-border:      var(--nz-gray-200);
  --nz-border-soft: var(--nz-gray-100);
  --nz-border-strong: var(--nz-gray-300);
  --nz-text:        var(--nz-gray-900);
  --nz-text-soft:   var(--nz-gray-600);
  --nz-text-mute:   var(--nz-gray-500);
  --nz-text-faint:  var(--nz-gray-400);
  --nz-text-invert: var(--nz-gray-0);
  --nz-brand:       var(--nz-blue-600);
  --nz-brand-strong: var(--nz-blue-700);
  --nz-brand-soft:  var(--nz-blue-50);
  --nz-brand-tint:  var(--nz-blue-100);
  --nz-accent:      var(--nz-orange-500);
  --nz-accent-strong: var(--nz-orange-600);
  --nz-accent-soft: var(--nz-orange-50);
  --nz-accent-tint: var(--nz-orange-100);
  --nz-success:     var(--nz-green-600);
  --nz-success-soft: var(--nz-green-50);
  --nz-success-tint: var(--nz-green-100);
  --nz-danger:      var(--nz-red-600);
  --nz-danger-soft: var(--nz-red-50);
  --nz-danger-tint: var(--nz-red-100);
  --nz-warning:     var(--nz-amber-600);
  --nz-warning-soft: var(--nz-amber-50);
  --nz-warning-tint: var(--nz-amber-100);
  --nz-info:        var(--nz-blue-600);
  --nz-info-soft:   var(--nz-blue-50);
  --nz-info-tint:   var(--nz-blue-100);
  --nz-overlay:     rgba(17, 24, 39, 0.48);

  /* ---- 6. TIPOGRAFÍA ---- */
  --nz-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nz-font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  /* Escala fluida mobile-first (clamp: móvil → escritorio) */
  --nz-text-2xs: 0.6875rem;                       /* 11px */
  --nz-text-xs:  0.75rem;                         /* 12px */
  --nz-text-sm:  0.8125rem;                       /* 13px */
  --nz-text-base: 0.9375rem;                      /* 15px */
  --nz-text-md:  1rem;                            /* 16px */
  --nz-text-lg:  1.125rem;                        /* 18px */
  --nz-text-xl:  clamp(1.25rem, 1.1rem + 0.6vw, 1.5rem);
  --nz-text-2xl: clamp(1.5rem, 1.25rem + 1vw, 1.875rem);
  --nz-text-3xl: clamp(1.875rem, 1.4rem + 1.8vw, 2.5rem);
  --nz-text-4xl: clamp(2.25rem, 1.6rem + 2.8vw, 3.25rem);
  --nz-leading-tight: 1.2;
  --nz-leading-snug: 1.375;
  --nz-leading-normal: 1.6;
  --nz-tracking-tight: -0.02em;
  --nz-tracking-caps: 0.08em;

  /* ---- 7. ESPACIO (escala 4px) ---- */
  --nz-space-0: 0;
  --nz-space-1: 0.25rem;   /* 4 */
  --nz-space-2: 0.5rem;    /* 8 */
  --nz-space-3: 0.75rem;   /* 12 */
  --nz-space-4: 1rem;      /* 16 */
  --nz-space-5: 1.25rem;   /* 20 */
  --nz-space-6: 1.5rem;    /* 24 */
  --nz-space-7: 1.75rem;   /* 28 */
  --nz-space-8: 2rem;      /* 32 */
  --nz-space-9: 2.25rem;   /* 36 */
  --nz-space-10: 2.5rem;   /* 40 */
  --nz-space-12: 3rem;     /* 48 */
  --nz-space-16: 4rem;     /* 64 */
  --nz-space-20: 5rem;     /* 80 */
  --nz-gutter: var(--nz-space-4);                    /* gutter móvil */
  --nz-container-max: 72rem;                         /* 1152px */
  --nz-container-narrow: 44rem;                      /* 704px, prose */

  /* ---- 8. RADIOS Y BORDES ---- */
  --nz-radius-xs: 4px;
  --nz-radius-sm: 6px;
  --nz-radius-md: 10px;
  --nz-radius-lg: 14px;
  --nz-radius-xl: 20px;
  --nz-radius-full: 999px;
  --nz-border-w: 1px;
  --nz-border-w-strong: 1.5px;

  /* ---- 9. SOMBRAS (multicapa sutiles, sin bordes duros) ---- */
  --nz-shadow-xs: 0 1px 2px rgba(17, 24, 39, 0.05);
  --nz-shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.05), 0 2px 6px rgba(17, 24, 39, 0.04);
  --nz-shadow-md: 0 2px 4px rgba(17, 24, 39, 0.04), 0 6px 16px rgba(17, 24, 39, 0.07);
  --nz-shadow-lg: 0 4px 8px rgba(17, 24, 39, 0.04), 0 14px 32px rgba(17, 24, 39, 0.10);
  --nz-shadow-xl: 0 8px 16px rgba(17, 24, 39, 0.06), 0 24px 56px rgba(17, 24, 39, 0.14);
  --nz-shadow-brand: 0 2px 4px rgba(37, 99, 235, 0.10), 0 8px 20px rgba(37, 99, 235, 0.14);
  --nz-shadow-accent: 0 2px 4px rgba(249, 115, 22, 0.10), 0 8px 20px rgba(249, 115, 22, 0.14);

  /* ---- 10. Z-INDEX ---- */
  --nz-z-base: 0;
  --nz-z-raised: 10;
  --nz-z-sticky: 100;
  --nz-z-header: 200;
  --nz-z-drawer: 300;
  --nz-z-modal: 400;
  --nz-z-popover: 500;
  --nz-z-toast: 600;
  --nz-z-tooltip: 700;

  /* ---- 11. MOVIMIENTO (ui-animation-taste) ---- */
  --nz-dur-fast: 120ms;
  --nz-dur-base: 180ms;
  --nz-dur-slow: 260ms;
  --nz-ease-out: cubic-bezier(0.16, 1, 0.3, 1);   /* expo-out: entradas */
  --nz-ease-in:  cubic-bezier(0.7, 0, 0.84, 0);   /* salidas, más cortas */
  --nz-ease-soft: cubic-bezier(0.33, 1, 0.68, 1);

  /* ---- 12. FOCUS ---- */
  --nz-focus-ring: 0 0 0 3px var(--nz-blue-200);
  --nz-focus-ring-accent: 0 0 0 3px var(--nz-orange-200);
}

/* ---- TEMA OSCURO (opt-in vía data-nz-theme="dark") ---- */
[data-nz-theme="dark"] {
  --nz-bg:          #0b1220;
  --nz-bg-soft:     #0f172a;
  --nz-bg-inset:    #1e293b;
  --nz-surface:     #101a2e;
  --nz-surface-2:   #16223a;
  --nz-border:      #24334d;
  --nz-border-soft: #1c2940;
  --nz-border-strong: #33456a;
  --nz-text:        #f1f5f9;
  --nz-text-soft:   #a9b8cd;
  --nz-text-mute:   #7d8fa9;
  --nz-text-faint:  #5b6b85;
  --nz-text-invert: #0b1220;
  --nz-brand:       #4f8ef7;
  --nz-brand-strong: #6ba3ff;
  --nz-brand-soft:  rgba(79, 142, 247, 0.12);
  --nz-brand-tint:  rgba(79, 142, 247, 0.22);
  --nz-accent:      #fb923c;
  --nz-accent-strong: #fdba74;
  --nz-accent-soft: rgba(251, 146, 60, 0.12);
  --nz-accent-tint: rgba(251, 146, 60, 0.22);
  --nz-success:     #4ade80;
  --nz-success-soft: rgba(34, 197, 94, 0.14);
  --nz-success-tint: rgba(34, 197, 94, 0.24);
  --nz-danger:      #f87171;
  --nz-danger-soft: rgba(239, 68, 68, 0.14);
  --nz-danger-tint: rgba(239, 68, 68, 0.24);
  --nz-warning:     #fbbf24;
  --nz-warning-soft: rgba(245, 158, 11, 0.14);
  --nz-warning-tint: rgba(245, 158, 11, 0.24);
  --nz-info:        #4f8ef7;
  --nz-info-soft:   rgba(79, 142, 247, 0.12);
  --nz-info-tint:   rgba(79, 142, 247, 0.22);
  --nz-overlay:     rgba(3, 7, 18, 0.62);
  --nz-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.35);
  --nz-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.30);
  --nz-shadow-md: 0 2px 4px rgba(0, 0, 0, 0.30), 0 6px 16px rgba(0, 0, 0, 0.38);
  --nz-shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.30), 0 14px 32px rgba(0, 0, 0, 0.45);
  --nz-shadow-xl: 0 8px 16px rgba(0, 0, 0, 0.35), 0 24px 56px rgba(0, 0, 0, 0.55);
  --nz-shadow-brand: 0 2px 4px rgba(0, 0, 0, 0.30), 0 8px 20px rgba(79, 142, 247, 0.20);
  --nz-shadow-accent: 0 2px 4px rgba(0, 0, 0, 0.30), 0 8px 20px rgba(251, 146, 60, 0.20);
  --nz-focus-ring: 0 0 0 3px rgba(79, 142, 247, 0.45);
  --nz-focus-ring-accent: 0 0 0 3px rgba(251, 146, 60, 0.45);
}

/* ---- Base compartida ---- */
.nz, [data-nz-theme] {
  font-family: var(--nz-font);
  color: var(--nz-text);
  background: var(--nz-bg);
  line-height: var(--nz-leading-normal);
  font-size: var(--nz-text-md);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.nz *, [data-nz-theme] * { box-sizing: border-box; }

.nz :focus-visible, [data-nz-theme] :focus-visible {
  outline: none;
  box-shadow: var(--nz-focus-ring);
  border-radius: var(--nz-radius-sm);
}

/* Movimiento reducido: congelar, no ralentizar */
@media (prefers-reduced-motion: reduce) {
  .nz *, [data-nz-theme] * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---- Breakpoints oficiales (mobile-first, usar min-width):
   base  ≤ 639px   1 columna
   sm    ≥ 640px   2 columnas
   md    ≥ 960px   3 columnas / sidebar
   lg    ≥ 1200px  layout completo
---- */

/* ====== Aurora 7 v7.2.1: packs/p1-layout.css ====== */
/* ============================================================
   AURORA 7 — p1-layout.css · Categoría 1 · Layout y estructura (167 objetos)
   Contenedores, rejillas, spans, pilas, landmarks, sticky, bleed,
   regiones de página y helpers de flujo. Demostrado en specs/01.json (48 demos).
   Mobile-first (base 1 columna → 640 → 960 → 1200). Todo con tokens.
   Cero gradientes, cero glass. Táctil 44px. Hecho con ❤️ por David Antizar
   ============================================================ */

/* ---- 01 Viewport / contenedor raíz ---- */
.nz-root { min-height: 100dvh; display: flex; flex-direction: column; }

/* ---- 02 Contenedor de página ---- */
.nz-container { width: 100%; max-width: var(--nz-container-max); margin-inline: auto; padding-inline: var(--nz-gutter); }
.nz-container--fluid { max-width: none; }
.nz-container--fixed { max-width: 60rem; }
.nz-container--wide { max-width: 84rem; }
.nz-container--narrow { max-width: var(--nz-container-narrow); }

/* ---- Nada se sale de la pantalla ----
   Un hijo de rejilla o de caja flexible nace con min-width:auto, así que una
   tabla o una línea larga estira su columna y desborda la página entera: es la
   causa número uno de que un móvil se vea «cortado». Con min-width:0 el hijo
   encoge y quien se desplaza es su propio contenedor (.nz-table-wrap). */
.nz-container > *, .nz-dash-grid > *, .nz-split > *, .nz-thirds > *, .nz-bento > *,
.nz-grid-12 > *, .nz-holy > *, .nz-splitpane > *,
.nz-article, .nz-collapsible { min-width: 0; }

/* ---- 03 Grid de 12 columnas ---- */
.nz-grid-12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--nz-space-4); }

/* ---- 04 Grid CSS auto-fit ---- */
.nz-grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--nz-space-4); }

/* ---- 05 Spans de rejilla (1..12) — escalan con el número de columnas ---- */
.nz-span-1 { grid-column: span 1; } .nz-span-2 { grid-column: span 2; } .nz-span-3 { grid-column: span 3; } .nz-span-4 { grid-column: span 4; }
.nz-span-5, .nz-span-6, .nz-span-7, .nz-span-8, .nz-span-9, .nz-span-10, .nz-span-11, .nz-span-12 { grid-column: span 4; }
@media (min-width: 640px) {
  .nz-span-5 { grid-column: span 5; } .nz-span-6 { grid-column: span 6; } .nz-span-7 { grid-column: span 7; } .nz-span-8 { grid-column: span 8; }
  .nz-span-9, .nz-span-10, .nz-span-11, .nz-span-12 { grid-column: span 8; }
}
@media (min-width: 960px) {
  .nz-span-5 { grid-column: span 5; } .nz-span-6 { grid-column: span 6; } .nz-span-7 { grid-column: span 7; } .nz-span-8 { grid-column: span 8; }
  .nz-span-9 { grid-column: span 9; } .nz-span-10 { grid-column: span 10; } .nz-span-11 { grid-column: span 11; } .nz-span-12 { grid-column: span 12; }
}

/* ---- 06 Sistema de filas (con columnas por breakpoint) ---- */
.nz-row { display: flex; flex-wrap: wrap; gap: var(--nz-space-4); }
.nz-row > * { flex: 1 1 100%; min-width: 0; }
.nz-row--compact { gap: var(--nz-space-2); }
.nz-row--spacious { gap: var(--nz-space-6); }
.nz-row--2 > * { flex: 1 1 100%; }
.nz-row--3 > * { flex: 1 1 100%; }
.nz-row--4 > * { flex: 1 1 100%; }
@media (min-width: 640px) {
  .nz-row > * { flex: 1 1 calc(50% - var(--nz-space-4)); }
  .nz-row--2 > * { flex: 1 1 calc(50% - var(--nz-space-2)); }
  .nz-row--3 > * { flex: 1 1 calc(50% - var(--nz-space-4)); }
  .nz-row--4 > * { flex: 1 1 calc(50% - var(--nz-space-4)); }
}
@media (min-width: 960px) {
  .nz-row--3 > * { flex: 1 1 calc(33.333% - var(--nz-space-4)); }
  .nz-row--4 > * { flex: 1 1 calc(25% - var(--nz-space-3)); }
}

/* ---- 07 Sistema de columnas ---- */
.nz-col { display: flex; flex-direction: column; gap: var(--nz-space-4); min-width: 0; }

/* ---- 08 Stack vertical ---- */
.nz-stack { display: flex; flex-direction: column; gap: var(--nz-space-4); }
.nz-stack--2xs { gap: var(--nz-space-0); } .nz-stack--xs { gap: var(--nz-space-1); }
.nz-stack--sm { gap: var(--nz-space-2); }
.nz-stack--lg { gap: var(--nz-space-6); } .nz-stack--xl { gap: var(--nz-space-8); }

/* ---- 09 Stack horizontal (reparto y alineación) ---- */
.nz-hstack { display: flex; align-items: center; gap: var(--nz-space-3); flex-wrap: wrap; }
.nz-hstack--compact { gap: var(--nz-space-2); }
.nz-hstack--spacious { gap: var(--nz-space-6); }
.nz-hstack--center { justify-content: center; }
.nz-hstack--between { justify-content: space-between; }
.nz-hstack--end { justify-content: flex-end; }
.nz-hstack--nowrap { flex-wrap: nowrap; }
.nz-hstack--top { align-items: flex-start; }
.nz-hstack--bottom { align-items: flex-end; }

/* ---- 10 Cluster / grupo de ítems ---- */
.nz-cluster { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: var(--nz-space-2) var(--nz-space-3); }
.nz-cluster--compact { gap: var(--nz-space-1) var(--nz-space-2); }
.nz-cluster--spacious { gap: var(--nz-space-4) var(--nz-space-6); }
.nz-cluster--center { justify-content: center; }
.nz-cluster--between { justify-content: space-between; }
.nz-cluster--end { justify-content: flex-end; }
.nz-cluster--nowrap { flex-wrap: nowrap; overflow-x: auto; }

/* ---- 11 Split layout (repartos) ---- */
.nz-split { display: grid; gap: var(--nz-space-6); grid-template-columns: 1fr; }
.nz-split--2-1 { grid-template-columns: 1fr; }
.nz-split--3-2 { grid-template-columns: 1fr; }
.nz-split--40-60 { grid-template-columns: 1fr; }
.nz-split--60-40 { grid-template-columns: 1fr; }
@media (min-width: 640px) { .nz-split--40-60 { grid-template-columns: 4fr 6fr; } .nz-split--60-40 { grid-template-columns: 6fr 4fr; } }
@media (min-width: 960px) {
  .nz-split { grid-template-columns: 1fr 1fr; align-items: start; }
  .nz-split--2-1 { grid-template-columns: 2fr 1fr; }
  .nz-split--3-2 { grid-template-columns: 3fr 2fr; }
  .nz-split--40-60 { grid-template-columns: 4fr 6fr; }
  .nz-split--60-40 { grid-template-columns: 6fr 4fr; }
}

/* ---- 12 Sidebar + contenido ---- */
.nz-with-sidebar { display: grid; gap: var(--nz-space-6); grid-template-columns: 1fr; }
.nz-with-sidebar > * { min-width: 0; }
.nz-with-sidebar--right { grid-template-columns: 1fr; }
.nz-with-sidebar--wide { grid-template-columns: 1fr; }
@media (min-width: 960px) {
  .nz-with-sidebar { grid-template-columns: 15rem minmax(0, 1fr); }
  .nz-with-sidebar--right { grid-template-columns: minmax(0, 1fr) 15rem; }
  .nz-with-sidebar--wide { grid-template-columns: 20rem minmax(0, 1fr); }
  .nz-with-sidebar--right > :last-child { grid-column: 1; grid-row: 1; }
  .nz-with-sidebar--right > :first-child { grid-column: 2; grid-row: 1; }
}

/* ---- 13 Layout de tres columnas ---- */
.nz-thirds { display: grid; gap: var(--nz-space-4); grid-template-columns: 1fr; }
.nz-thirds--compact { gap: var(--nz-space-2); }
.nz-thirds--spacious { gap: var(--nz-space-6); }
@media (min-width: 640px) { .nz-thirds { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .nz-thirds { grid-template-columns: repeat(3, 1fr); } }

/* ---- 14 Header / cabecera ---- */
.nz-header { display: flex; align-items: center; justify-content: space-between; gap: var(--nz-space-3); padding: var(--nz-space-3) var(--nz-gutter); background: var(--nz-surface); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-header--compact { padding-block: var(--nz-space-1); min-height: 44px; }
.nz-header--tall { padding-block: var(--nz-space-6); }
.nz-header--bordered { border-bottom: var(--nz-border-w-strong) solid var(--nz-border-strong); }

/* ---- 15 Main / contenido principal ---- */
.nz-main { flex: 1 0 auto; padding-block: var(--nz-space-6); }
.nz-main--flush { padding-block: 0; }
.nz-main--narrow { max-width: var(--nz-container-narrow); margin-inline: auto; }
.nz-main--wide { max-width: var(--nz-container-max); margin-inline: auto; }

/* ---- 16 Footer ---- */
.nz-footer { padding: var(--nz-space-8) var(--nz-gutter); background: var(--nz-bg-soft); border-top: var(--nz-border-w) solid var(--nz-border-soft); color: var(--nz-text-soft); font-size: var(--nz-text-sm); }
.nz-footer--compact { padding-block: var(--nz-space-3); }
.nz-footer--brand { background: var(--nz-brand-soft); color: var(--nz-text); border-top-color: var(--nz-brand-tint); }

/* ---- 17 Landmarks ---- */
.nz-nav-landmark { display: block; }
.nz-aside { display: block; }
.nz-section { padding-block: var(--nz-space-10); }
.nz-section--compact { padding-block: var(--nz-space-4); }
.nz-section--spacious { padding-block: var(--nz-space-16); }

.nz-tabs__tab--disabled, .nz-tabs__tab[aria-disabled="true"] { color: var(--nz-text-faint); cursor: not-allowed; }
.nz-tabs__badge { margin-left: var(--nz-space-2); min-width: 1.5rem; height: 1.25rem; display: inline-flex; align-items: center; justify-content: center; padding: 0 var(--nz-space-1); border-radius: var(--nz-radius-full); background: var(--nz-brand); color: var(--nz-text-invert); font-size: var(--nz-text-2xs); font-variant-numeric: tabular-nums; }
.nz-tabs__panel { min-width: 0; padding-block: var(--nz-space-4); color: var(--nz-text-soft); font-size: var(--nz-text-sm); }
.nz-tabs--center { justify-content: center; }
.nz-tabs--full .nz-tabs__tab { flex: 1 1 0; justify-content: center; }
.nz-tabs--underline .nz-tabs__tab[aria-selected="true"], .nz-tabs--underline .nz-tabs__tab.is-active { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: var(--nz-space-2); }
.nz-tabs--underline .nz-tabs__tab[aria-selected="true"]::after, .nz-tabs--underline .nz-tabs__tab.is-active::after { display: none; }
.nz-tabs--vertical { flex-direction: column; flex-wrap: nowrap; align-items: stretch; border-bottom: 0; border-inline-start: var(--nz-border-w) solid var(--nz-border-soft); overflow-x: visible; }
.nz-tabs--vertical .nz-tabs__tab { justify-content: flex-start; }
.nz-tabs--vertical .nz-tabs__tab[aria-selected="true"]::after, .nz-tabs--vertical .nz-tabs__tab.is-active::after { left: -1px; right: auto; top: var(--nz-space-2); bottom: var(--nz-space-2); width: 3px; height: auto; }

/* ---- 06 Pill tabs ---- */
.nz-tabs--pill { gap: var(--nz-space-2); border: 0; }

.nz-tabs--pill .nz-tabs__tab[aria-selected="true"], .nz-tabs--pill .nz-tabs__tab.is-active { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-tabs--pill .nz-tabs__tab[aria-selected="true"]::after, .nz-tabs--pill .nz-tabs__tab.is-active::after { display: none; }
.nz-tabs--pill .nz-tabs__badge { background: var(--nz-text-invert); color: var(--nz-brand); }

/* ---- 06b Barra en una sola línea, con desplazamiento a propósito ----
   Para cuando las pestañas deben ocupar el ancho exacto de la pantalla y
   prefieres deslizar antes que envolver. La barra fina deja ver que hay más. */
.nz-tabs--scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
.nz-tabs--scroll::-webkit-scrollbar { height: 4px; display: block; }
.nz-tabs--scroll::-webkit-scrollbar-thumb { background: var(--nz-border-strong); border-radius: var(--nz-radius-full); }

/* ---- 07 Breadcrumbs ---- */
.nz-breadcrumb { display: flex; align-items: center; gap: var(--nz-space-1); flex-wrap: wrap; padding: var(--nz-space-2) 0; font-size: var(--nz-text-sm); }

.nz-breadcrumb a:hover { color: var(--nz-brand); }

.nz-breadcrumb--slash .nz-breadcrumb__sep::before { content: "/"; }

/* ---- 08 Paginación ---- */
.nz-pagination { display: flex; align-items: center; gap: var(--nz-space-1); flex-wrap: wrap; }
.nz-pagination a, .nz-pagination button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 var(--nz-space-3); border-radius: var(--nz-radius-sm); border: 0; background: transparent; color: var(--nz-text-soft); font-weight: 600; font-size: var(--nz-text-sm); text-decoration: none; font-family: inherit; cursor: pointer; }
.nz-pagination a:hover, .nz-pagination button:hover { background: var(--nz-bg-inset); color: var(--nz-text); }
.nz-pagination [aria-current="page"], .nz-pagination [aria-current="true"] { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-pagination__ellipsis { padding: 0 var(--nz-space-1); color: var(--nz-text-faint); }
.nz-pagination__status { padding-inline: var(--nz-space-2); color: var(--nz-text-mute); font-size: var(--nz-text-sm); font-variant-numeric: tabular-nums; }
.nz-pagination--simple { gap: var(--nz-space-2); }
.nz-pagination--sm { gap: 0; }
.nz-pagination--sm a, .nz-pagination--sm button { padding: 0 var(--nz-space-2); font-size: var(--nz-text-xs); }

@media (min-width: 640px) {
  .nz-pagination--sm a, .nz-pagination--sm button { min-width: 36px; min-height: 36px; }
  .nz-pagination--lg a, .nz-pagination--lg button { min-width: 52px; min-height: 52px; }
}

/* ---- 09 Índice de contenidos (TOC) ---- */
.nz-toc { display: flex; flex-direction: column; gap: var(--nz-space-1); padding: var(--nz-space-4); background: var(--nz-surface); border-radius: var(--nz-radius-lg); box-shadow: var(--nz-shadow-sm); }
.nz-toc__title { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-faint); margin-bottom: var(--nz-space-2); }
.nz-toc__title--brand { color: var(--nz-brand); }
.nz-toc a { display: flex; min-height: 44px; align-items: center; color: var(--nz-text-soft); text-decoration: none; padding: var(--nz-space-2) var(--nz-space-2); border-left: 3px solid transparent; border-radius: var(--nz-radius-sm); font-size: var(--nz-text-sm); }
.nz-toc a:hover { background: var(--nz-bg-soft); color: var(--nz-text); }
.nz-toc a[aria-current="location"] { border-left-color: var(--nz-brand); color: var(--nz-brand); font-weight: 600; }
.nz-toc a.nz-toc--level2 { padding-left: var(--nz-space-5); font-size: var(--nz-text-xs); }
.nz-toc--compact { gap: 0; padding: var(--nz-space-2); }
.nz-toc--compact a { min-height: 44px; padding-block: var(--nz-space-1); font-size: var(--nz-text-xs); }
@media (min-width: 640px) { .nz-toc--compact a { min-height: 36px; } }
.nz-toc--sticky { position: sticky; top: var(--nz-space-6); }

/* ---- 10 Dropdown select ---- */
.nz-dropdown { position: relative; }
.nz-dropdown > input { position: absolute; opacity: 0; pointer-events: none; }
.nz-dropdown__btn { min-height: 44px; display: inline-flex; align-items: center; gap: var(--nz-space-2); padding: 0 var(--nz-space-4); border-radius: var(--nz-radius-full); border: var(--nz-border-w) solid var(--nz-border); background: var(--nz-surface); color: var(--nz-text); font-weight: 600; font-family: inherit; cursor: pointer; font-size: var(--nz-text-sm); }
.nz-dropdown__btn::after { content: "▾"; font-size: var(--nz-text-xs); color: var(--nz-text-faint); }
.nz-dropdown__btn--icon { padding: 0; min-width: 44px; justify-content: center; gap: 0; }
.nz-dropdown__list { position: absolute; top: calc(100% + var(--nz-space-2)); left: 0; min-width: 12rem; padding: var(--nz-space-2); border-radius: var(--nz-radius-lg); background: var(--nz-surface); box-shadow: var(--nz-shadow-lg); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: transform var(--nz-dur-base) var(--nz-ease-out), opacity var(--nz-dur-base) var(--nz-ease-out), visibility var(--nz-dur-base); }
.nz-dropdown > input:checked ~ .nz-dropdown__list { opacity: 1; visibility: visible; transform: none; }
.nz-dropdown__list--divided > * + * { border-top: var(--nz-border-w) solid var(--nz-border-soft); border-radius: 0; }
.nz-dropdown--end .nz-dropdown__list { left: auto; right: 0; }
.nz-dropdown--wide .nz-dropdown__list { min-width: 18rem; }

/* ---- 11 Nav footer ---- */
.nz-navfooter { display: flex; flex-wrap: wrap; gap: var(--nz-space-2) var(--nz-space-6); padding: var(--nz-space-6) 0; }
.nz-navfooter__col { min-width: 7rem; display: flex; flex-direction: column; gap: var(--nz-space-2); }
.nz-navfooter__title { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-faint); }
.nz-navfooter__title--brand { color: var(--nz-brand); }
.nz-navfooter a { min-height: 44px; display: inline-flex; align-items: center; color: var(--nz-text-soft); text-decoration: none; font-size: var(--nz-text-sm); }
.nz-navfooter a:hover { color: var(--nz-brand); }
.nz-navfooter__bottom { flex-basis: 100%; grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--nz-space-2) var(--nz-space-4); padding-top: var(--nz-space-4); border-top: var(--nz-border-w) solid var(--nz-border-soft); color: var(--nz-text-mute); font-size: var(--nz-text-xs); }
.nz-navfooter--compact { padding: var(--nz-space-4) 0; gap: var(--nz-space-1) var(--nz-space-4); }
.nz-navfooter--2col, .nz-navfooter--3col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--nz-space-3); }
@media (min-width: 640px) {
  .nz-navfooter--2col, .nz-navfooter--3col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 960px) { .nz-navfooter--3col { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---- 12 Stepper de navegación (proceso) ---- */
.nz-stepper { display: flex; align-items: center; gap: var(--nz-space-2); overflow-x: auto; scrollbar-width: none; }
.nz-stepper::-webkit-scrollbar { display: none; }
.nz-stepper__step { display: flex; align-items: center; gap: var(--nz-space-2); white-space: nowrap; color: var(--nz-text-faint); font-size: var(--nz-text-sm); font-weight: 600; }
.nz-stepper__num { min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); color: var(--nz-text-mute); font-size: var(--nz-text-xs); font-variant-numeric: tabular-nums; }
.nz-stepper__step.is-active { color: var(--nz-text); }
.nz-stepper__step.is-active .nz-stepper__num { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-stepper__step.is-done .nz-stepper__num { background: var(--nz-success); color: var(--nz-text-invert); }
.nz-stepper__step--error { color: var(--nz-danger); }
.nz-stepper__step--error .nz-stepper__num { background: var(--nz-danger); color: var(--nz-text-invert); }
.nz-stepper__link { color: var(--nz-text-faint); }
.nz-stepper--compact { gap: var(--nz-space-1); }
.nz-stepper--compact .nz-stepper__step { font-size: var(--nz-text-xs); min-height: 44px; }
.nz-stepper--compact .nz-stepper__num { min-width: 22px; height: 22px; }
.nz-stepper--vertical { flex-direction: column; align-items: flex-start; gap: var(--nz-space-3); overflow-x: visible; }

/* ====== Aurora 7 v7.2.1: packs/p3-typography.css ====== */
/* ============================================================
   AURORA 7 — p3-typography.css · Categoría 3 · Tipografía (130 objetos)
   Escala, tonos de titular, cuerpo, prose (dueño único), listas,
   bloque, código, etiquetas, cifras, enlaces y utilidades de texto.
   Demostrado en specs/03.json (42 demos). Prose: dueño único del sistema.
   Jerarquía por tamaño/peso/espacio, no por color. Solo tokens.
   Cero gradientes, cero glass. Hecho con ❤️ por David Antizar
   ============================================================ */

/* ---- 01 Escala (fluida, mobile-first — tokens ya definidos) ---- */
.nz-display { font-size: var(--nz-text-4xl); font-weight: 800; line-height: var(--nz-leading-tight); letter-spacing: var(--nz-tracking-tight); }
.nz-h1 { font-size: var(--nz-text-3xl); font-weight: 800; line-height: var(--nz-leading-tight); letter-spacing: var(--nz-tracking-tight); }
.nz-h2 { font-size: var(--nz-text-2xl); font-weight: 700; line-height: var(--nz-leading-tight); letter-spacing: var(--nz-tracking-tight); }
.nz-h3 { font-size: var(--nz-text-xl); font-weight: 700; line-height: var(--nz-leading-snug); letter-spacing: var(--nz-tracking-tight); }
.nz-h4 { font-size: var(--nz-text-lg); font-weight: 700; line-height: var(--nz-leading-snug); }
.nz-h5 { font-size: var(--nz-text-base); font-weight: 700; line-height: var(--nz-leading-snug); }
.nz-h6 { font-size: var(--nz-text-sm); font-weight: 700; line-height: var(--nz-leading-snug); letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; }
.nz-eyebrow { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-brand); }

/* ---- 02 Display grande y pequeño ---- */
.nz-display--xl { font-size: calc(var(--nz-text-4xl) * 1.15); letter-spacing: var(--nz-tracking-tight); }
.nz-display--sm { font-size: var(--nz-text-2xl); font-weight: 800; line-height: var(--nz-leading-tight); }

/* ---- 03 Tono de titular (azul / naranja / apagado / apretado) ---- */
.nz-h1--brand, .nz-h2--brand, .nz-h3--brand, .nz-h4--brand, .nz-h5--brand, .nz-h6--brand { color: var(--nz-brand); }
.nz-h1--accent, .nz-h2--accent, .nz-h3--accent, .nz-h4--accent, .nz-h5--accent, .nz-h6--accent { color: var(--nz-accent-strong); }
.nz-h1--muted, .nz-h2--muted, .nz-h3--muted, .nz-h4--muted, .nz-h5--muted, .nz-h6--muted { color: var(--nz-text-mute); }
.nz-h1--tight, .nz-h2--tight, .nz-h3--tight, .nz-h4--tight, .nz-h5--tight, .nz-h6--tight { letter-spacing: var(--nz-tracking-tight); }

/* ---- 04 Cuerpo ---- */
.nz-lead { font-size: var(--nz-text-lg); color: var(--nz-text-soft); line-height: var(--nz-leading-snug); }
.nz-lead--sm { font-size: var(--nz-text-md); }
.nz-lead--lg { font-size: var(--nz-text-xl); line-height: var(--nz-leading-normal); }
.nz-lead--brand { color: var(--nz-text-soft); border-inline-start: 3px solid var(--nz-brand); padding-inline-start: var(--nz-space-4); }
.nz-text--large { font-size: var(--nz-text-lg); }
.nz-text--small { font-size: var(--nz-text-sm); }
.nz-text--muted { color: var(--nz-text-mute); }
.nz-text--faint { color: var(--nz-text-faint); }
.nz-text--mono { font-family: var(--nz-font-mono); font-size: .9em; }
.nz-text--success { color: var(--nz-success); }
.nz-text--danger { color: var(--nz-danger); }
.nz-text--warning { color: var(--nz-warning); }
.nz-text--brand-soft { color: var(--nz-brand-strong); background: var(--nz-brand-soft); padding: 0 .3em; border-radius: var(--nz-radius-xs); }

/* ---- 05 Prose (dueño único de este objeto) ---- */
.nz-prose { max-width: var(--nz-container-narrow); margin-inline: auto; }
.nz-prose p { font-size: var(--nz-text-md); color: var(--nz-text-soft); line-height: var(--nz-leading-normal); margin-block: var(--nz-space-4); }
.nz-prose h2 { font-size: var(--nz-text-xl); letter-spacing: var(--nz-tracking-tight); margin-block: var(--nz-space-8) var(--nz-space-3); }
.nz-prose h3 { font-size: var(--nz-text-lg); letter-spacing: var(--nz-tracking-tight); margin-block: var(--nz-space-6) var(--nz-space-2); }
.nz-prose h4 { font-size: var(--nz-text-base); margin-block: var(--nz-space-5) var(--nz-space-2); }
.nz-prose ul, .nz-prose ol { margin-block: var(--nz-space-3); padding-inline-start: var(--nz-space-6); }
.nz-prose li { margin-block: var(--nz-space-1); color: var(--nz-text-soft); }
.nz-prose a { color: var(--nz-brand); }
.nz-prose strong { color: var(--nz-text); }
.nz-prose code { font-family: var(--nz-font-mono); font-size: .9em; padding: .1em .35em; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); color: var(--nz-brand-strong); }
.nz-prose table { width: 100%; border-collapse: collapse; margin-block: var(--nz-space-4); font-size: var(--nz-text-sm); }
.nz-prose th, .nz-prose td { text-align: start; padding: var(--nz-space-2) var(--nz-space-3); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-prose th { color: var(--nz-text); font-weight: 700; }
.nz-prose img { max-width: 100%; height: auto; border-radius: var(--nz-radius-md); }
.nz-prose--wide { max-width: var(--nz-container-max); }
.nz-prose--brand a { color: var(--nz-brand-strong); }
.nz-prose--brand strong { color: var(--nz-brand); }
.nz-prose--brand h2, .nz-prose--brand h3 { color: var(--nz-brand); }

/* ---- 06 Listas ---- */
.nz-list { list-style: none; padding: 0; margin-block: var(--nz-space-2); display: flex; flex-direction: column; gap: var(--nz-space-2); }
.nz-list__item { display: flex; gap: var(--nz-space-3); align-items: flex-start; color: var(--nz-text-soft); }
.nz-list__item::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: .5em; border-radius: var(--nz-radius-full); background: var(--nz-brand); }
.nz-list--accent .nz-list__item::before { background: var(--nz-accent); }
.nz-list--check .nz-list__item::before { content: "✓"; width: auto; height: auto; background: none; color: var(--nz-success); font-weight: 800; font-size: var(--nz-text-sm); }
.nz-list--numeric { counter-reset: nzcount; }
.nz-list--numeric .nz-list__item { counter-increment: nzcount; display: grid; grid-template-columns: 1.75rem 1fr; gap: var(--nz-space-2); }
.nz-list--numeric .nz-list__item::before { content: counter(nzcount); width: auto; height: auto; background: none; color: var(--nz-brand); font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 0; }
.nz-list--brand .nz-list__item { padding: var(--nz-space-2) var(--nz-space-3); border-radius: var(--nz-radius-sm); background: var(--nz-brand-soft); color: var(--nz-text); }
.nz-list--compact { gap: var(--nz-space-1); }
.nz-list--compact .nz-list__item { font-size: var(--nz-text-sm); }
.nz-list--divided .nz-list__item + .nz-list__item { border-top: var(--nz-border-w) solid var(--nz-border-soft); padding-top: var(--nz-space-2); }
.nz-list--icon .nz-list__item { align-items: center; }
.nz-list--icon .nz-list__item::before { content: ""; width: 22px; height: 22px; margin-top: 0; border-radius: var(--nz-radius-xs); background: var(--nz-brand-soft); }
.nz-list__item--done { color: var(--nz-text-mute); text-decoration: line-through; }
.nz-list__item--done::before { background: var(--nz-success); }

/* ---- 07 Blockquote ---- */
.nz-blockquote { margin: var(--nz-space-4) 0; padding: var(--nz-space-4) var(--nz-space-5); border-left: 3px solid var(--nz-brand); background: var(--nz-bg-soft); border-radius: 0 var(--nz-radius-md) var(--nz-radius-md) 0; }
.nz-blockquote p { font-size: var(--nz-text-base); color: var(--nz-text); font-style: italic; margin: 0; }
.nz-blockquote footer { margin-top: var(--nz-space-2); font-size: var(--nz-text-sm); color: var(--nz-text-mute); font-style: normal; }
.nz-blockquote--accent { border-left-color: var(--nz-accent); }
.nz-blockquote--brand { border-left-color: var(--nz-brand-strong); background: var(--nz-brand-soft); }
.nz-blockquote--sm { padding: var(--nz-space-2) var(--nz-space-3); }
.nz-blockquote--sm p { font-size: var(--nz-text-sm); }

/* ---- 08 Código ---- */
.nz-code { font-family: var(--nz-font-mono); font-size: .88em; padding: .15em .45em; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); color: var(--nz-brand-strong); }
.nz-code--inline { display: inline; padding: .05em .35em; }
.nz-code--brand { background: var(--nz-brand-soft); color: var(--nz-brand-strong); }
.nz-code--sm { font-size: var(--nz-text-2xs); }
.nz-code--block { display: block; padding: var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-gray-900); color: var(--nz-gray-100); overflow-x: auto; line-height: var(--nz-leading-normal); font-size: var(--nz-text-sm); }
.nz-code--dark { background: var(--nz-gray-950); color: var(--nz-gray-50); }
[data-nz-theme="dark"] .nz-code--block { background: var(--nz-gray-950); color: var(--nz-gray-50); }
.nz-kbd { font-family: var(--nz-font-mono); font-size: var(--nz-text-xs); padding: 0.2rem var(--nz-space-2); border-radius: var(--nz-radius-xs); background: var(--nz-surface-2); border: var(--nz-border-w) solid var(--nz-border); box-shadow: 0 1px 0 var(--nz-border); color: var(--nz-text); }
.nz-kbd--lg { font-size: var(--nz-text-sm); padding: 0.35rem 0.7rem; }

/* ---- 09 Etiqueta / chip de texto ---- */
.nz-lbl { display: inline-flex; align-items: center; gap: var(--nz-space-1); padding: 0.2rem 0.7rem; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); color: var(--nz-text-soft); font-size: var(--nz-text-2xs); font-weight: 700; }
.nz-lbl--brand { background: var(--nz-brand-soft); color: var(--nz-brand); }
.nz-lbl--accent { background: var(--nz-accent-soft); color: var(--nz-accent-strong); }
.nz-lbl--success { background: var(--nz-success-soft); color: var(--nz-success); }
.nz-lbl--danger { background: var(--nz-danger-soft); color: var(--nz-danger); }
.nz-lbl--info { background: var(--nz-info-soft); color: var(--nz-info); }
.nz-lbl--neutral { background: var(--nz-bg-inset); color: var(--nz-text-mute); }
.nz-lbl--outline { background: none; border: var(--nz-border-w) solid var(--nz-border-strong); color: var(--nz-text-soft); }

/* ---- Toast ---- */
.nz-toast { position: fixed; left: 50%; bottom: calc(var(--nz-space-6) + env(safe-area-inset-bottom, 0px)); z-index: var(--nz-z-toast); transform: translateX(-50%) translateY(16px); opacity: 0; visibility: hidden; display: inline-flex; align-items: center; gap: var(--nz-space-3); max-width: min(92vw, 26rem); padding: var(--nz-space-3) var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-gray-900); color: var(--nz-gray-50); font-size: var(--nz-text-sm); box-shadow: var(--nz-shadow-lg); transition: transform var(--nz-dur-base) var(--nz-ease-out), opacity var(--nz-dur-base) var(--nz-ease-out), visibility var(--nz-dur-base); }
