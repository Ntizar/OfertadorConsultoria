<style>
/* ====== Aurora 7 v7.2.0: tokens.css ====== */
/* ============================================================
   AURORA 7 — tokens.css
   Design System Ntizar · Fuente única de verdad de tokens
   Reglas: cero gradientes, cero glass, cero IA-slop.
   Azul #2563eb primario · Naranja #f97316 acento (nunca fundidos).
   Mobile-first · Sombras multicapa sutiles · Light + Dark.
   Hecho con ❤️ por David Antizar
   ============================================================ */

:root {
  /* ---- 1. COLOR · Azul (primario) ---- */
  --nz-blue-50:  #eff6ff;
  --nz-blue-100: #dbeafe;
  --nz-blue-200: #bfdbfe;
  --nz-blue-300: #93c5fd;
  --nz-blue-400: #60a5fa;
  --nz-blue-500: #3b82f6;
  --nz-blue-600: #2563eb;   /* brand principal */
  --nz-blue-700: #1d4ed8;
  --nz-blue-800: #1e40af;
  --nz-blue-900: #1e3a8a;

  /* ---- 2. COLOR · Naranja (acento, secundario) ---- */
  --nz-orange-50:  #fff7ed;
  --nz-orange-100: #ffedd5;
  --nz-orange-200: #fed7aa;
  --nz-orange-300: #fdba74;
  --nz-orange-400: #fb923c;
  --nz-orange-500: #f97316;  /* acento principal */
  --nz-orange-600: #ea580c;
  --nz-orange-700: #c2410c;

  /* ---- 3. COLOR · Semánticos ---- */
  --nz-green-50:  #f0fdf4;
  --nz-green-100: #dcfce7;
  --nz-green-500: #22c55e;
  --nz-green-600: #16a34a;
  --nz-green-700: #15803d;
  --nz-red-50:  #fef2f2;
  --nz-red-100: #fee2e2;
  --nz-red-500: #ef4444;
  --nz-red-600: #dc2626;
  --nz-red-700: #b91c1c;
  --nz-amber-50:  #fffbeb;
  --nz-amber-100: #fef3c7;
  --nz-amber-500: #f59e0b;
  --nz-amber-600: #d97706;
  --nz-amber-700: #b45309;

  /* ---- 4. COLOR · Neutros ---- */
  --nz-gray-0:   #ffffff;
  --nz-gray-50:  #f9fafb;
  --nz-gray-100: #f3f4f6;
  --nz-gray-200: #e5e7eb;
  --nz-gray-300: #d1d5db;
  --nz-gray-400: #9ca3af;
  --nz-gray-500: #6b7280;
  --nz-gray-600: #4b5563;
  --nz-gray-700: #374151;
  --nz-gray-800: #1f2937;
  --nz-gray-900: #111827;
  --nz-gray-950: #030712;

  /* ---- 5. TOKENS TEMÁTICOS (light por defecto) ---- */
  --nz-bg:          var(--nz-gray-0);
  --nz-bg-soft:     var(--nz-gray-50);
  --nz-bg-inset:    var(--nz-gray-100);
  --nz-surface:     var(--nz-gray-0);
  --nz-surface-2:   var(--nz-gray-50);
  --nz-border:      var(--nz-gray-200);
  --nz-border-soft: var(--nz-gray-100);
  --nz-border-strong: var(--nz-gray-300);
  --nz-text:        var(--nz-gray-900);
  --nz-text-soft:   var(--nz-gray-600);
  --nz-text-mute:   var(--nz-gray-500);
  --nz-text-faint:  var(--nz-gray-400);
  --nz-text-invert: var(--nz-gray-0);
  --nz-brand:       var(--nz-blue-600);
  --nz-brand-strong: var(--nz-blue-700);
  --nz-brand-soft:  var(--nz-blue-50);
  --nz-brand-tint:  var(--nz-blue-100);
  --nz-accent:      var(--nz-orange-500);
  --nz-accent-strong: var(--nz-orange-600);
  --nz-accent-soft: var(--nz-orange-50);
  --nz-accent-tint: var(--nz-orange-100);
  --nz-success:     var(--nz-green-600);
  --nz-success-soft: var(--nz-green-50);
  --nz-success-tint: var(--nz-green-100);
  --nz-danger:      var(--nz-red-600);
  --nz-danger-soft: var(--nz-red-50);
  --nz-danger-tint: var(--nz-red-100);
  --nz-warning:     var(--nz-amber-600);
  --nz-warning-soft: var(--nz-amber-50);
  --nz-warning-tint: var(--nz-amber-100);
  --nz-info:        var(--nz-blue-600);
  --nz-info-soft:   var(--nz-blue-50);
  --nz-info-tint:   var(--nz-blue-100);
  --nz-overlay:     rgba(17, 24, 39, 0.48);

  /* ---- 6. TIPOGRAFÍA ---- */
  --nz-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nz-font-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  /* Escala fluida mobile-first (clamp: móvil → escritorio) */
  --nz-text-2xs: 0.6875rem;                       /* 11px */
  --nz-text-xs:  0.75rem;                         /* 12px */
  --nz-text-sm:  0.8125rem;                       /* 13px */
  --nz-text-base: 0.9375rem;                      /* 15px */
  --nz-text-md:  1rem;                            /* 16px */
  --nz-text-lg:  1.125rem;                        /* 18px */
  --nz-text-xl:  clamp(1.25rem, 1.1rem + 0.6vw, 1.5rem);
  --nz-text-2xl: clamp(1.5rem, 1.25rem + 1vw, 1.875rem);
  --nz-text-3xl: clamp(1.875rem, 1.4rem + 1.8vw, 2.5rem);
  --nz-text-4xl: clamp(2.25rem, 1.6rem + 2.8vw, 3.25rem);
  --nz-leading-tight: 1.2;
  --nz-leading-snug: 1.375;
  --nz-leading-normal: 1.6;
  --nz-tracking-tight: -0.02em;
  --nz-tracking-caps: 0.08em;

  /* ---- 7. ESPACIO (escala 4px) ---- */
  --nz-space-0: 0;
  --nz-space-1: 0.25rem;   /* 4 */
  --nz-space-2: 0.5rem;    /* 8 */
  --nz-space-3: 0.75rem;   /* 12 */
  --nz-space-4: 1rem;      /* 16 */
  --nz-space-5: 1.25rem;   /* 20 */
  --nz-space-6: 1.5rem;    /* 24 */
  --nz-space-7: 1.75rem;   /* 28 */
  --nz-space-8: 2rem;      /* 32 */
  --nz-space-9: 2.25rem;   /* 36 */
  --nz-space-10: 2.5rem;   /* 40 */
  --nz-space-12: 3rem;     /* 48 */
  --nz-space-16: 4rem;     /* 64 */
  --nz-space-20: 5rem;     /* 80 */
  --nz-gutter: var(--nz-space-4);                    /* gutter móvil */
  --nz-container-max: 72rem;                         /* 1152px */
  --nz-container-narrow: 44rem;                      /* 704px, prose */

  /* ---- 8. RADIOS Y BORDES ---- */
  --nz-radius-xs: 4px;
  --nz-radius-sm: 6px;
  --nz-radius-md: 10px;
  --nz-radius-lg: 14px;
  --nz-radius-xl: 20px;
  --nz-radius-full: 999px;
  --nz-border-w: 1px;
  --nz-border-w-strong: 1.5px;

  /* ---- 9. SOMBRAS (multicapa sutiles, sin bordes duros) ---- */
  --nz-shadow-xs: 0 1px 2px rgba(17, 24, 39, 0.05);
  --nz-shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.05), 0 2px 6px rgba(17, 24, 39, 0.04);
  --nz-shadow-md: 0 2px 4px rgba(17, 24, 39, 0.04), 0 6px 16px rgba(17, 24, 39, 0.07);
  --nz-shadow-lg: 0 4px 8px rgba(17, 24, 39, 0.04), 0 14px 32px rgba(17, 24, 39, 0.10);
  --nz-shadow-xl: 0 8px 16px rgba(17, 24, 39, 0.06), 0 24px 56px rgba(17, 24, 39, 0.14);
  --nz-shadow-brand: 0 2px 4px rgba(37, 99, 235, 0.10), 0 8px 20px rgba(37, 99, 235, 0.14);
  --nz-shadow-accent: 0 2px 4px rgba(249, 115, 22, 0.10), 0 8px 20px rgba(249, 115, 22, 0.14);

  /* ---- 10. Z-INDEX ---- */
  --nz-z-base: 0;
  --nz-z-raised: 10;
  --nz-z-sticky: 100;
  --nz-z-header: 200;
  --nz-z-drawer: 300;
  --nz-z-modal: 400;
  --nz-z-popover: 500;
  --nz-z-toast: 600;
  --nz-z-tooltip: 700;

  /* ---- 11. MOVIMIENTO (ui-animation-taste) ---- */
  --nz-dur-fast: 120ms;
  --nz-dur-base: 180ms;
  --nz-dur-slow: 260ms;
  --nz-ease-out: cubic-bezier(0.16, 1, 0.3, 1);   /* expo-out: entradas */
  --nz-ease-in:  cubic-bezier(0.7, 0, 0.84, 0);   /* salidas, más cortas */
  --nz-ease-soft: cubic-bezier(0.33, 1, 0.68, 1);

  /* ---- 12. FOCUS ---- */
  --nz-focus-ring: 0 0 0 3px var(--nz-blue-200);
  --nz-focus-ring-accent: 0 0 0 3px var(--nz-orange-200);
}

/* ---- TEMA OSCURO (opt-in vía data-nz-theme="dark") ---- */
[data-nz-theme="dark"] {
  --nz-bg:          #0b1220;
  --nz-bg-soft:     #0f172a;
  --nz-bg-inset:    #1e293b;
  --nz-surface:     #101a2e;
  --nz-surface-2:   #16223a;
  --nz-border:      #24334d;
  --nz-border-soft: #1c2940;
  --nz-border-strong: #33456a;
  --nz-text:        #f1f5f9;
  --nz-text-soft:   #a9b8cd;
  --nz-text-mute:   #7d8fa9;
  --nz-text-faint:  #5b6b85;
  --nz-text-invert: #0b1220;
  --nz-brand:       #4f8ef7;
  --nz-brand-strong: #6ba3ff;
  --nz-brand-soft:  rgba(79, 142, 247, 0.12);
  --nz-brand-tint:  rgba(79, 142, 247, 0.22);
  --nz-accent:      #fb923c;
  --nz-accent-strong: #fdba74;
  --nz-accent-soft: rgba(251, 146, 60, 0.12);
  --nz-accent-tint: rgba(251, 146, 60, 0.22);
  --nz-success:     #4ade80;
  --nz-success-soft: rgba(34, 197, 94, 0.14);
  --nz-success-tint: rgba(34, 197, 94, 0.24);
  --nz-danger:      #f87171;
  --nz-danger-soft: rgba(239, 68, 68, 0.14);
  --nz-danger-tint: rgba(239, 68, 68, 0.24);
  --nz-warning:     #fbbf24;
  --nz-warning-soft: rgba(245, 158, 11, 0.14);
  --nz-warning-tint: rgba(245, 158, 11, 0.24);
  --nz-info:        #4f8ef7;
  --nz-info-soft:   rgba(79, 142, 247, 0.12);
  --nz-info-tint:   rgba(79, 142, 247, 0.22);
  --nz-overlay:     rgba(3, 7, 18, 0.62);
  --nz-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.35);
  --nz-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.30);
  --nz-shadow-md: 0 2px 4px rgba(0, 0, 0, 0.30), 0 6px 16px rgba(0, 0, 0, 0.38);
  --nz-shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.30), 0 14px 32px rgba(0, 0, 0, 0.45);
  --nz-shadow-xl: 0 8px 16px rgba(0, 0, 0, 0.35), 0 24px 56px rgba(0, 0, 0, 0.55);
  --nz-shadow-brand: 0 2px 4px rgba(0, 0, 0, 0.30), 0 8px 20px rgba(79, 142, 247, 0.20);
  --nz-shadow-accent: 0 2px 4px rgba(0, 0, 0, 0.30), 0 8px 20px rgba(251, 146, 60, 0.20);
  --nz-focus-ring: 0 0 0 3px rgba(79, 142, 247, 0.45);
  --nz-focus-ring-accent: 0 0 0 3px rgba(251, 146, 60, 0.45);
}

/* ---- Base compartida ---- */
.nz, [data-nz-theme] {
  font-family: var(--nz-font);
  color: var(--nz-text);
  background: var(--nz-bg);
  line-height: var(--nz-leading-normal);
  font-size: var(--nz-text-md);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.nz *, [data-nz-theme] * { box-sizing: border-box; }

.nz :focus-visible, [data-nz-theme] :focus-visible {
  outline: none;
  box-shadow: var(--nz-focus-ring);
  border-radius: var(--nz-radius-sm);
}

/* Movimiento reducido: congelar, no ralentizar */
@media (prefers-reduced-motion: reduce) {
  .nz *, [data-nz-theme] * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---- Breakpoints oficiales (mobile-first, usar min-width):
   base  ≤ 639px   1 columna
   sm    ≥ 640px   2 columnas
   md    ≥ 960px   3 columnas / sidebar
   lg    ≥ 1200px  layout completo
---- */

/* ====== Aurora 7 v7.2.0: packs/p1-layout.css ====== */
/* ============================================================
   AURORA 7 — p1-layout.css · Categoría 1 · Layout y estructura (167 objetos)
   Contenedores, rejillas, spans, pilas, landmarks, sticky, bleed,
   regiones de página y helpers de flujo. Demostrado en specs/01.json (48 demos).
   Mobile-first (base 1 columna → 640 → 960 → 1200). Todo con tokens.
   Cero gradientes, cero glass. Táctil 44px. Hecho con ❤️ por David Antizar
   ============================================================ */

/* ---- 01 Viewport / contenedor raíz ---- */
.nz-root { min-height: 100dvh; display: flex; flex-direction: column; }

/* ---- 02 Contenedor de página ---- */
.nz-container { width: 100%; max-width: var(--nz-container-max); margin-inline: auto; padding-inline: var(--nz-gutter); }
.nz-container--fluid { max-width: none; }
.nz-container--fixed { max-width: 60rem; }
.nz-container--wide { max-width: 84rem; }
.nz-container--narrow { max-width: var(--nz-container-narrow); }

/* ---- 03 Grid de 12 columnas ---- */
.nz-grid-12 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--nz-space-4); }

/* ---- 04 Grid CSS auto-fit ---- */
.nz-grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--nz-space-4); }

/* ---- 05 Spans de rejilla (1..12) — escalan con el número de columnas ---- */
.nz-span-1 { grid-column: span 1; } .nz-span-2 { grid-column: span 2; } .nz-span-3 { grid-column: span 3; } .nz-span-4 { grid-column: span 4; }
.nz-span-5, .nz-span-6, .nz-span-7, .nz-span-8, .nz-span-9, .nz-span-10, .nz-span-11, .nz-span-12 { grid-column: span 4; }
@media (min-width: 640px) {
  .nz-span-5 { grid-column: span 5; } .nz-span-6 { grid-column: span 6; } .nz-span-7 { grid-column: span 7; } .nz-span-8 { grid-column: span 8; }
  .nz-span-9, .nz-span-10, .nz-span-11, .nz-span-12 { grid-column: span 8; }
}
@media (min-width: 960px) {
  .nz-span-5 { grid-column: span 5; } .nz-span-6 { grid-column: span 6; } .nz-span-7 { grid-column: span 7; } .nz-span-8 { grid-column: span 8; }
  .nz-span-9 { grid-column: span 9; } .nz-span-10 { grid-column: span 10; } .nz-span-11 { grid-column: span 11; } .nz-span-12 { grid-column: span 12; }
}

/* ---- 06 Sistema de filas (con columnas por breakpoint) ---- */
.nz-row { display: flex; flex-wrap: wrap; gap: var(--nz-space-4); }
.nz-row > * { flex: 1 1 100%; min-width: 0; }
.nz-row--compact { gap: var(--nz-space-2); }
.nz-row--spacious { gap: var(--nz-space-6); }
.nz-row--2 > * { flex: 1 1 100%; }
.nz-row--3 > * { flex: 1 1 100%; }
.nz-row--4 > * { flex: 1 1 100%; }
@media (min-width: 640px) {
  .nz-row > * { flex: 1 1 calc(50% - var(--nz-space-4)); }
  .nz-row--2 > * { flex: 1 1 calc(50% - var(--nz-space-2)); }
  .nz-row--3 > * { flex: 1 1 calc(50% - var(--nz-space-4)); }
  .nz-row--4 > * { flex: 1 1 calc(50% - var(--nz-space-4)); }
}
@media (min-width: 960px) {
  .nz-row--3 > * { flex: 1 1 calc(33.333% - var(--nz-space-4)); }
  .nz-row--4 > * { flex: 1 1 calc(25% - var(--nz-space-3)); }
}

/* ---- 07 Sistema de columnas ---- */
.nz-col { display: flex; flex-direction: column; gap: var(--nz-space-4); min-width: 0; }

/* ---- 08 Stack vertical ---- */
.nz-stack { display: flex; flex-direction: column; gap: var(--nz-space-4); }
.nz-stack--2xs { gap: var(--nz-space-0); } .nz-stack--xs { gap: var(--nz-space-1); }
.nz-stack--sm { gap: var(--nz-space-2); }
.nz-stack--lg { gap: var(--nz-space-6); } .nz-stack--xl { gap: var(--nz-space-8); }

/* ---- 09 Stack horizontal (reparto y alineación) ---- */
.nz-hstack { display: flex; align-items: center; gap: var(--nz-space-3); flex-wrap: wrap; }
.nz-hstack--compact { gap: var(--nz-space-2); }
.nz-hstack--spacious { gap: var(--nz-space-6); }
.nz-hstack--center { justify-content: center; }
.nz-hstack--between { justify-content: space-between; }
.nz-hstack--end { justify-content: flex-end; }
.nz-hstack--nowrap { flex-wrap: nowrap; }
.nz-hstack--top { align-items: flex-start; }
.nz-hstack--bottom { align-items: flex-end; }

/* ---- 10 Cluster / grupo de ítems ---- */
.nz-cluster { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: var(--nz-space-2) var(--nz-space-3); }
.nz-cluster--compact { gap: var(--nz-space-1) var(--nz-space-2); }
.nz-cluster--spacious { gap: var(--nz-space-4) var(--nz-space-6); }
.nz-cluster--center { justify-content: center; }
.nz-cluster--between { justify-content: space-between; }
.nz-cluster--end { justify-content: flex-end; }
.nz-cluster--nowrap { flex-wrap: nowrap; overflow-x: auto; }

/* ---- 11 Split layout (repartos) ---- */
.nz-split { display: grid; gap: var(--nz-space-6); grid-template-columns: 1fr; }
.nz-split--2-1 { grid-template-columns: 1fr; }
.nz-split--3-2 { grid-template-columns: 1fr; }
.nz-split--40-60 { grid-template-columns: 1fr; }
.nz-split--60-40 { grid-template-columns: 1fr; }
@media (min-width: 640px) { .nz-split--40-60 { grid-template-columns: 4fr 6fr; } .nz-split--60-40 { grid-template-columns: 6fr 4fr; } }
@media (min-width: 960px) {
  .nz-split { grid-template-columns: 1fr 1fr; align-items: start; }
  .nz-split--2-1 { grid-template-columns: 2fr 1fr; }
  .nz-split--3-2 { grid-template-columns: 3fr 2fr; }
  .nz-split--40-60 { grid-template-columns: 4fr 6fr; }
  .nz-split--60-40 { grid-template-columns: 6fr 4fr; }
}

/* ---- 12 Sidebar + contenido ---- */
.nz-with-sidebar { display: grid; gap: var(--nz-space-6); grid-template-columns: 1fr; }
.nz-with-sidebar > * { min-width: 0; }
.nz-with-sidebar--right { grid-template-columns: 1fr; }
.nz-with-sidebar--wide { grid-template-columns: 1fr; }
@media (min-width: 960px) {
  .nz-with-sidebar { grid-template-columns: 15rem minmax(0, 1fr); }
  .nz-with-sidebar--right { grid-template-columns: minmax(0, 1fr) 15rem; }
  .nz-with-sidebar--wide { grid-template-columns: 20rem minmax(0, 1fr); }
  .nz-with-sidebar--right > :last-child { grid-column: 1; grid-row: 1; }
  .nz-with-sidebar--right > :first-child { grid-column: 2; grid-row: 1; }
}

/* ---- 13 Layout de tres columnas ---- */
.nz-thirds { display: grid; gap: var(--nz-space-4); grid-template-columns: 1fr; }
.nz-thirds--compact { gap: var(--nz-space-2); }
.nz-thirds--spacious { gap: var(--nz-space-6); }
@media (min-width: 640px) { .nz-thirds { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 960px) { .nz-thirds { grid-template-columns: repeat(3, 1fr); } }

/* ---- 14 Header / cabecera ---- */
.nz-header { display: flex; align-items: center; justify-content: space-between; gap: var(--nz-space-3); padding: var(--nz-space-3) var(--nz-gutter); background: var(--nz-surface); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-header--compact { padding-block: var(--nz-space-1); min-height: 44px; }
.nz-header--tall { padding-block: var(--nz-space-6); }
.nz-header--bordered { border-bottom: var(--nz-border-w-strong) solid var(--nz-border-strong); }

/* ---- 15 Main / contenido principal ---- */
.nz-main { flex: 1 0 auto; padding-block: var(--nz-space-6); }
.nz-main--flush { padding-block: 0; }
.nz-main--narrow { max-width: var(--nz-container-narrow); margin-inline: auto; }
.nz-main--wide { max-width: var(--nz-container-max); margin-inline: auto; }

/* ---- 16 Footer ---- */
.nz-footer { padding: var(--nz-space-8) var(--nz-gutter); background: var(--nz-bg-soft); border-top: var(--nz-border-w) solid var(--nz-border-soft); color: var(--nz-text-soft); font-size: var(--nz-text-sm); }
.nz-footer--compact { padding-block: var(--nz-space-3); }
.nz-footer--brand { background: var(--nz-brand-soft); color: var(--nz-text); border-top-color: var(--nz-brand-tint); }

/* ---- 17 Landmarks ---- */
.nz-nav-landmark { display: block; }
.nz-aside { display: block; }
.nz-section { padding-block: var(--nz-space-10); }
.nz-section--compact { padding-block: var(--nz-space-4); }
.nz-section--spacious { padding-block: var(--nz-space-16); }
.nz-section--bordered { border-block: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-article { background: var(--nz-surface); border-radius: var(--nz-radius-lg); padding: var(--nz-space-5); box-shadow: var(--nz-shadow-sm); }
.nz-article--flush { padding: 0; }
.nz-article--bordered { border: var(--nz-border-w) solid var(--nz-border-soft); box-shadow: none; }
.nz-article--interactive { cursor: pointer; transition: transform var(--nz-dur-base) var(--nz-ease-out), box-shadow var(--nz-dur-base) var(--nz-ease-out); }

/* ---- 07 Breadcrumbs ---- */

.nz-pagination { display: flex; align-items: center; gap: var(--nz-space-1); flex-wrap: wrap; }
.nz-pagination a, .nz-pagination button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 var(--nz-space-3); border-radius: var(--nz-radius-sm); border: 0; background: transparent; color: var(--nz-text-soft); font-weight: 600; font-size: var(--nz-text-sm); text-decoration: none; font-family: inherit; cursor: pointer; }

/* ---- 09 Índice de contenidos (TOC) ---- */
.nz-toc { display: flex; flex-direction: column; gap: var(--nz-space-1); padding: var(--nz-space-4); background: var(--nz-surface); border-radius: var(--nz-radius-lg); box-shadow: var(--nz-shadow-sm); }
.nz-toc__title { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-faint); margin-bottom: var(--nz-space-2); }

/* ---- 10 Dropdown select ---- */
.nz-dropdown { position: relative; }

.nz-dropdown__btn::after { content: "▾"; font-size: var(--nz-text-xs); color: var(--nz-text-faint); }
.nz-dropdown__btn--icon { padding: 0; min-width: 44px; justify-content: center; gap: 0; }
.nz-dropdown__list { position: absolute; top: calc(100% + var(--nz-space-2)); left: 0; min-width: 12rem; padding: var(--nz-space-2); border-radius: var(--nz-radius-lg); background: var(--nz-surface); box-shadow: var(--nz-shadow-lg); opacity: 0; visibility: hidden; transform: translateY(-6px); transition: transform var(--nz-dur-base) var(--nz-ease-out), opacity var(--nz-dur-base) var(--nz-ease-out), visibility var(--nz-dur-base); }
.nz-dropdown > input:checked ~ .nz-dropdown__list { opacity: 1; visibility: visible; transform: none; }
.nz-dropdown__list--divided > * + * { border-top: var(--nz-border-w) solid var(--nz-border-soft); border-radius: 0; }

/* ---- 11 Nav footer ---- */
.nz-navfooter { display: flex; flex-wrap: wrap; gap: var(--nz-space-2) var(--nz-space-6); padding: var(--nz-space-6) 0; }

.nz-navfooter__title { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-text-faint); }
.nz-navfooter__title--brand { color: var(--nz-brand); }
.nz-navfooter a { min-height: 44px; display: inline-flex; align-items: center; color: var(--nz-text-soft); text-decoration: none; font-size: var(--nz-text-sm); }
.nz-navfooter a:hover { color: var(--nz-brand); }
.nz-navfooter__bottom { flex-basis: 100%; grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: var(--nz-space-2) var(--nz-space-4); padding-top: var(--nz-space-4); border-top: var(--nz-border-w) solid var(--nz-border-soft); color: var(--nz-text-mute); font-size: var(--nz-text-xs); }
.nz-navfooter--compact { padding: var(--nz-space-4) 0; gap: var(--nz-space-1) var(--nz-space-4); }
.nz-navfooter--2col, .nz-navfooter--3col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--nz-space-3); }

}

/* ---- 12 Stepper de navegación (proceso) ---- */
.nz-stepper { display: flex; align-items: center; gap: var(--nz-space-2); overflow-x: auto; scrollbar-width: none; }

.nz-stepper__step { display: flex; align-items: center; gap: var(--nz-space-2); white-space: nowrap; color: var(--nz-text-faint); font-size: var(--nz-text-sm); font-weight: 600; }

.nz-stepper--vertical { flex-direction: column; align-items: flex-start; gap: var(--nz-space-3); overflow-x: visible; }

/* ====== Aurora 7 v7.2.0: packs/p3-typography.css ====== */
/* ============================================================
   AURORA 7 — p3-typography.css · Categoría 3 · Tipografía (130 objetos)
   Escala, tonos de titular, cuerpo, prose (dueño único), listas,
   bloque, código, etiquetas, cifras, enlaces y utilidades de texto.
   Demostrado en specs/03.json (42 demos). Prose: dueño único del sistema.
   Jerarquía por tamaño/peso/espacio, no por color. Solo tokens.
   Cero gradientes, cero glass. Hecho con ❤️ por David Antizar
   ============================================================ */

/* ---- 01 Escala (fluida, mobile-first — tokens ya definidos) ---- */
.nz-display { font-size: var(--nz-text-4xl); font-weight: 800; line-height: var(--nz-leading-tight); letter-spacing: var(--nz-tracking-tight); }
.nz-h1 { font-size: var(--nz-text-3xl); font-weight: 800; line-height: var(--nz-leading-tight); letter-spacing: var(--nz-tracking-tight); }
.nz-h2 { font-size: var(--nz-text-2xl); font-weight: 700; line-height: var(--nz-leading-tight); letter-spacing: var(--nz-tracking-tight); }
.nz-h3 { font-size: var(--nz-text-xl); font-weight: 700; line-height: var(--nz-leading-snug); letter-spacing: var(--nz-tracking-tight); }
.nz-h4 { font-size: var(--nz-text-lg); font-weight: 700; line-height: var(--nz-leading-snug); }
.nz-h5 { font-size: var(--nz-text-base); font-weight: 700; line-height: var(--nz-leading-snug); }
.nz-h6 { font-size: var(--nz-text-sm); font-weight: 700; line-height: var(--nz-leading-snug); letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; }
.nz-eyebrow { font-size: var(--nz-text-2xs); font-weight: 800; letter-spacing: var(--nz-tracking-caps); text-transform: uppercase; color: var(--nz-brand); }

/* ---- 02 Display grande y pequeño ---- */
.nz-display--xl { font-size: calc(var(--nz-text-4xl) * 1.15); letter-spacing: var(--nz-tracking-tight); }
.nz-display--sm { font-size: var(--nz-text-2xl); font-weight: 800; line-height: var(--nz-leading-tight); }

/* ---- 03 Tono de titular (azul / naranja / apagado / apretado) ---- */
.nz-h1--brand, .nz-h2--brand, .nz-h3--brand, .nz-h4--brand, .nz-h5--brand, .nz-h6--brand { color: var(--nz-brand); }
.nz-h1--accent, .nz-h2--accent, .nz-h3--accent, .nz-h4--accent, .nz-h5--accent, .nz-h6--accent { color: var(--nz-accent-strong); }
.nz-h1--muted, .nz-h2--muted, .nz-h3--muted, .nz-h4--muted, .nz-h5--muted, .nz-h6--muted { color: var(--nz-text-mute); }
.nz-h1--tight, .nz-h2--tight, .nz-h3--tight, .nz-h4--tight, .nz-h5--tight, .nz-h6--tight { letter-spacing: var(--nz-tracking-tight); }

/* ---- 04 Cuerpo ---- */
.nz-lead { font-size: var(--nz-text-lg); color: var(--nz-text-soft); line-height: var(--nz-leading-snug); }
.nz-lead--sm { font-size: var(--nz-text-md); }
.nz-lead--lg { font-size: var(--nz-text-xl); line-height: var(--nz-leading-normal); }
.nz-lead--brand { color: var(--nz-text-soft); border-inline-start: 3px solid var(--nz-brand); padding-inline-start: var(--nz-space-4); }
.nz-text--large { font-size: var(--nz-text-lg); }
.nz-text--small { font-size: var(--nz-text-sm); }
.nz-text--muted { color: var(--nz-text-mute); }
.nz-text--faint { color: var(--nz-text-faint); }
.nz-text--mono { font-family: var(--nz-font-mono); font-size: .9em; }

.nz-text--danger { color: var(--nz-danger); }
.nz-text--warning { color: var(--nz-warning); }
.nz-text--brand-soft { color: var(--nz-brand-strong); background: var(--nz-brand-soft); padding: 0 .3em; border-radius: var(--nz-radius-xs); }

/* ---- 05 Prose (dueño único de este objeto) ---- */
.nz-prose { max-width: var(--nz-container-narrow); margin-inline: auto; }
.nz-prose p { font-size: var(--nz-text-md); color: var(--nz-text-soft); line-height: var(--nz-leading-normal); margin-block: var(--nz-space-4); }
.nz-prose h2 { font-size: var(--nz-text-xl); letter-spacing: var(--nz-tracking-tight); margin-block: var(--nz-space-8) var(--nz-space-3); }
.nz-prose h3 { font-size: var(--nz-text-lg); letter-spacing: var(--nz-tracking-tight); margin-block: var(--nz-space-6) var(--nz-space-2); }

.nz-prose table { width: 100%; border-collapse: collapse; margin-block: var(--nz-space-4); font-size: var(--nz-text-sm); }
.nz-prose th, .nz-prose td { text-align: start; padding: var(--nz-space-2) var(--nz-space-3); border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-prose th { color: var(--nz-text); font-weight: 700; }
.nz-prose img { max-width: 100%; height: auto; border-radius: var(--nz-radius-md); }
.nz-prose--wide { max-width: var(--nz-container-max); }
.nz-prose--brand a { color: var(--nz-brand-strong); }
.nz-prose--brand strong { color: var(--nz-brand); }
.nz-prose--brand h2, .nz-prose--brand h3 { color: var(--nz-brand); }

/* ---- 06 Listas ---- */
.nz-list { list-style: none; padding: 0; margin-block: var(--nz-space-2); display: flex; flex-direction: column; gap: var(--nz-space-2); }
.nz-list__item { display: flex; gap: var(--nz-space-3); align-items: flex-start; color: var(--nz-text-soft); }
.nz-list__item::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: .5em; border-radius: var(--nz-radius-full); background: var(--nz-brand); }
.nz-list--accent .nz-list__item::before { background: var(--nz-accent); }
.nz-list--check .nz-list__item::before { content: "✓"; width: auto; height: auto; background: none; color: var(--nz-success); font-weight: 800; font-size: var(--nz-text-sm); }
.nz-list--numeric { counter-reset: nzcount; }
.nz-list--numeric .nz-list__item { counter-increment: nzcount; display: grid; grid-template-columns: 1.75rem 1fr; gap: var(--nz-space-2); }
.nz-list--numeric .nz-list__item::before { content: counter(nzcount); width: auto; height: auto; background: none; color: var(--nz-brand); font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 0; }
.nz-list--brand .nz-list__item { padding: var(--nz-space-2) var(--nz-space-3); border-radius: var(--nz-radius-sm); background: var(--nz-brand-soft); color: var(--nz-text); }
.nz-list--compact { gap: var(--nz-space-1); }
.nz-list--compact .nz-list__item { font-size: var(--nz-text-sm); }
.nz-list--divided .nz-list__item + .nz-list__item { border-top: var(--nz-border-w) solid var(--nz-border-soft); padding-top: var(--nz-space-2); }
.nz-list--icon .nz-list__item { align-items: center; }
.nz-list--icon .nz-list__item::before { content: ""; width: 22px; height: 22px; margin-top: 0; border-radius: var(--nz-radius-xs); background: var(--nz-brand-soft); }
.nz-list__item--done { color: var(--nz-text-mute); text-decoration: line-through; }
.nz-list__item--done::before { background: var(--nz-success); }

/* ---- 07 Blockquote ---- */
.nz-blockquote { margin: var(--nz-space-4) 0; padding: var(--nz-space-4) var(--nz-space-5); border-left: 3px solid var(--nz-brand); background: var(--nz-bg-soft); border-radius: 0 var(--nz-radius-md) var(--nz-radius-md) 0; }
.nz-blockquote p { font-size: var(--nz-text-base); color: var(--nz-text); font-style: italic; margin: 0; }
.nz-blockquote footer { margin-top: var(--nz-space-2); font-size: var(--nz-text-sm); color: var(--nz-text-mute); font-style: normal; }
.nz-blockquote--accent { border-left-color: var(--nz-accent); }
.nz-blockquote--brand { border-left-color: var(--nz-brand-strong); background: var(--nz-brand-soft); }
.nz-blockquote--sm { padding: var(--nz-space-2) var(--nz-space-3); }
.nz-blockquote--sm p { font-size: var(--nz-text-sm); }

/* ---- 08 Código ---- */
.nz-code { font-family: var(--nz-font-mono); font-size: .88em; padding: .15em .45em; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); color: var(--nz-brand-strong); }
.nz-code--inline { display: inline; padding: .05em .35em; }
.nz-code--brand { background: var(--nz-brand-soft); color: var(--nz-brand-strong); }
.nz-code--sm { font-size: var(--nz-text-2xs); }
.nz-code--block { display: block; padding: var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-gray-900); color: var(--nz-gray-100); overflow-x: auto; line-height: var(--nz-leading-normal); font-size: var(--nz-text-sm); }
.nz-code--dark { background: var(--nz-gray-950); color: var(--nz-gray-50); }
[data-nz-theme="dark"] .nz-code--block { background: var(--nz-gray-950); color: var(--nz-gray-50); }
.nz-kbd { font-family: var(--nz-font-mono); font-size: var(--nz-text-xs); padding: 0.2rem var(--nz-space-2); border-radius: var(--nz-radius-xs); background: var(--nz-surface-2); border: var(--nz-border-w) solid var(--nz-border); box-shadow: 0 1px 0 var(--nz-border); color: var(--nz-text); }
.nz-kbd--lg { font-size: var(--nz-text-sm); padding: 0.35rem 0.7rem; }

/* ---- 09 Etiqueta / chip de texto ---- */
.nz-lbl { display: inline-flex; align-items: center; gap: var(--nz-space-1); padding: 0.2rem 0.7rem; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); color: var(--nz-text-soft); font-size: var(--nz-text-2xs); font-weight: 700; }
.nz-lbl--brand { background: var(--nz-brand-soft); color: var(--nz-brand); }
.nz-lbl--accent { background: var(--nz-accent-soft); color: var(--nz-accent-strong); }
.nz-lbl--success { background: var(--nz-success-soft); color: var(--nz-success); }
.nz-lbl--danger { background: var(--nz-danger-soft); color: var(--nz-danger); }
.nz-lbl--info { background: var(--nz-info-soft); color: var(--nz-info); }
.nz-lbl--neutral { background: var(--nz-bg-inset); color: var(--nz-text-mute); }
.nz-lbl--outline { background: none; border: var(--nz-border-w) solid var(--nz-border-strong); color: var(--nz-text-soft); }
.nz-lbl--lg { padding: 0.3rem 0.9rem; font-size: var(--nz-text-xs); }
.nz-lbl--sm { padding: 0.1rem var(--nz-space-2); font-size: var(--nz-text-2xs); }
.nz-lbl i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* ---- 10 Cifras / números ---- */
.nz-num { font-variant-numeric: tabular-nums; letter-spacing: var(--nz-tracking-tight); }
.nz-num--stat { font-size: var(--nz-text-2xl); font-weight: 800; color: var(--nz-text); }
.nz-num--brand { color: var(--nz-brand); }
.nz-num--accent { color: var(--nz-accent); }
.nz-num--sm { font-size: var(--nz-text-sm); }
.nz-num--lg { font-size: var(--nz-text-xl); font-weight: 700; }
.nz-num--success { color: var(--nz-success); }
.nz-num--danger { color: var(--nz-danger); }

/* ---- 11 Enlaces con vida ---- */
.nz-link { position: relative; color: var(--nz-brand); font-weight: 600; text-decoration: none; }
.nz-link::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px; border-radius: var(--nz-radius-full); background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform var(--nz-dur-base) var(--nz-ease-out); }
.nz-link:hover::after { transform: scaleX(1); }
.nz-link--accent { color: var(--nz-accent); }
.nz-link--brand { color: var(--nz-brand-strong); font-weight: 700; }

/* ---- Fila de lista (avatar + texto + acciones) ---- */
.nz-list-row { display: flex; align-items: center; gap: var(--nz-space-3); min-height: 56px; padding: var(--nz-space-3) var(--nz-space-4); border-radius: var(--nz-radius-md); background: var(--nz-surface); box-shadow: var(--nz-shadow-xs); }

.nz-timeline { position: relative; display: flex; flex-direction: column; gap: var(--nz-space-4); padding-left: var(--nz-space-5); }

.nz-dl__row { display: flex; justify-content: space-between; gap: var(--nz-space-4); padding: var(--nz-space-3) 0; border-bottom: var(--nz-border-w) solid var(--nz-border-soft); }

.nz-gauge-num__unit { margin-left: var(--nz-space-1); font-size: var(--nz-text-lg); font-weight: 700; color: var(--nz-text-mute); }

.nz-matrix__cell--high { background: var(--nz-brand); }
.nz-matrix__cell--top { background: var(--nz-brand-strong); }
.nz-matrix__label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); font-variant-numeric: tabular-nums; }

/* ---- Tabla de comparación con columna destacada ---- */
.nz-compare { width: 100%; border-collapse: collapse; font-size: var(--nz-text-sm); background: var(--nz-surface); }

.nz-compare__foot { font-size: var(--nz-text-xs); color: var(--nz-text-mute); padding: var(--nz-space-3) var(--nz-space-4); }


/* ============================================================
   Estados de arbol, densidad y tono de registros (lexico)      */

.nz-records--dense { gap: var(--nz-space-1); }

/* ====== Aurora 7 v7.2.0: packs/p13-charts.css ====== */
/* ============================================================
   AURORA 7 — p13-charts.css · Categoría 13 · Gráficos y visualización
   Visualización de datos sin librerías: barras, línea, área, donut,
   medidor, mapa de calor, calendario de calor, treemap, embudo, bullet,
   radar, dispersión, cascada y diagrama de flujo.
   Las formas que el CSS no dibuja van en SVG inline ESTILIZADO POR CLASES
   (fill/stroke en el CSS, nunca en el atributo). Cero gradientes, cero glass.
   Todo el color sale de tokens, así que el modo oscuro funciona solo.
   ============================================================ */

/* ---- Tarjeta de gráfico ---- */
.nz-chart { display: flex; flex-direction: column; gap: var(--nz-space-3); padding: var(--nz-space-4); border-radius: var(--nz-radius-lg); background: var(--nz-surface); box-shadow: var(--nz-shadow-sm); }
.nz-chart--bordered { box-shadow: none; border: var(--nz-border-w) solid var(--nz-border); }
.nz-chart--flat { box-shadow: none; background: var(--nz-bg-soft); }
.nz-chart--sm { padding: var(--nz-space-3); gap: var(--nz-space-2); }
.nz-chart--lg { padding: var(--nz-space-6); gap: var(--nz-space-4); }
.nz-chart__head { display: flex; align-items: flex-start; gap: var(--nz-space-3); flex-wrap: wrap; }
.nz-chart__title { font-size: var(--nz-text-md); font-weight: 700; letter-spacing: var(--nz-tracking-tight); }
.nz-chart__sub { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-chart__actions { margin-left: auto; display: flex; gap: var(--nz-space-2); align-items: center; }
.nz-chart__body { position: relative; min-height: 8rem; }
.nz-chart__grid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.nz-chart__grid-line { border-top: var(--nz-border-w) solid var(--nz-border-soft); }
.nz-chart__axis { display: flex; justify-content: space-between; font-size: var(--nz-text-2xs); color: var(--nz-text-faint); padding-top: var(--nz-space-1); }
.nz-chart__axis-label { color: var(--nz-text-mute); font-size: var(--nz-text-2xs); }
.nz-chart__target { position: absolute; left: 0; right: 0; border-top: var(--nz-border-w) dashed var(--nz-border-strong); }
.nz-chart__target--accent { border-top-color: var(--nz-accent); }
.nz-chart__mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--nz-text); opacity: .5; }
.nz-chart__mark-label { position: absolute; top: 0; transform: translateX(-50%); font-size: var(--nz-text-2xs); color: var(--nz-text-soft); white-space: nowrap; }
.nz-chart__foot { display: flex; gap: var(--nz-space-3); align-items: center; flex-wrap: wrap; }
.nz-chart__source { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-chart__empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--nz-space-1); min-height: 8rem; color: var(--nz-text-mute); font-size: var(--nz-text-sm); text-align: center; }
.nz-chart__loading { display: flex; align-items: center; justify-content: center; gap: var(--nz-space-2); min-height: 8rem; color: var(--nz-text-mute); font-size: var(--nz-text-sm); }

/* ---- Leyenda ---- */
.nz-legend { display: flex; flex-wrap: wrap; gap: var(--nz-space-2) var(--nz-space-4); }
.nz-legend--vertical { flex-direction: column; gap: var(--nz-space-1); }
.nz-legend__item { display: inline-flex; align-items: center; gap: var(--nz-space-2); font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-legend__swatch { width: 10px; height: 10px; border-radius: var(--nz-radius-xs); background: var(--nz-border-strong); flex: none; }
.nz-legend__swatch--brand { background: var(--nz-brand); }
.nz-legend__swatch--accent { background: var(--nz-accent); }
.nz-legend__swatch--success { background: var(--nz-success); }
.nz-legend__swatch--warning { background: var(--nz-warning); }
.nz-legend__swatch--danger { background: var(--nz-danger); }
.nz-legend__swatch--muted { background: var(--nz-border-strong); }

/* ---- Barras verticales ---- */
.nz-chart-bar { display: flex; align-items: flex-end; gap: var(--nz-space-2); min-height: 8rem; }
.nz-chart-bar--sm { min-height: 5rem; }
.nz-chart-bar--lg { min-height: 12rem; }
.nz-chart-bar__col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: var(--nz-space-1); height: 100%; }
.nz-chart-bar__bar { width: 100%; max-width: 3rem; border-radius: var(--nz-radius-sm) var(--nz-radius-sm) 0 0; background: var(--nz-brand); min-height: 2px; transition: transform var(--nz-dur-base) var(--nz-ease-out); }
.nz-chart-bar__col:hover .nz-chart-bar__bar { transform: scaleY(1.02); transform-origin: bottom; }
.nz-chart-bar__bar--brand { background: var(--nz-brand); }
.nz-chart-bar__bar--accent { background: var(--nz-accent); }
.nz-chart-bar__bar--success { background: var(--nz-success); }
.nz-chart-bar__bar--warning { background: var(--nz-warning); }
.nz-chart-bar__bar--danger { background: var(--nz-danger); }
.nz-chart-bar__bar--muted { background: var(--nz-border-strong); }
.nz-chart-bar__value { font-size: var(--nz-text-2xs); font-weight: 700; color: var(--nz-text-soft); font-variant-numeric: tabular-nums; }
.nz-chart-bar__label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-chart-bar--grouped .nz-chart-bar__col { flex-direction: row; align-items: flex-end; justify-content: center; gap: var(--nz-space-1); }
.nz-chart-bar__group { display: flex; align-items: flex-end; gap: 2px; width: 100%; height: 100%; justify-content: center; }
.nz-chart-bar--stacked .nz-chart-bar__bar { display: flex; flex-direction: column-reverse; border-radius: 0; padding: 0; overflow: hidden; background: transparent; }
.nz-chart-bar__seg { display: block; width: 100%; background: var(--nz-brand); }
.nz-chart-bar__seg--brand { background: var(--nz-brand); }
.nz-chart-bar__seg--accent { background: var(--nz-accent); }
.nz-chart-bar__seg--muted { background: var(--nz-border-strong); }
.nz-chart-bar--stacked .nz-chart-bar__bar > :first-child { border-radius: 0 0 var(--nz-radius-sm) var(--nz-radius-sm); }
.nz-chart-bar--stacked .nz-chart-bar__bar > :last-child { border-radius: var(--nz-radius-sm) var(--nz-radius-sm) 0 0; }
.nz-chart-bar--neg { align-items: stretch; }
.nz-chart-bar__zero { border-top: var(--nz-border-w) solid var(--nz-border); width: 100%; }
.nz-chart-bar--horizontal { flex-direction: column; min-height: 0; }
.nz-chart-bar--horizontal .nz-chart-bar__col { flex-direction: row; align-items: center; justify-content: flex-start; gap: var(--nz-space-2); width: 100%; height: auto; min-height: 24px; }
.nz-chart-bar--horizontal .nz-chart-bar__bar { height: 12px; max-width: none; border-radius: 0 var(--nz-radius-sm) var(--nz-radius-sm) 0; }
.nz-chart-bar--horizontal .nz-chart-bar__label { width: 5rem; flex: none; text-align: right; color: var(--nz-text-soft); }

/* ---- Línea y área (SVG estilizado por clases) ---- */
.nz-chart-line { position: relative; }
.nz-chart-line__svg { width: 100%; height: 10rem; display: block; overflow: visible; }
.nz-chart-line--sm .nz-chart-line__svg { height: 6rem; }
.nz-chart-line--lg .nz-chart-line__svg { height: 14rem; }
.nz-chart-line__area { fill: var(--nz-brand-soft); stroke: none; }
.nz-chart-line__path { fill: none; stroke: var(--nz-brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nz-chart-line__path--accent { stroke: var(--nz-accent); }
.nz-chart-line__path--muted { stroke: var(--nz-border-strong); }
.nz-chart-line__path--dashed { stroke-dasharray: 4 4; }
.nz-chart-line__dot { fill: var(--nz-surface); stroke: var(--nz-brand); stroke-width: 2; }
.nz-chart-line__dot--accent { stroke: var(--nz-accent); }
.nz-chart-line__dot--active { fill: var(--nz-brand); stroke: var(--nz-brand); }
.nz-chart-line--multi .nz-chart-line__area { fill: none; }

/* ---- Sparkline ---- */
.nz-sparkline { display: flex; align-items: flex-end; gap: 2px; height: 2rem; }
.nz-sparkline--lg { height: 3rem; }
.nz-sparkline__bar { flex: 1 1 0; min-height: 2px; border-radius: var(--nz-radius-xs); background: var(--nz-border-strong); }
.nz-sparkline--brand .nz-sparkline__bar { background: var(--nz-brand); }
.nz-sparkline--accent .nz-sparkline__bar { background: var(--nz-accent); }
.nz-sparkline--area .nz-sparkline__bar { border-radius: var(--nz-radius-xs) var(--nz-radius-xs) 0 0; }

/* ---- Donut (SVG) ---- */
.nz-chart-donut { position: relative; display: inline-grid; place-items: center; }
.nz-chart-donut__svg { width: 8rem; height: 8rem; transform: rotate(-90deg); }
.nz-chart-donut--sm .nz-chart-donut__svg { width: 5rem; height: 5rem; }
.nz-chart-donut--lg .nz-chart-donut__svg { width: 11rem; height: 11rem; }
.nz-chart-donut__track { fill: none; stroke: var(--nz-bg-inset); stroke-width: 6; }
.nz-chart-donut__seg { fill: none; stroke: var(--nz-brand); stroke-width: 6; stroke-linecap: butt; }
.nz-chart-donut__seg--brand { stroke: var(--nz-brand); }
.nz-chart-donut__seg--accent { stroke: var(--nz-accent); }
.nz-chart-donut__seg--success { stroke: var(--nz-success); }
.nz-chart-donut__seg--muted { stroke: var(--nz-border-strong); }
.nz-chart-donut__center { position: absolute; display: grid; place-items: center; text-align: center; }
.nz-chart-donut__value { font-size: var(--nz-text-xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; }
.nz-chart-donut__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }

/* ---- Medidor semicircular ---- */
.nz-chart-gauge { position: relative; display: grid; place-items: center; }
.nz-chart-gauge__svg { width: 10rem; height: 5.5rem; }
.nz-chart-gauge--lg .nz-chart-gauge__svg { width: 13rem; height: 7rem; }
.nz-chart-gauge__track { fill: none; stroke: var(--nz-bg-inset); stroke-width: 10; stroke-linecap: round; }
.nz-chart-gauge__fill { fill: none; stroke: var(--nz-brand); stroke-width: 10; stroke-linecap: round; }
.nz-chart-gauge__fill--accent { stroke: var(--nz-accent); }
.nz-chart-gauge__fill--success { stroke: var(--nz-success); }
.nz-chart-gauge__fill--warning { stroke: var(--nz-warning); }
.nz-chart-gauge__fill--danger { stroke: var(--nz-danger); }
.nz-chart-gauge__value { position: absolute; bottom: 0; font-size: var(--nz-text-2xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; }
.nz-chart-gauge__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }

/* ---- Mapa de calor ---- */
.nz-heatmap { display: grid; gap: var(--nz-space-1); }
.nz-heatmap__row { display: grid; grid-template-columns: 4.5rem repeat(7, 1fr); gap: var(--nz-space-1); align-items: center; }
.nz-heatmap__row-label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); }
.nz-heatmap__col-label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); text-align: center; }
.nz-heatmap__cell { aspect-ratio: 1 / 1; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-heatmap__cell--0 { background: var(--nz-bg-inset); }
.nz-heatmap__cell--1 { background: var(--nz-brand-soft); }
.nz-heatmap__cell--2 { background: var(--nz-brand-tint); }
.nz-heatmap__cell--3 { background: var(--nz-blue-300); }
.nz-heatmap__cell--4 { background: var(--nz-brand); }
.nz-heatmap__scale { display: flex; align-items: center; gap: var(--nz-space-1); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-heatmap__scale-step { width: 12px; height: 12px; border-radius: var(--nz-radius-xs); }

/* ---- Calendario de calor ---- */
.nz-heatcalendar { display: grid; gap: var(--nz-space-1); }
.nz-heatcalendar__months { display: grid; grid-auto-flow: column; gap: 3px; font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-heatcalendar__grid { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
.nz-heatcalendar__day { width: 12px; height: 12px; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-heatcalendar__day--0 { background: var(--nz-bg-inset); }
.nz-heatcalendar__day--1 { background: var(--nz-brand-soft); }
.nz-heatcalendar__day--2 { background: var(--nz-brand-tint); }
.nz-heatcalendar__day--3 { background: var(--nz-blue-300); }
.nz-heatcalendar__day--4 { background: var(--nz-brand); }
.nz-heatcalendar__day--hoy { outline: 2px solid var(--nz-accent); outline-offset: 1px; }
.nz-heatcalendar__legend { display: flex; align-items: center; gap: var(--nz-space-1); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }

/* ---- Treemap ---- */
.nz-treemap { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 4rem; gap: 3px; }
.nz-treemap__cell { display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: var(--nz-space-2); border-radius: var(--nz-radius-sm); background: var(--nz-brand); color: var(--nz-text-invert); overflow: hidden; }
.nz-treemap__cell--lg { grid-column: span 2; grid-row: span 2; }
.nz-treemap__cell--brand { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-treemap__cell--accent { background: var(--nz-accent); color: var(--nz-gray-0); }
.nz-treemap__cell--muted { background: var(--nz-bg-inset); color: var(--nz-text-soft); }
.nz-treemap__label { font-size: var(--nz-text-2xs); font-weight: 700; }
.nz-treemap__value { font-size: var(--nz-text-2xs); opacity: .85; font-variant-numeric: tabular-nums; }

/* ---- Embudo ---- */
.nz-funnel { display: grid; gap: var(--nz-space-2); }
.nz-funnel__step { display: grid; gap: 2px; }
.nz-funnel__bar { height: 28px; border-radius: var(--nz-radius-sm); background: var(--nz-brand); margin-inline: auto; }
.nz-funnel__bar--brand { background: var(--nz-brand); }
.nz-funnel__bar--accent { background: var(--nz-accent); }
.nz-funnel__bar--muted { background: var(--nz-border-strong); }
.nz-funnel__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); text-align: center; }
.nz-funnel__value { font-size: var(--nz-text-2xs); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

/* ---- Bullet chart ---- */
.nz-bullet { display: grid; grid-template-columns: 6rem 1fr auto; align-items: center; gap: var(--nz-space-3); }
.nz-bullet__label { font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-bullet__track { position: relative; height: 14px; border-radius: var(--nz-radius-xs); background: var(--nz-bg-inset); }
.nz-bullet__ranges { position: absolute; inset: 0; border-radius: inherit; background: var(--nz-surface-2); width: 100%; }
.nz-bullet__value { position: absolute; inset-block: 3px; left: 0; border-radius: var(--nz-radius-xs); background: var(--nz-brand); }
.nz-bullet__value--brand { background: var(--nz-brand); }
.nz-bullet__value--accent { background: var(--nz-accent); }
.nz-bullet__value--success { background: var(--nz-success); }
.nz-bullet__target { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--nz-text); }
.nz-bullet__num { font-size: var(--nz-text-xs); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--nz-text-soft); }

/* ---- Tabla de barras ---- */
.nz-chart-tablebar { display: grid; gap: var(--nz-space-2); }
.nz-chart-tablebar__row { display: grid; grid-template-columns: 8rem 1fr 3.5rem; align-items: center; gap: var(--nz-space-2); }
.nz-chart-tablebar__name { font-size: var(--nz-text-xs); color: var(--nz-text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nz-chart-tablebar__track { height: 10px; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); overflow: hidden; }
.nz-chart-tablebar__bar { display: block; height: 100%; border-radius: inherit; background: var(--nz-brand); }
.nz-chart-tablebar__num { font-size: var(--nz-text-xs); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* ---- Comparativa de dos series ---- */
.nz-chart-compare { display: grid; gap: var(--nz-space-2); }
.nz-chart-compare__row { display: grid; grid-template-columns: 6rem 1fr 3rem; align-items: center; gap: var(--nz-space-2); }
.nz-chart-compare__name { font-size: var(--nz-text-xs); color: var(--nz-text-soft); }
.nz-chart-compare__pair { display: flex; gap: 2px; align-items: center; }
.nz-chart-compare__bar { height: 10px; border-radius: var(--nz-radius-full); }
.nz-chart-compare__bar--a { background: var(--nz-brand); }
.nz-chart-compare__bar--b { background: var(--nz-accent); }
.nz-chart-compare__num { font-size: var(--nz-text-2xs); text-align: right; font-variant-numeric: tabular-nums; color: var(--nz-text-mute); }

/* ---- Radar (SVG) ---- */
.nz-chart-radar { display: grid; place-items: center; }
.nz-chart-radar__svg { width: 11rem; height: 11rem; }
.nz-chart-radar__web { fill: none; stroke: var(--nz-border); stroke-width: 1; }
.nz-chart-radar__axis { stroke: var(--nz-border-soft); stroke-width: 1; }
.nz-chart-radar__area { fill: var(--nz-brand-soft); stroke: var(--nz-brand); stroke-width: 2; }
.nz-chart-radar__label { fill: var(--nz-text-mute); font-size: var(--nz-text-2xs); }

/* ---- Dispersión ---- */
.nz-chart-scatter { position: relative; height: 10rem; border-left: var(--nz-border-w) solid var(--nz-border); border-bottom: var(--nz-border-w) solid var(--nz-border); }
.nz-chart-scatter__area { position: absolute; inset: 0; }
.nz-chart-scatter__dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--nz-border-strong); transform: translate(-50%, 50%); }
.nz-chart-scatter__dot--brand { background: var(--nz-brand); }
.nz-chart-scatter__dot--accent { background: var(--nz-accent); }
.nz-chart-scatter__x { position: absolute; bottom: calc(var(--nz-space-4) * -1); left: 50%; transform: translateX(-50%); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }
.nz-chart-scatter__y { position: absolute; top: 50%; left: calc(var(--nz-space-4) * -1); transform: translateY(-50%) rotate(-90deg); font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }

/* ---- Cascada ---- */
.nz-chart-waterfall { display: flex; align-items: flex-end; gap: var(--nz-space-2); min-height: 9rem; }
.nz-chart-waterfall__col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: var(--nz-space-1); height: 100%; }
.nz-chart-waterfall__bar { width: 100%; max-width: 2.5rem; border-radius: var(--nz-radius-sm); background: var(--nz-border-strong); }
.nz-chart-waterfall__bar--up { background: var(--nz-success); }
.nz-chart-waterfall__bar--down { background: var(--nz-danger); }
.nz-chart-waterfall__bar--total { background: var(--nz-brand); }
.nz-chart-waterfall__label { font-size: var(--nz-text-2xs); color: var(--nz-text-faint); }

/* ---- Diagrama de flujo (sankey simple) ---- */
.nz-chart-flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--nz-space-4); align-items: center; }
.nz-chart-flow__node { padding: var(--nz-space-2) var(--nz-space-3); border-radius: var(--nz-radius-md); background: var(--nz-brand-soft); color: var(--nz-brand); font-size: var(--nz-text-xs); font-weight: 700; text-align: center; }
.nz-chart-flow__node--brand { background: var(--nz-brand); color: var(--nz-text-invert); }
.nz-chart-flow__node--accent { background: var(--nz-accent-soft); color: var(--nz-accent-strong); }
.nz-chart-flow__node--muted { background: var(--nz-bg-inset); color: var(--nz-text-soft); }
.nz-chart-flow__link { height: 6px; border-radius: var(--nz-radius-full); background: var(--nz-border-strong); }
.nz-chart-flow__label { font-size: var(--nz-text-2xs); color: var(--nz-text-mute); text-align: center; }

/* ---- Selector de rango temporal ---- */
.nz-chart-range { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--nz-radius-full); background: var(--nz-bg-inset); }
.nz-chart-range__btn { min-height: 32px; padding: 0 var(--nz-space-3); border: 0; border-radius: var(--nz-radius-full); background: transparent; color: var(--nz-text-soft); font: inherit; font-size: var(--nz-text-2xs); font-weight: 700; cursor: pointer; }
.nz-chart-range__btn[aria-pressed="true"] { background: var(--nz-surface); color: var(--nz-text); box-shadow: var(--nz-shadow-xs); }

/* ---- Cifra con sparkline ---- */
.nz-chart-stat { display: grid; gap: var(--nz-space-1); }
.nz-chart-stat__label { font-size: var(--nz-text-xs); color: var(--nz-text-mute); }
.nz-chart-stat__value { font-size: var(--nz-text-2xl); font-weight: 800; letter-spacing: var(--nz-tracking-tight); font-variant-numeric: tabular-nums; }
.nz-chart-stat__unit { font-size: var(--nz-text-sm); font-weight: 600; color: var(--nz-text-mute); margin-left: 2px; }
.nz-chart-stat__delta { font-size: var(--nz-text-xs); font-weight: 700; }
.nz-chart-stat__delta--up { color: var(--nz-success); }
.nz-chart-stat__delta--down { color: var(--nz-danger); }
.nz-chart-stat__delta--flat { color: var(--nz-text-mute); }
.nz-chart-stat__spark { margin-top: var(--nz-space-1); }

/* ---- Mini barras dentro de una celda/tabla ---- */
.nz-chart-mini { display: inline-flex; align-items: flex-end; gap: 2px; height: 1rem; }
.nz-chart-mini__bar { width: 3px; border-radius: var(--nz-radius-xs); background: var(--nz-border-strong); }
.nz-chart-mini__bar--brand { background: var(--nz-brand); }
.nz-chart-mini__bar--accent { background: var(--nz-accent); }

@media (min-width: 640px) {
  .nz-chart-bar--horizontal .nz-chart-bar__label { width: 7rem; }
  .nz-bullet { grid-template-columns: 8rem 1fr auto; }
}
@media (min-width: 960px) {
  .nz-chart__body { min-height: 10rem; }
  .nz-chart-line__svg { height: 12rem; }
}


/* ============================================================

/* Planifica — CSS autónomo. Mono azul sólido, mobile-first, sin gradientes. */
:root{
  --pa-primario:#2563eb;
  --pa-primario-osc:#1d4ed8;
  --pa-primario-suave:#e8effd;
  --pa-fondo:#f5f7fa;
  --pa-texto:#101828;
  --pa-texto-suave:#5b6472;
  --pa-borde:#dde3ec;
  --pa-card:#ffffff;
  --pa-ok:#15803d;
  --pa-ok-suave:#e8f6ec;
  --pa-aviso:#b45309;
  --pa-aviso-suave:#fdf3e3;
  --pa-peligro:#dc2626;
  --pa-peligro-suave:#fdecec;
  --pa-radio:10px;
  --pa-sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--pa-fondo);color:var(--pa-texto);
  font-size:15px;line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
a{color:var(--pa-primario)}

/* ---------- Cabecera ---------- */
.pa-cab{
  background:var(--pa-card);border-bottom:1px solid var(--pa-borde);
  padding:10px 14px;position:sticky;top:0;z-index:30;
}
.pa-cab__fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1280px;margin:0 auto}
.pa-marca{display:flex;flex-direction:column;min-width:150px;margin-right:4px}
.pa-marca__nombre{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.pa-marca__sub{font-size:.72rem;color:var(--pa-texto-suave)}
.pa-cab__espacio{flex:1}
.pa-proyecto-picker{display:flex;align-items:center;gap:6px;min-width:220px}
.pa-proyecto-picker select{max-width:240px}

/* ---------- Navegación ---------- */
.pa-tabs{
  display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:0 auto;padding:8px 14px 0;
  -webkit-overflow-scrolling:touch;
}
.pa-tabs::-webkit-scrollbar{height:0}
.pa-tab{
  appearance:none;border:1px solid transparent;background:none;cursor:pointer;
  padding:9px 14px;border-radius:9px 9px 0 0;color:var(--pa-texto-suave);
  font-weight:600;white-space:nowrap;min-height:40px;
}
.pa-tab:hover{background:var(--pa-primario-suave);color:var(--pa-primario-osc)}
.pa-tab.is-activa{
  background:var(--pa-card);color:var(--pa-primario);
  border-color:var(--pa-borde);border-bottom-color:var(--pa-card);
  position:relative;top:1px;
}
main{max-width:1280px;margin:0 auto;padding:16px 14px 60px}

/* ---------- Componentes ---------- */
.pa-card{background:var(--pa-card);border:1px solid var(--pa-borde);border-radius:var(--pa-radio);padding:16px;box-shadow:var(--pa-sombra)}
.pa-card+.pa-card{margin-top:14px}
.pa-card__titulo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.pa-card__titulo h3{margin:0}
.pa-card__titulo .pa-espacio{flex:1}
.pa-fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pa-fila--fin{justify-content:flex-end}
.pa-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.pa-grid--2{grid-template-columns:1fr 1fr}.pa-grid--3{grid-template-columns:repeat(3,1fr)}.pa-grid--4{grid-template-columns:repeat(4,1fr)}}

.pa-btn{
  appearance:none;cursor:pointer;border:1px solid var(--pa-borde);background:var(--pa-card);
  border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600;color:var(--pa-texto);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.pa-btn:hover{border-color:var(--pa-primario);color:var(--pa-primario)}
.pa-btn--primario{background:var(--pa-primario);border-color:var(--pa-primario);color:#fff}
.pa-btn--primario:hover{background:var(--pa-primario-osc);color:#fff}
.pa-btn--peligro{color:var(--pa-peligro);border-color:#f3c1c1}
.pa-btn--peligro:hover{background:var(--pa-peligro-suave);border-color:var(--pa-peligro);color:var(--pa-peligro)}
.pa-btn--mini{padding:4px 9px;min-height:30px;font-size:.82rem;border-radius:7px}
.pa-btn--icono{padding:6px 9px;min-height:34px}

.pa-input,.pa-select,.pa-textarea{
  border:1px solid var(--pa-borde);border-radius:8px;padding:8px 10px;min-height:40px;background:#fff;width:100%;
}
.pa-input:focus,.pa-select:focus,.pa-textarea:focus{outline:2px solid var(--pa-primario-suave);border-color:var(--pa-primario)}
.pa-input--num{text-align:right;min-height:34px;padding:4px 6px;width:64px}
.pa-etiqueta{display:block;font-size:.78rem;font-weight:700;color:var(--pa-texto-suave);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}

/* KPIs */
.pa-kpis{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:760px){.pa-kpis{grid-template-columns:repeat(4,1fr)}}
.pa-kpi{background:var(--pa-card);border:1px solid var(--pa-borde);border-radius:var(--pa-radio);padding:12px 14px}
.pa-kpi__label{font-size:.74rem;font-weight:700;color:var(--pa-texto-suave);text-transform:uppercase;letter-spacing:.05em}
.pa-kpi__valor{font-size:1.35rem;font-weight:800;margin-top:2px}
.pa-kpi__detalle{font-size:.78rem;color:var(--pa-texto-suave)}

/* Tablas */
.pa-tabla-wrap{overflow-x:auto;border:1px solid var(--pa-borde);border-radius:var(--pa-radio);background:var(--pa-card)}
.pa-tabla{border-collapse:collapse;width:100%;font-size:.88rem}
.pa-tabla th,.pa-tabla td{padding:8px 10px;border-bottom:1px solid var(--pa-borde);text-align:left;vertical-align:middle}
.pa-tabla thead th{background:#f2f5f9;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--pa-texto-suave);position:sticky;top:0;z-index:2}
.pa-tabla .pa-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pa-tabla tfoot td{font-weight:800;background:#f8fafc;border-top:2px solid var(--pa-borde)}
.pa-tabla tr.pa-fila-total td{font-weight:800;background:#f8fafc}
.pa-tabla tr:hover td{background:#fbfcfe}
.pa-tabla thead th:hover{background:#e9eef5}
.pa-col-fija{position:sticky;left:0;background:var(--pa-card);z-index:1;min-width:180px;max-width:320px}
.pa-tabla thead .pa-col-fija{z-index:3;background:#f2f5f9}

/* Barras (gráfico mensual) */
.pa-barras{display:flex;align-items:flex-end;gap:6px;height:130px;padding:8px 4px 0;overflow-x:auto}
.pa-barras__item{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.pa-barras__barra{width:100%;max-width:44px;background:var(--pa-primario);border-radius:5px 5px 0 0;min-height:2px}
.pa-barras__label{font-size:.62rem;color:var(--pa-texto-suave);white-space:nowrap}

/* Estructura árbol */
.pa-tarea{border:1px solid var(--pa-borde);border-radius:var(--pa-radio);background:var(--pa-card);margin-bottom:12px;overflow:hidden}
.pa-tarea__cab{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--pa-borde)}
.pa-tarea__cab h4{margin:0;flex:1;min-width:200px;font-size:.95rem}
.pa-tarea__total{font-weight:800;color:var(--pa-primario);white-space:nowrap}
.pa-tarea__cuerpo{padding:10px 12px}
.pa-sub{border:1px solid var(--pa-borde);border-radius:8px;margin-bottom:8px;background:#fff}
.pa-sub__cab{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px}
.pa-sub__cab .pa-sub__nombre{flex:1;min-width:180px;font-weight:600}
.pa-sub__cuerpo{padding:0 10px 10px;display:none}
.pa-sub.is-abierta .pa-sub__cuerpo{display:block}
.pa-linea{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--pa-borde)}
.pa-linea .pa-linea__perfil{flex:1;min-width:200px}
.pa-linea__horas{font-size:.82rem;color:var(--pa-texto-suave);white-space:nowrap}

/* Chips */
.pa-chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;background:var(--pa-primario-suave);color:var(--pa-primario-osc)}
.pa-chip--gris{background:#eef1f5;color:var(--pa-texto-suave)}

/* Avisos */
.pa-aviso{border-radius:8px;padding:10px 12px;border:1px solid;margin:10px 0;font-size:.86rem}
.pa-aviso--info{background:var(--pa-primario-suave);border-color:#c6d7f7;color:#1e40af}
.pa-aviso--ok{background:var(--pa-ok-suave);border-color:#bfe6cb;color:var(--pa-ok)}
.pa-aviso--aviso{background:var(--pa-aviso-suave);border-color:#f2d9ac;color:var(--pa-aviso)}
.pa-aviso--peligro{background:var(--pa-peligro-suave);border-color:#f3c1c1;color:var(--pa-peligro)}

/* Diálogo */
dialog.pa-modal{border:1px solid var(--pa-borde);border-radius:14px;padding:0;max-width:520px;width:92vw;box-shadow:0 20px 50px rgba(16,24,40,.25)}
dialog.pa-modal::backdrop{background:rgba(16,24,40,.45)}
.pa-modal__cab{padding:14px 16px;border-bottom:1px solid var(--pa-borde);font-weight:800}
.pa-modal__cuerpo{padding:14px 16px}
.pa-modal__pie{padding:12px 16px;border-top:1px solid var(--pa-borde);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
#pa-toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pa-texto);color:#fff;padding:10px 18px;border-radius:10px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;text-align:center}
#pa-toast.is-visible{opacity:1}

/* Ocultar importes (modo tiempo) */
body.pa-sin-importes .pa-importe,body.pa-sin-importes .pa-col-importe{display:none!important}

/* ---------- Informe imprimible ---------- */
.pa-informe{background:#fff;color:#111827;max-width:820px;margin:0 auto;padding:28px 26px;border:1px solid var(--pa-borde);border-radius:var(--pa-radio)}
.pa-informe h1{font-size:1.5rem}
.pa-informe h2{font-size:1.05rem;margin-top:1.4em;border-bottom:2px solid var(--pa-primario);padding-bottom:4px;color:var(--pa-primario-osc)}
.pa-informe table{width:100%;border-collapse:collapse;font-size:.82rem;margin:8px 0}
.pa-informe th,.pa-informe td{border:1px solid #d7dde5;padding:5px 8px;text-align:left}
.pa-informe th{background:#eef2f8}
.pa-informe .pa-num{text-align:right;font-variant-numeric:tabular-nums}
.pa-informe__cab{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline;border-bottom:3px solid var(--pa-primario);padding-bottom:10px;margin-bottom:14px}
.pa-informe__marca{font-size:1.1rem;font-weight:800}
.pa-informe__meta{font-size:.78rem;color:#5b6472}
.pa-informe__pie{margin-top:26px;padding-top:10px;border-top:1px solid #d7dde5;font-size:.72rem;color:#5b6472;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media print{
  body{background:#fff}
  .pa-cab,.pa-tabs,footer,#pa-error,#pa-toast{display:none!important}
  main{max-width:none;padding:0;margin:0}
  main section[id^="sec-"]:not(#sec-informe){display:none!important}
  #sec-informe .pa-card{border:none;box-shadow:none;padding:0}
  #sec-informe .pa-card+.pa-card{margin-top:0}
  .pa-informe{border:none;border-radius:0;padding:0;max-width:none}
  .pa-no-imprimir{display:none!important}
  @page{margin:14mm}
}

/* Banner de errores (diagnóstico) */
#pa-error{display:none;background:var(--pa-peligro-suave);color:var(--pa-peligro);border-bottom:1px solid #f3c1c1;padding:8px 14px;font-size:.8rem;white-space:pre-wrap;position:sticky;top:0;z-index:100}
#pa-error.is-visible{display:block}

/* Móvil: tabs y tablas ya con scroll; botones full width en menús de fila */
@media(max-width:560px){
  .pa-card{padding:12px}
  .pa-linea__horas{font-size:.75rem}
}

</style>
