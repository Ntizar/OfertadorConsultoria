<!DOCTYPE html>
<html lang="es" data-nz-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planifica — Ofertas y planificación</title>
<!-- Aurora 7 v7.2.0 — packs incrustados por tools/compilar.py. App autocontenida: sin CDN, sin servidor. -->
<!--PACKS_CSS-->
<!--APP_CSS-->
</head>
<body class="nz">
<div id="pa-error" role="alert"></div>

<header class="nz-navbar">
  <span class="nz-navbar__brand"><img id="pa-logo" class="pa-logo" alt="" hidden> <span id="pa-marca-nombre">Planifica</span></span>
  <span class="nz-navbar__links">
    <select id="pa-sel-oferta" class="nz-input nz-input--sm" aria-label="Oferta activa"></select>
    <button class="nz-btn nz-btn--primary nz-btn--sm" data-acc="nueva-oferta">＋ Oferta</button>
    <button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="dup-oferta" title="Duplicar la oferta activa">⧉</button>
    <button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="elim-oferta" title="Eliminar la oferta activa">✕</button>
    <button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="toggle-importes" id="btn-importes" title="Mostrar u ocultar los importes">👁 €</button>
    <button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="imp-json" title="Importar JSON (oferta, biblioteca o copia completa)">⬆ Importar</button>
  </span>
</header>

<main class="nz-container">
  <div class="pa-fila pa-cabecera">
    <input class="nz-input pa-crece" data-campo="oferta-nombre" id="inp-ofe-nombre" placeholder="Nombre de la oferta">
    <span id="pa-estado-badge"></span>
    <span class="pa-mini" id="pa-meta-oferta"></span>
  </div>

  <div id="pa-herederos"></div>

  <div class="nz-dash-grid nz-dash-grid--4" id="pa-kpis">
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Total oferta</span><span class="nz-kpi__value nz-kpi__value--brand" id="kpi-total">—</span><span class="nz-kpi__delta" id="kpi-total-detalle"></span></div>
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Esfuerzo</span><span class="nz-kpi__value" id="kpi-horas">—</span><span class="nz-kpi__delta" id="kpi-perfiles"></span></div>
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Calendario</span><span class="nz-kpi__value" id="kpi-calendario">—</span><span class="nz-kpi__delta" id="kpi-rango"></span></div>
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Entregables</span><span class="nz-kpi__value" id="kpi-entregables">—</span><span class="nz-kpi__delta" id="kpi-cliente"></span></div>
  </div>

  <nav class="nz-tabs" id="pa-tabs">
    <button class="nz-tabs__tab" data-tab="trabajo" aria-selected="true">Trabajo</button>
    <button class="nz-tabs__tab" data-tab="oferta">Oferta</button>
    <button class="nz-tabs__tab" data-tab="resumen">Resumen</button>
    <button class="nz-tabs__tab" data-tab="informe">Informe</button>
    <button class="nz-tabs__tab" data-tab="ajustes">Ajustes</button>
  </nav>

  <div class="nz-tabs__panel">
    <!-- ===== TRABAJO: calendario + Gantt + editor del esfuerzo ===== -->
    <section id="sec-trabajo">
      <div id="tr-guia"></div>
      <div id="tr-calendario"></div>
      <div id="tr-gantt" class="pa-bloque-gantt"></div>
      <div id="tr-editor"></div>
    </section>

    <!-- ===== OFERTA: datos comerciales, gastos y economía ===== -->
    <section id="sec-oferta" hidden>
      <div id="ofe-datos"></div>
      <div id="ofe-gastos" style="margin-top:var(--nz-space-3)"></div>
      <div id="ofe-economia" style="margin-top:var(--nz-space-3)"></div>
    </section>

    <!-- ===== RESUMEN ===== -->
    <section id="sec-resumen" hidden>
      <div id="res-totales"></div>
      <div class="nz-dash-grid nz-dash-grid--2" style="margin-top:var(--nz-space-3)">
        <div id="res-perfiles"></div>
        <div id="res-tareas"></div>
      </div>
      <div id="res-por-periodo" style="margin-top:var(--nz-space-3)"></div>
      <div id="res-fotos" style="margin-top:var(--nz-space-3)"></div>
    </section>

    <!-- ===== INFORME ===== -->
    <section id="sec-informe" hidden>
      <div class="pa-fila pa-no-imprimir" style="margin-bottom:var(--nz-space-2)">
        <button class="nz-btn nz-btn--primary" data-acc="imprimir">🖨 Imprimir / Guardar PDF</button>
        <button class="nz-btn nz-btn--soft" data-acc="exp-csv">⬇ CSV</button>
        <button class="nz-btn nz-btn--soft" data-acc="exp-json-oferta">⬇ JSON de la oferta</button>
        <span class="pa-espacio"></span>
        <span class="pa-mini" id="pa-guardado"></span>
      </div>
      <article class="nz-article"><div id="informe-cuerpo" class="pa-informe"></div></article>
    </section>

    <!-- ===== AJUSTES ===== -->
    <section id="sec-ajustes" hidden>
      <div id="ajustes-cuerpo"></div>
    </section>
  </div>
</main>

<input type="file" id="pa-fichero" accept=".json,application/json" hidden>
<input type="file" id="pa-logo-fichero" accept="image/*" hidden>

<div id="pa-toast" role="status"></div>

<footer class="nz-statusbar pa-pie">
  <span id="pa-pie-marca">Planifica</span><span class="nz-statusbar__spacer"></span>
  <span>Hecho con ❤️ por David Antizar</span>
</footer>

<script>
/*APP_JS*/
</script>
</body>
</html>
