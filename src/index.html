<!DOCTYPE html>
<html lang="es" data-nz-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planifica — Ofertas y planificación de proyectos</title>
<!-- Aurora 7 v7.2.0 — packs incrustados por tools/compilar.py (app autocontenida, sin CDN) -->
<!--PACKS_CSS-->
<style>
/* CSS propio de la app: SOLO estructura (flex/anchos). Colores y formas: tokens Aurora var(--nz-*). */
.pa-fila{display:flex;flex-wrap:wrap;gap:var(--nz-space-2);align-items:center}
.pa-fila--fin{justify-content:flex-end}
.pa-fila--apretada{gap:var(--nz-space-1)}
.pa-crece{flex:1;min-width:180px}
.pa-crece2{flex:2;min-width:220px}
.pa-espacio{flex:1}
.pa-logo{height:26px;max-width:150px;object-fit:contain;display:block}
.pa-modo-oculto{display:none}
.pa-input-num{max-width:5.5rem;text-align:right}
.pa-input-fecha{max-width:11rem}
.pa-input-ancho{max-width:9rem}
.pa-tarea{margin-bottom:var(--nz-space-3)}
.pa-sub{border:1px solid var(--nz-border);border-radius:var(--nz-radius-md);margin-top:var(--nz-space-2);background:var(--nz-surface)}
.pa-sub__cab{display:flex;flex-wrap:wrap;gap:var(--nz-space-2);align-items:center;padding:var(--nz-space-2)}
.pa-sub__cuerpo{padding:0 var(--nz-space-2) var(--nz-space-2);overflow-x:auto}
.pa-tabla-grid{min-width:100%}
.pa-tabla-grid th,.pa-tabla-grid td{white-space:nowrap}
.pa-tabla-grid td:first-child,.pa-tabla-grid th:first-child{position:sticky;left:0;background:var(--nz-surface);z-index:1;min-width:13rem}
.pa-tabla-grid thead th:first-child{background:var(--nz-surface-2,var(--nz-surface))}
.pa-fila-gasto{display:flex;flex-wrap:wrap;gap:var(--nz-space-2);align-items:center;padding:var(--nz-space-2) 0;border-top:1px dashed var(--nz-border)}
.pa-fila-perfil{display:flex;flex-wrap:wrap;gap:var(--nz-space-2);align-items:center;padding:var(--nz-space-2) 0;border-top:1px dashed var(--nz-border)}
.pa-mini{font-size:var(--nz-text-xs);color:var(--nz-text-soft)}
.pa-informe{max-width:52rem;margin:0 auto}
.pa-informe h1{font-size:var(--nz-text-xl);margin:var(--nz-space-3) 0 var(--nz-space-1)}
.pa-informe h2{font-size:var(--nz-text-md);margin-top:var(--nz-space-4);border-bottom:2px solid var(--nz-brand);padding-bottom:2px}
.pa-informe table{width:100%;border-collapse:collapse;font-size:var(--nz-text-xs);margin:var(--nz-space-2) 0}
.pa-informe th,.pa-informe td{border:1px solid var(--nz-border);padding:var(--nz-space-1) var(--nz-space-2);text-align:left}
.pa-informe th{background:var(--nz-surface-2,var(--nz-surface))}
.pa-num{text-align:right;font-variant-numeric:tabular-nums}
.pa-informe__cab{display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--nz-space-2);align-items:flex-start;border-bottom:3px solid var(--nz-brand);padding-bottom:var(--nz-space-2)}
.pa-informe__pie{margin-top:var(--nz-space-5);padding-top:var(--nz-space-2);border-top:1px solid var(--nz-border);font-size:var(--nz-text-xs);color:var(--nz-text-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--nz-space-2)}
@media print{
  .nz-navbar,.nz-tabs,#pa-error,.pa-no-imprimir{display:none}
  main{padding:0;max-width:none}
  main>section:not(#sec-informe){display:none}
  #sec-informe .nz-article{box-shadow:none;border:none;padding:0}
  .pa-informe{max-width:none}
  body{background:var(--nz-surface)}
  @page{margin:14mm}
}
#pa-error{display:none;background:var(--nz-danger-soft,var(--nz-surface));color:var(--nz-danger);border-bottom:1px solid var(--nz-danger);padding:var(--nz-space-2) var(--nz-space-3);font-size:var(--nz-text-xs);white-space:pre-wrap}
#pa-toast{position:fixed;bottom:3rem;left:50%;transform:translateX(-50%);background:var(--nz-text);color:var(--nz-surface);padding:var(--nz-space-2) var(--nz-space-3);border-radius:var(--nz-radius-md);font-size:var(--nz-text-sm);opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;text-align:center}
#pa-toast.is-visible{opacity:1}
/* Ocultar importes (modo tiempo): los spans/badges con importe llevan .pa-importe */
body.pa-modo-oculto .pa-importe{display:none}
#pa-error.is-visible{display:block}
</style>
</head>
<body class="nz">
<div id="pa-error" role="alert"></div>

<header class="nz-navbar">
  <span class="nz-navbar__brand"><img id="pa-logo" class="pa-logo" alt="" hidden> <span id="pa-marca-nombre">Planifica</span></span>
  <span class="nz-navbar__links">
    <select id="pa-sel-proyecto" class="nz-input nz-input--sm" aria-label="Proyecto activo" style="max-width:240px"></select>
    <button class="nz-btn nz-btn--primary nz-btn--sm" data-acc="nuevo-proyecto">＋ Oferta</button>
    <button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="dup-proyecto" title="Duplicar la oferta activa">⧉</button>
    <button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="elim-proyecto" title="Eliminar la oferta activa">✕</button>
    <button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="toggle-importes" id="btn-importes" title="Mostrar u ocultar todos los importes (€)">👁 €</button>
    <button class="nz-btn nz-btn--soft nz-btn--sm" data-acc="imp-json" title="Importar JSON (oferta, biblioteca o copia completa)">⬆</button>
  </span>
</header>

<main class="nz-container">
  <div class="pa-fila" style="margin:var(--nz-space-3) 0 var(--nz-space-2)">
    <input class="nz-input pa-crece" data-campo="proyecto-nombre" id="inp-proy-nombre" value="" placeholder="Nombre de la oferta" style="font-weight:700">
    <span id="pa-estado-badge"></span>
    <span class="pa-mini" id="pa-meta-proyecto"></span>
  </div>

  <div class="nz-dash-grid nz-dash-grid--4" style="margin-bottom:var(--nz-space-3)">
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Total oferta</span><span class="nz-kpi__value nz-kpi__value--brand" id="kpi-total">—</span><span class="nz-kpi__delta" id="kpi-total-detalle"></span></div>
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Esfuerzo</span><span class="nz-kpi__value" id="kpi-horas">—</span><span class="nz-kpi__delta" id="kpi-estructura"></span></div>
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Media mensual</span><span class="nz-kpi__value" id="kpi-media">—</span><span class="nz-kpi__delta" id="kpi-validez"></span></div>
    <div class="nz-kpi nz-kpi--bordered"><span class="nz-kpi__label">Cliente</span><span class="nz-kpi__value" id="kpi-cliente" style="font-size:var(--nz-text-md)">—</span><span class="nz-kpi__delta" id="kpi-impuestos"></span></div>
  </div>

  <nav class="nz-tabs" id="pa-tabs">
    <button class="nz-tabs__tab" data-tab="estructura" aria-selected="true">Estructura</button>
    <button class="nz-tabs__tab" data-tab="resumen">Resumen</button>
    <button class="nz-tabs__tab" data-tab="cronograma">Cronograma</button>
    <button class="nz-tabs__tab" data-tab="gastos">Gastos</button>
    <button class="nz-tabs__tab" data-tab="informe">Informe</button>
    <button class="nz-tabs__tab" data-tab="ajustes">Ajustes</button>
  </nav>

  <div class="nz-tabs__panel">
    <section id="sec-estructura">
      <div id="pa-guia"></div>
      <div class="pa-fila" style="margin-bottom:var(--nz-space-2)">
        <button class="nz-btn nz-btn--primary" data-acc="nueva-tarea">＋ Añadir tarea</button>
        <button class="nz-btn nz-btn--soft" data-acc="plantilla-dialogo" title="Aplicar una plantilla de tareas recurrentes">📚 Plantillas</button>
        <span class="pa-espacio"></span>
        <button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="abrir-todo">Desplegar todo</button>
        <button class="nz-btn nz-btn--ghost nz-btn--sm" data-acc="cerrar-todo">Plegar todo</button>
      </div>
      <div id="pa-estructura"></div>
    </section>

    <section id="sec-resumen" hidden>
      <div id="res-totales"></div>
      <div class="nz-dash-grid nz-dash-grid--2" style="margin-top:var(--nz-space-3)">
        <div id="res-perfiles"></div>
        <div id="res-tareas"></div>
      </div>
    </section>

    <section id="sec-cronograma" hidden>
      <div id="cro-barras"></div>
      <div id="cro-tabla" style="margin-top:var(--nz-space-3)"></div>
    </section>

    <section id="sec-gastos" hidden>
      <div class="pa-fila" style="margin-bottom:var(--nz-space-2)">
        <button class="nz-btn nz-btn--primary" data-acc="nueva-gasto">＋ Concepto</button>
        <span class="pa-espacio"></span>
        <strong id="gas-total"></strong>
      </div>
      <div id="gas-lista"></div>
    </section>

    <section id="sec-informe" hidden>
      <div class="pa-fila pa-no-imprimir" style="margin-bottom:var(--nz-space-2)">
        <button class="nz-btn nz-btn--primary" data-acc="imprimir">🖨 Imprimir / Guardar PDF</button>
        <button class="nz-btn nz-btn--soft" data-acc="exp-csv">⬇ CSV</button>
        <button class="nz-btn nz-btn--soft" data-acc="exp-json-proy">⬇ JSON de la oferta</button>
        <span class="pa-espacio"></span>
        <span class="pa-mini" id="pa-guardado"></span>
      </div>
      <article class="nz-article"><div id="informe-cuerpo" class="pa-informe"></div></article>
    </section>

    <section id="sec-ajustes" hidden>
      <div id="ajustes-cuerpo"></div>
    </section>
  </div>
</main>

<input type="file" id="pa-fichero" accept=".json,application/json" hidden>
<input type="file" id="pa-logo-fichero" accept="image/*" hidden>

<!-- Modal de plantillas (checkbox hack Aurora, sin JS para abrir) -->
<div class="nz-modal">
  <input type="checkbox" id="pa-modal-plantillas" class="nz-vh">
  <label class="nz-modal__scrim" for="pa-modal-plantillas" data-acc="cerrar-modal-plantillas"></label>
  <div class="nz-modal__dialog">
    <div class="nz-modal__head">
      <h3 class="nz-modal__title">Aplicar plantilla de tareas</h3>
      <label class="nz-modal__close" for="pa-modal-plantillas" data-acc="cerrar-modal-plantillas">✕</label>
    </div>
    <div class="nz-modal__body">
      <p class="pa-mini">Elige qué hacer con las tareas actuales de la oferta y luego aplica una plantilla:</p>
      <label class="nz-checkbox"><input type="checkbox" id="pa-modal-plantillas-reem"><span class="nz-checkbox__box"></span>Reemplazar las tareas actuales (si no, se añaden al final)</label>
      <div id="pa-modal-plantillas-lista"></div>
    </div>
  </div>
</div>

<div id="pa-toast" role="status"></div>

<footer class="nz-statusbar" style="position:fixed;bottom:0;left:0;right:0">
  <span id="pa-pie-marca">Planifica</span><span class="nz-statusbar__spacer"></span>
  <span>Hecho con ❤️ por David Antizar</span>
</footer>

<script>
/*APP_JS*/
</script>
</body>
</html>
